<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>PRUEBA 6.2 · Carga robusta y movilidad heredada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#f1e6d2;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}#top strong{font-size:11px;letter-spacing:.06em;text-shadow:0 2px 5px #000}
button,select{pointer-events:auto;border:1px solid #c4a574;border-radius:9px;background:#211d17ed;color:#f3d7a0;padding:10px 11px;font-weight:700;font-size:11px}button:disabled{opacity:.45}
#controls{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 8px}#animControls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;width:100%}
#status{position:fixed;z-index:4;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 54px);text-align:center;font-size:12px;color:#e8dfce;text-shadow:0 2px 5px #000;pointer-events:none}
#err{position:fixed;z-index:10;left:10px;right:10px;top:26%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none;font-size:12px}
</style></head><body>
<div id="top"><strong>LABORATORIO · PRUEBA 6.2 · HERENCIA DE MOVIMIENTO</strong><button id="back">VOLVER</button></div>
<div id="status">Cargando modelo CC0…</div>
<div id="controls"><button data-angle="0">FRENTE</button><button data-angle="1.57079632679">PERFIL D.</button><button data-angle="3.14159265359">NUCA</button><button data-angle="-1.57079632679">PERFIL I.</button><button id="reset">REINICIAR</button><span id="animControls"><button id="idleBtn" disabled>QUIETO · CARGANDO</button><button id="walkBtn" disabled>CAMINAR · CARGANDO</button><button id="runBtn" disabled>CORRER · CARGANDO</button></span><select id="clipSelect" aria-label="Animación disponible" style="max-width:92vw;display:none"></select></div><div id="err"></div>
<script>
document.getElementById('back').addEventListener('click',function(){location.href='./character-lab.html';});
window.setTimeout(function(){var s=document.getElementById('status');if(s&&/Cargando modelo CC0/.test(s.textContent)){s.textContent='PRUEBA 6.2 · El módulo 3D no inició. Recarga una vez; el botón VOLVER sigue disponible.';}},8000);
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {retargetClip} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/SkeletonUtils.js';
const status=document.getElementById('status'),err=document.getElementById('err');
function showError(s){err.style.display='block';err.textContent=s;}
addEventListener('error',e=>showError('Error de la vista: '+(e.message||'desconocido')));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x171a20);
scene.add(new THREE.HemisphereLight(0xc3d6ee,0x34251d,2));
const key=new THREE.DirectionalLight(0xffe2bd,3);key.position.set(-4,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0x8da9d2,1.5);fill.position.set(5,4,-5);scene.add(fill);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,1000);camera.position.set(0,1,4.9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.3,64),new THREE.MeshStandardMaterial({color:0x292c30,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const loader=new GLTFLoader(),clock=new THREE.Clock();
const targetUrl='https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb';
const yellowUrl='./assets/characters/ual/UAL1_Standard.glb';
let root=null,target=null,donor=null,mixer=null,activeAction=null,clips=[],angle=0,dragging=false,lastX=0,lastY=0,targetLoaded=false,fallbackStarted=false;let targetTimeout=null;
const buttons={idle:document.getElementById('idleBtn'),walk:document.getElementById('walkBtn'),run:document.getElementById('runBtn')};
const selector=document.getElementById('clipSelect');
function fitModel(model){model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());if(!Number.isFinite(s.y)||s.y<=0)throw new Error('GLB sin malla visible');const k=1.82/s.y;model.scale.setScalar(k);model.position.set(-c.x*k,-b.min.y*k,-c.z*k);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material)o.material.side=THREE.DoubleSide;}});}
function showTarget(g,label){targetLoaded=true;if(targetTimeout)clearTimeout(targetTimeout);if(root)scene.remove(root);mixer=null;activeAction=null;target=g.scene;fitModel(target);root=new THREE.Group();root.add(target);scene.add(root);root.rotation.y=angle;camera.position.set(0,1,4.9);camera.lookAt(0,.95,0);status.textContent=label+' · buscando el esqueleto amarillo para heredar movilidad…';}
function loadDonor(){loader.load(yellowUrl,g=>{donor=g.scene;donor.updateMatrixWorld(true);const sourceClips=g.animations||[];if(!sourceClips.length){status.textContent='Modelo CC0 visible; UAL amarillo cargado, pero su GLB no trae animaciones.';setButtonsUnavailable();return;}prepareRetarget(sourceClips);},undefined,e=>{status.textContent='Modelo CC0 visible, pero no se pudo cargar el personaje amarillo como donante.';showError('Falló la carga del personaje amarillo UAL1_Standard.glb: '+(e?.message||'error'));});}
function setButtonsUnavailable(){for(const b of Object.values(buttons)){b.disabled=true;}}
function normalize(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function prepareRetarget(sourceClips){
 clips=[];const errors=[];
 for(const sourceClip of sourceClips){try{const retargeted=retargetClip(target,donor,sourceClip,{preservePosition:true});retargeted.name=sourceClip.name||('Animación '+(clips.length+1));clips.push(retargeted);}catch(e){errors.push((sourceClip.name||'sin nombre')+': '+e.message);}}
 if(!clips.length){status.textContent='Modelo CC0 visible, pero no se pudo transferir ninguna animación del amarillo.';showError('No se pudo adaptar el esqueleto del UAL al modelo CC0. Los esqueletos pueden ser incompatibles. '+errors.join(' | '));setButtonsUnavailable();return;}
 mixer=new THREE.AnimationMixer(target);
 const find=patterns=>clips.find(c=>patterns.some(p=>normalize(c.name).includes(p)));
 const chosen={idle:find(['idle','stand','wait','rest','neutral']),walk:find(['walk','walking','locomotion']),run:find(['run','sprint','jog'])};
 const used=new Set(Object.values(chosen).filter(Boolean));
 for(const key of Object.keys(chosen)){if(!chosen[key]){const next=clips.find(c=>!used.has(c));if(next){chosen[key]=next;used.add(next);}}}
 for(const key of Object.keys(chosen)){const clip=chosen[key],b=buttons[key];if(clip){b.disabled=false;b.textContent=(key==='idle'?'QUIETO':key==='walk'?'CAMINAR':'CORRER')+(normalize(clip.name).match(/(idle|stand|wait|rest|neutral|walk|walking|locomotion|run|sprint|jog)/)?'':' · '+(clips.indexOf(clip)+1);b.onclick=()=>play(clip);}else{b.disabled=true;b.textContent=(key==='idle'?'QUIETO':key==='walk'?'CAMINAR':'CORRER')+' · NO DISP.';}}
 selector.innerHTML='';clips.forEach((clip,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+'. '+clip.name;selector.appendChild(o);});selector.style.display='inline-block';selector.onchange=()=>play(clips[Number(selector.value)]);
 status.textContent='PRUEBA 6.2 · '+clips.length+' animaciones del amarillo adaptadas al hombre CC0. Prueba QUIETO/CAMINAR/CORRER.';
 play(chosen.idle||clips[0]);
}
function play(clip){if(!mixer||!clip)return;if(activeAction)activeAction.fadeOut(.15);const a=mixer.clipAction(clip);a.reset().fadeIn(.15).play();activeAction=a;selector.value=String(clips.indexOf(clip));}
function loadFallback(reason){if(fallbackStarted)return;fallbackStarted=true;status.textContent='El hombre CC0 no respondió a tiempo; cargando el personaje amarillo como respaldo visible…';loader.load(yellowUrl,g=>{target=g.scene;fitModel(target);root=new THREE.Group();root.add(target);scene.add(root);camera.lookAt(0,.95,0);const source=g.animations||[];if(source.length){mixer=new THREE.AnimationMixer(target);clips=source;for(const b of Object.values(buttons))b.disabled=false;buttons.idle.onclick=()=>play(source.find(c=>/idle|stand/i.test(c.name))||source[0]);buttons.walk.onclick=()=>play(source.find(c=>/walk/i.test(c.name))||source[Math.min(1,source.length-1)]);buttons.run.onclick=()=>play(source.find(c=>/run|sprint|jog/i.test(c.name))||source[Math.min(2,source.length-1)]);selector.innerHTML='';source.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+(c.name||'sin nombre');selector.appendChild(o);});selector.style.display='inline-block';selector.onchange=()=>play(source[Number(selector.value)]);play(source[0]);status.textContent='RESPALDO AMARILLO · '+source.length+' animaciones originales. El CC0 no se pudo cargar.';}else showError('No cargó el hombre CC0 ('+reason+') ni se encontraron animaciones en el amarillo.');},undefined,e=>showError('No se pudo cargar el hombre CC0 ('+reason+') ni el amarillo: '+(e?.message||'')));}
// Evita dejar la página indefinidamente en «Cargando personaje» si GitHub externo no responde.\ntargetTimeout=setTimeout(()=>{if(!targetLoaded)loadFallback('tiempo de espera agotado al descargar el GLB CC0');},8000);\nloader.load(targetUrl,g=>{try{showTarget(g,'HOMBRE CC0 · rostro original');loadDonor();}catch(e){showError('No se pudo preparar el modelo CC0: '+e.message);loadFallback(e.message);}},undefined,e=>{if(targetTimeout)clearTimeout(targetTimeout);loadFallback(e?.message||'descarga externa fallida');});
document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>{angle=Number(b.dataset.angle);if(root)root.rotation.y=angle;}));
document.getElementById('reset').onclick=()=>{angle=0;if(root)root.rotation.y=0;camera.position.set(0,1,4.9);camera.lookAt(0,.95,0);};
// El botón VOLVER también tiene un manejador independiente del módulo.
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;angle+=(e.clientX-lastX)*.012;if(root)root.rotation.y=angle;camera.position.y=Math.max(.45,Math.min(2.5,camera.position.y-(e.clientY-lastY)*.008));camera.lookAt(0,.95,0);lastX=e.clientX;lastY=e.clientY;});
const stop=()=>dragging=false;renderer.domElement.addEventListener('pointerup',stop);renderer.domElement.addEventListener('pointercancel',stop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);if(mixer)mixer.update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera);}animate();
</script></body></html>
