<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>PRUEBA 6.3 · Modelo y movilidad</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a20;color:#f1e6d2;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;z-index:4;top:env(safe-area-inset-top);left:0;right:0;padding:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}#top strong{font-size:11px;text-shadow:0 2px 5px #000}button,select{pointer-events:auto;border:1px solid #c4a574;border-radius:9px;background:#211d17;color:#f3d7a0;padding:10px;font-weight:700;font-size:11px}#controls{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 8px}#status{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 50px);left:12px;right:12px;text-align:center;text-shadow:0 2px 5px #000;font-size:12px;pointer-events:none}#error{display:none;position:fixed;z-index:8;top:25%;left:10px;right:10px;background:#401b1b;padding:12px;white-space:pre-wrap}
</style></head><body>
<div id="top"><strong>LABORATORIO · PRUEBA 6.3</strong><button id="back">VOLVER</button></div><div id="status">Iniciando visor 3D…</div><div id="error"></div>
<div id="controls"><button data-a="0">FRENTE</button><button data-a="1.5708">PERFIL D.</button><button data-a="3.14159">NUCA</button><button data-a="-1.5708">PERFIL I.</button><button id="reset">REINICIAR</button><button id="yellow">VER AMARILLO</button><button id="cc0">PROBAR CC0</button><button id="anim" disabled>ANIMACIÓN NO DISP.</button></div>
<script>
document.getElementById('back').onclick=function(){location.href='./character-lab.html';};
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const status=document.getElementById('status'),errorBox=document.getElementById('error');
function fail(e){errorBox.style.display='block';errorBox.textContent=String(e&&e.message||e);status.textContent='PRUEBA 6.3 · error de carga';}
window.addEventListener('error',e=>fail(e.message));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x171a20);
scene.add(new THREE.HemisphereLight(0xd4e2ff,0x382a20,2.1));
const light=new THREE.DirectionalLight(0xffe2bd,3);light.position.set(-4,8,6);scene.add(light);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,1000);camera.position.set(0,1,4.9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.3,48),new THREE.MeshStandardMaterial({color:0x292c30,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const loader=new GLTFLoader();let current=null,mixer=null,actions=[],angle=0,drag=false,lastX=0,lastY=0,serial=0;
const yellowUrl='./assets/characters/ual/UAL1_Standard.glb';
const cc0Url='https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb';
function fit(model){model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());if(!s.y)throw new Error('El GLB no tiene altura visible.');const k=1.82/s.y;model.scale.setScalar(k);model.position.set(-center.x*k,-b.min.y*k,-center.z*k);model.traverse(o=>{if(o.isMesh&&o.material)o.material.side=THREE.DoubleSide;});}
function show(g,label){if(current)scene.remove(current);if(mixer)mixer.stopAllAction();mixer=null;actions=[];current=g.scene;fit(current);const holder=new THREE.Group();holder.add(current);current=holder;scene.add(current);current.rotation.y=angle;camera.position.set(0,1,4.9);camera.lookAt(0,.95,0);const clips=g.animations||[];if(clips.length){mixer=new THREE.AnimationMixer(current.children[0]);actions=clips.map(c=>mixer.clipAction(c));document.getElementById('anim').disabled=false;document.getElementById('anim').textContent='REPRODUCIR '+clips.length+' ANIM.';}else{document.getElementById('anim').disabled=true;document.getElementById('anim').textContent='ANIMACIÓN NO DISP.';}status.textContent='PRUEBA 6.3 · '+label+' · '+clips.length+' animaciones propias';}
function load(url,label){const my=++serial;status.textContent='PRUEBA 6.3 · cargando '+label+'…';errorBox.style.display='none';loader.load(url,g=>{if(my!==serial)return;try{show(g,label);}catch(e){fail(e);}},undefined,e=>{if(my!==serial)return;fail('No se pudo cargar '+label+': '+(e&&e.message||'error de red'));});}
document.getElementById('yellow').onclick=()=>load(yellowUrl,'PERSONAJE AMARILLO');document.getElementById('cc0').onclick=()=>load(cc0Url,'HOMBRE CC0');
document.getElementById('anim').onclick=()=>{if(!actions.length)return;for(const a of actions)a.stop();actions[0].reset().play();status.textContent='PRUEBA 6.3 · reproduciendo: '+actions[0].getClip().name;};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.a);if(current)current.rotation.y=angle;});
document.getElementById('reset').onclick=()=>{angle=0;if(current)current.rotation.y=0;camera.position.set(0,1,4.9);camera.lookAt(0,.95,0);};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-lastX)*.012;if(current)current.rotation.y=angle;camera.position.y=Math.max(.45,Math.min(2.5,camera.position.y-(e.clientY-lastY)*.008));camera.lookAt(0,.95,0);lastX=e.clientX;lastY=e.clientY;});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function frame(){requestAnimationFrame(frame);if(mixer)mixer.update(.016);renderer.render(scene,camera);}frame();
// Load the repository's known local yellow character first so the page is never blank while external CC0 fetch is pending.
load(yellowUrl,'PERSONAJE AMARILLO (BASE LOCAL)');
</script></body></html>
