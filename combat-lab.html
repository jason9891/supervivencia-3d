<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Laboratorio de combate · Personaje</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;cursor:pointer;padding:0;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#run{position:fixed;z-index:20;right:max(28px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui}
#jump{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 28px);width:84px;height:84px;border:2px solid #f3d7a0;border-radius:50%;background:#762b23;color:#fff4df;font:bold 15px system-ui}
#atk{position:fixed;z-index:20;right:max(116px,calc(env(safe-area-inset-right) + 104px));bottom:calc(env(safe-area-inset-bottom) + 40px);width:72px;height:72px;border:2px solid #d8a8a0;border-radius:50%;background:#5a1f1a;color:#fff4df;font:bold 13px system-ui}
#pad{position:fixed;z-index:20;left:16px;bottom:24px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px}
#pad button{border:1px solid #aab4b4aa;border-radius:12px;background:#20272be8;color:#fff;font:22px system-ui}
#back{position:fixed;z-index:25;top:calc(env(safe-area-inset-top) + 8px);right:12px;padding:9px 11px;border:1px solid #c4a574;border-radius:9px;background:#211d17ee;color:#f3d7a0;font:bold 11px system-ui;letter-spacing:.04em;touch-action:manipulation}
#hint{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 8px);left:12px;max-width:55vw;color:#f3d7a0;font:bold 11px system-ui;letter-spacing:.06em;text-shadow:0 2px 4px #000;pointer-events:none}
#guide{position:fixed;z-index:19;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 150px);text-align:center;color:#e8dfce;font:12px system-ui;text-shadow:0 2px 4px #000;pointer-events:none;padding:0 90px}
#error{position:fixed;z-index:30;left:10px;right:10px;top:35%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="hint">LABORATORIO DE COMBATE</div>
<button type="button" id="back" onclick="location.href='./index.html'">VOLVER AL JUEGO</button>
<div id="guide">Abre INVENTARIO → coloca un muñeco → ataca. Mantén ▲ (adelante) o ◀/▶ (lado) al pulsar ATACAR para variar el golpe y encadenar combos.</div>
<div id="pad">
<button data-k="w" style="grid-column:2;grid-row:1">▲</button>
<button data-k="a" style="grid-column:1;grid-row:2">◀</button>
<button data-k="s" style="grid-column:2;grid-row:2">▼</button>
<button data-k="d" style="grid-column:3;grid-row:2">▶</button>
</div>
<button id="atk">ATACAR</button><button id="run">CORRER</button><button id="jump">⬆<br>SALTAR</button>
<div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { createPlayer, stepPlayer, WALK_SPEED, RUN_SPEED } from './course.js';
import { createCombatAddon } from './combat-addon.js';

// Laboratorio: arena plana, sin mapa. Mismo personaje y mismos controles que el juego.
const errorBox = document.getElementById('error');
addEventListener('error', e => { errorBox.style.display = 'block'; errorBox.textContent = 'Error: ' + (e.message || ''); });

const ARENA_R = 13;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151920);
scene.fog = new THREE.Fog(0x151920, 16, 40);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc3d6ee, 0x34251d, 1.6));
const sun = new THREE.DirectionalLight(0xffe2bd, 2.4);
sun.position.set(-6, 14, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 2, far: 50 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(ARENA_R, 64), new THREE.MeshStandardMaterial({ color: 0x3a3732, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(ARENA_R - 0.25, ARENA_R, 64), new THREE.MeshBasicMaterial({ color: 0xc4a574, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; scene.add(ring);

const course = { segments: [{ a: 100, b: -100 }], gaps: 0, freeMap: true };
const player = createPlayer(course);
player.x = 0; player.z = 4; player.y = 0; player.facing = Math.PI;
player.checkpoint = { x: 0, z: 4 };

const hint = document.getElementById('hint');
const actor = new THREE.Group(); scene.add(actor);
let mixer = null, idleA = null, walkA = null, runA = null, attackA = null, activeA = null, attacking = false;
const normName = n => (n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const findClip = (clips, names) => { for (const n of names) { const c = clips.find(i => normName(i.name) === n); if (c) return c; } };
function select(next) {
  if (!next || next === activeA) return;
  if (activeA) activeA.fadeOut(0.15);
  next.reset().fadeIn(0.15).play(); activeA = next;
}
function setup(gltf) {
  const model = gltf.scene; model.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(model), size = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  if (size.y > 0) { const f = 1.82 / size.y; model.scale.setScalar(f); model.position.set(-c.x * f, -b.min.y * f, -c.z * f); }
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  actor.add(model);
  mixer = new THREE.AnimationMixer(model);
  const clips = gltf.animations || [];
  const idle = findClip(clips, ['idle loop', 'idle standing', 'idle']);
  const walk = findClip(clips, ['walk loop', 'walk formal loop', 'walk']);
  const run = findClip(clips, ['sprint loop', 'jog fwd loop', 'run']);
  const atk = findClip(clips, ['sword attack']);
  if (idle) idleA = mixer.clipAction(idle);
  if (walk) walkA = mixer.clipAction(walk);
  if (run) runA = mixer.clipAction(run);
  if (atk) { attackA = mixer.clipAction(atk); attackA.setLoop(THREE.LoopOnce, 1); }
  mixer.addEventListener('finished', e => { if (e.action === attackA) { attacking = false; attackA.fadeOut(0.15); activeA = null; } });
  const ini = idleA || walkA; if (ini) { ini.play(); activeA = ini; }
}
// Solo se lee el personaje; no se modifica su modelo ni su aspecto.
new GLTFLoader().load('./assets/characters/ual/UAL1_Standard.glb', setup, undefined, () => {
  errorBox.style.display = 'block'; errorBox.textContent = 'No se pudo cargar el personaje. Revisa la conexión y recarga.';
});

function playAttackAnim() {
  if (!attackA) return;
  attacking = true;
  if (activeA) activeA.fadeOut(0.1);
  attackA.reset().fadeIn(0.1).play(); activeA = attackA;
}

const combat = createCombatAddon({
  THREE, scene, camera, player,
  onSwing: a => { playAttackAnim(); hint.textContent = (a.combo ? 'COMBO · ' + a.combo.name : a.data.name).toUpperCase(); },
});

const keys = {};
const DIRS = ['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'];
const tapAt = {}; let runLatch = false, jumpQueued = false;
function press(k, repeat) {
  if (DIRS.includes(k) && !keys[k] && !repeat) {
    const now = performance.now();
    if (now - (tapAt[k] ?? -1e9) < 320) runLatch = true;
    tapAt[k] = now;
  }
  keys[k] = true;
}
function release(k) { keys[k] = false; if (!DIRS.some(d => keys[d])) runLatch = false; }
const dirF = () => (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
const dirS = () => (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
function attack() { combat.pressAttack(dirF(), dirS()); }
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); press(k, false); b.setPointerCapture(e.pointerId); });
  const off = () => release(k);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
const runButton = document.getElementById('run');
runButton.addEventListener('pointerdown', e => { e.preventDefault(); keys.run = true; runButton.setPointerCapture(e.pointerId); });
const stopRun = () => { keys.run = false; };
runButton.addEventListener('pointerup', stopRun); runButton.addEventListener('pointercancel', stopRun); runButton.addEventListener('lostpointercapture', stopRun);
document.getElementById('atk').addEventListener('pointerdown', e => { e.preventDefault(); attack(); });
document.getElementById('jump').addEventListener('pointerdown', e => { e.preventDefault(); jumpQueued = true; });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); press(k, e.repeat);
  if (k === ' ') { e.preventDefault(); jumpQueued = true; }
  if (k === 'j' && !e.repeat) attack();
});
addEventListener('keyup', e => release(e.key.toLowerCase()));
document.addEventListener('contextmenu', e => e.preventDefault());

const clock = new THREE.Clock();
const camOffset = new THREE.Vector3(0, 3.1, 6.2);
camera.position.set(player.x + camOffset.x, camOffset.y, player.z + camOffset.z);
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);
  const f = dirF(), side = dirS();
  const running = !!(keys.run || keys.shift || runLatch);
  const speed = running ? RUN_SPEED : WALK_SPEED;
  stepPlayer(player, course, { f, side, speed, running, jump: jumpQueued, canMove: !attacking && !combat.panelOpen }, dt);
  jumpQueued = false;
  // Suelo plano y borde de la arena.
  if (player.vy <= 0 && player.y <= 0) { player.y = 0; player.vy = 0; player.grounded = true; }
  const r = Math.hypot(player.x, player.z);
  if (r > ARENA_R - 0.5) { const k = (ARENA_R - 0.5) / r; player.x *= k; player.z *= k; }

  actor.position.set(player.x, player.y, player.z);
  actor.rotation.y = player.facing;
  if (mixer) {
    if (!attacking) {
      const next = !player.grounded ? idleA : ((f || side) ? (running ? (runA || walkA) : (walkA || idleA)) : (idleA || walkA));
      select(next);
    }
    mixer.update(dt);
  }
  combat.update(dt);

  const camY = Math.max(player.y, -0.5);
  camera.position.lerp(tmpV.set(actor.position.x + camOffset.x, camOffset.y + camY, actor.position.z + camOffset.z), Math.min(1, dt * 3));
  camera.lookAt(actor.position.x, 1.05 + camY, actor.position.z);
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
});
animate();
</script>
</body>
</html>
