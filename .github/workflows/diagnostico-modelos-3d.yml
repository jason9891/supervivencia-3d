name: Diagnostico temporal de modelos 3D
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostico-modelos-3d.yml"
permissions:
  contents: read
  actions: read
jobs:
  inspect-models:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Inspeccionar estructura GLB sin modificar modelos
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function inspect(file) {
            const b = fs.readFileSync(file);
            if (b.toString('ascii',0,4) !== 'glTF') throw new Error(file + ': no es GLB');
            const version = b.readUInt32LE(4);
            let off = 12, doc = null;
            while (off + 8 <= b.length) {
              const len = b.readUInt32LE(off), type = b.readUInt32LE(off+4);
              off += 8;
              if (type === 0x4E4F534A) { doc = JSON.parse(b.toString('utf8',off,off+len).replace(/\\u0000+$/g,'')); break; }
              off += len;
            }
            if (!doc) throw new Error(file + ': falta bloque JSON');
            const nodes = doc.nodes || [], meshes = doc.meshes || [], skins = doc.skins || [], anims = doc.animations || [], mats = doc.materials || [];
            const jointNames = skins.map(s => ({name:s.name||'(sin nombre)', jointCount:(s.joints||[]).length, joints:(s.joints||[]).map(i=>nodes[i]?.name||('node_'+i))}));
            const meshInfo = meshes.map((m,i)=>({
              index:i,name:m.name||('mesh_'+i),
              primitives:(m.primitives||[]).length,
              attributes:[...new Set((m.primitives||[]).flatMap(p=>Object.keys(p.attributes||{})))],
              materials:[...new Set((m.primitives||[]).map(p=>p.material).filter(x=>x!==undefined).map(x=>mats[x]?.name||('material_'+x)))]
            }));
            const namedNodes = nodes.map((n,i)=>({index:i,name:n.name||('node_'+i),mesh:n.mesh!==undefined?(meshes[n.mesh]?.name||('mesh_'+n.mesh)):undefined,skin:n.skin!==undefined?n.skin:undefined,children:n.children||[]}));
            const weightedMeshes = namedNodes.filter(n=>n.mesh!==undefined).map(n=>{
              const m=meshes[nodes[n.index].mesh];
              return {node:n.name,mesh:n.mesh,skinIndex:n.skin,hasJointWeights:(m.primitives||[]).some(p=>p.attributes?.JOINTS_0!==undefined && p.attributes?.WEIGHTS_0!==undefined)};
            });
            const animationInfo = anims.map(a=>({name:a.name||'(sin nombre)',channels:(a.channels||[]).length,targets:[...new Set((a.channels||[]).map(c=>nodes[c.target?.node]?.name||'unknown'))]}));
            return {file,bytes:b.length,glbVersion:version,sceneCount:(doc.scenes||[]).length,nodeCount:nodes.length,meshCount:meshes.length,materialCount:mats.length,skinCount:skins.length,skins:jointNames,meshes:meshInfo,skinnedMeshNodes:weightedMeshes,animations:animationInfo,headRelatedNodes:namedNodes.filter(n=>/head|neck|jaw|face|skull|hair|beard|cabeza|cuello|mandib|rostro|barba|pelo/i.test(n.name)),allNodes:namedNodes};
          }
          const files = [
            'assets/characters/human-base-rigged.glb',
            'assets/characters/ual/UAL1_Standard.glb',
            'assets/characters/animations/locomotion-collection-jordan-3d-person-animated.glb'
          ];
          const reports = files.map(f => fs.existsSync(f) ? inspect(f) : {file:f,error:'No encontrado en checkout'});
          fs.mkdirSync('diagnostico-modelos',{recursive:true});
          fs.writeFileSync('diagnostico-modelos/informe.json',JSON.stringify(reports,null,2));
          for (const r of reports) {
            console.log('\\n=== '+r.file+' ===');
            if(r.error){console.log(r.error);continue;}
            console.log(JSON.stringify({bytes:r.bytes,nodes:r.nodeCount,meshes:r.meshCount,materials:r.materialCount,skins:r.skins.map(s=>({name:s.name,jointCount:s.jointCount,headJoints:s.joints.filter(n=>/head|neck|jaw|face|cabeza|cuello|mandib/i.test(n))})),skinnedMeshNodes:r.skinnedMeshNodes,headRelatedNodes:r.headRelatedNodes,animations:r.animations.map(a=>a.name)},null,2));
          }
          NODE
      - name: Publicar informe como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-modelos-3d
          path: diagnostico-modelos/informe.json
          retention-days: 3
