<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Lab del héroe · animaciones FBX</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#f1e6d2;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#top strong{font-size:11px;letter-spacing:.08em;text-shadow:0 2px 5px #000}
#top a,button,select{pointer-events:auto;border:1px solid #c4a574;border-radius:8px;background:#211d17ed;color:#f3d7a0;padding:8px 10px;font-weight:700;font-size:11px;text-decoration:none}
button.on{background:#3a4a2a;border-color:#8fbf6a}
#status{position:fixed;z-index:6;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 40px);text-align:center;font-size:11px;line-height:1.3;color:#e8dfce;text-shadow:0 2px 5px #000;background:#101114bb;padding:6px 8px;border-radius:8px;border:1px solid #c4a57444;pointer-events:none}
#panel{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,#101114ee 14%,#101114f5);display:flex;flex-direction:column;gap:7px;max-height:42%;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.sl{display:flex;align-items:center;gap:6px;width:100%;max-width:460px;margin:0 auto;font-size:10px;color:#c4a574}
.sl input{flex:1;min-width:0;accent-color:#c4a574}
.sl span{min-width:44px;text-align:right;color:#ddd}
#clips{display:flex;flex-direction:column;gap:6px}
.grp{font-size:10px;letter-spacing:.06em;color:#c4a574;text-align:left;margin-top:2px}
.grid{display:flex;flex-wrap:wrap;gap:5px}
.grid button{font-size:10px;padding:7px 9px}
.grid button.err{border-color:#a33;color:#e99}
#err{position:fixed;z-index:10;left:10px;right:10px;top:40%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none;max-height:30%;overflow:auto}
</style>
</head>
<body>
<div id="top">
  <strong>LAB DEL HÉROE · FBX</strong>
  <div style="display:flex;gap:6px"><a href="index.html">JUEGO</a><a href="enemy-lab.html">LAB ENEMIGO</a></div>
</div>
<div id="status">Cargando personaje…</div>
<div id="panel">
  <div class="row">
    <button id="bPlay" type="button" class="on">⏸ PAUSA</button>
    <button id="bLoop" type="button" class="on">BUCLE</button>
    <button id="bRoot" type="button">MOVIMIENTO RAÍZ: OFF</button>
    <button id="bSkel" type="button">ESQUELETO</button>
    <button id="bAuto" type="button">AUTO ▶ SIGUIENTE</button>
    <button id="bAll" type="button">CARGAR TODAS</button>
    <button id="bFile" type="button">+ AGREGAR FBX…</button>
    <button id="bHide" type="button">▼ OCULTAR LISTA</button>
    <input id="fileIn" type="file" accept=".fbx" multiple hidden>
  </div>
  <div class="sl"><label>t</label><input id="tl" type="range" min="0" max="1000" value="0"><span id="tv">0.00s</span></div>
  <div class="sl"><label>vel</label><input id="sp" type="range" min="10" max="200" value="100"><span id="spv">1.00×</span></div>
  <div id="clips"></div>
</div>
<div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="./hero-lab.js"></script>
</body>
</html>
