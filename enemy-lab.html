<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Laboratorio · Enemigo</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#f1e6d2;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#top strong{font-size:12px;letter-spacing:.09em;text-shadow:0 2px 5px #000}
button{pointer-events:auto;border:1px solid #c4a574;border-radius:9px;background:#211d17ed;color:#f3d7a0;padding:10px 12px;font-weight:700;font-size:12px}
#controls{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom)+16px);display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 10px}
#status{position:fixed;z-index:4;left:12px;right:12px;top:calc(env(safe-area-inset-top)+54px);text-align:center;font-size:12px;color:#e8dfce;text-shadow:0 2px 5px #000;pointer-events:none}
#err{position:fixed;z-index:10;left:10px;right:10px;top:35%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="top">
  <strong>LABORATORIO · ENEMIGO</strong>
  <button id="back" type="button">VOLVER AL JUEGO</button>
</div>
<div id="status">Cargando modelo del enemigo…</div>
<div id="controls">
  <button data-angle="0" type="button">FRENTE</button>
  <button data-angle="1.5708" type="button">PERFIL D.</button>
  <button data-angle="3.1416" type="button">ESPALDA</button>
  <button data-angle="-1.5708" type="button">PERFIL I.</button>
  <button id="reset" type="button">REINICIAR</button>
</div>
<div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/meshopt_decoder.module.js';

const ENEMY_URL = './assets/characters/tripo_pbr_model_739224f1-e1dd-4aec-976a-084ab2e81a3d_meshopt.glb';
const TARGET_HEIGHT = 1.9;

const err = document.getElementById('err');
const statusEl = document.getElementById('status');
addEventListener('error', e => {
  err.style.display = 'block';
  err.textContent = 'Error: ' + (e.message || '');
});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a20);
scene.add(new THREE.HemisphereLight(0xc3d6ee, 0x34251d, 1.8));
const key = new THREE.DirectionalLight(0xffe2bd, 2.6);
key.position.set(-4, 8, 6);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8da9d2, 1.2);
fill.position.set(5, 4, -5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xff8866, 0.8);
rim.position.set(0, 3, -6);
scene.add(rim);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshStandardMaterial({ color: 0x292c30, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

let modelRoot = null;
let targetY = 0;
let dragging = false;
let lastX = 0;
let lastY = 0;

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
statusEl.textContent = 'Cargando enemigo (puede tardar un poco, ~22 MB)…';

loader.load(
  ENEMY_URL,
  (gltf) => {
    const model = gltf.scene;
    model.updateMatrixWorld(true);

    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());
    const scale = size.y > 0 ? TARGET_HEIGHT / size.y : 1;
    model.scale.setScalar(scale);
    model.position.set(-center.x * scale, -bounds.min.y * scale, -center.z * scale);

    let meshes = 0, mats = 0;
    model.traverse((o) => {
      if (!o.isMesh) return;
      meshes++;
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        const list = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of list) {
          mats++;
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
          if (m.emissiveMap) m.emissiveMap.colorSpace = THREE.SRGBColorSpace;
        }
      }
    });

    modelRoot = new THREE.Group();
    modelRoot.add(model);
    scene.add(modelRoot);

    const animCount = (gltf.animations || []).length;
    statusEl.textContent =
      'ENEMIGO listo · ' + meshes + ' mallas · ' + mats + ' mats · ' +
      animCount + ' animaciones · arrastra para girar · rueda para zoom';
  },
  (ev) => {
    if (!ev.total) return;
    const pct = Math.round((ev.loaded / ev.total) * 100);
    statusEl.textContent = 'Cargando enemigo… ' + pct + '%';
  },
  (e) => {
    err.style.display = 'block';
    err.textContent =
      'No se pudo cargar el GLB del enemigo.\n' +
      ENEMY_URL + '\n' +
      ((e && e.message) || e || '');
    statusEl.textContent = 'Error al cargar el modelo';
  }
);

function setAngle(a) {
  targetY = a;
  if (modelRoot) modelRoot.rotation.y = a;
}

document.querySelectorAll('[data-angle]').forEach((b) => {
  b.addEventListener('click', () => setAngle(Number(b.dataset.angle)));
});
document.getElementById('reset').addEventListener('click', () => {
  setAngle(0);
  camera.position.set(0, 1.5, 5.5);
});
document.getElementById('back').addEventListener('click', () => {
  location.href = './index.html';
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  targetY += (e.clientX - lastX) * 0.012;
  camera.position.y = Math.max(0.5, Math.min(3.2, camera.position.y - (e.clientY - lastY) * 0.008));
  lastX = e.clientX;
  lastY = e.clientY;
  if (modelRoot) modelRoot.rotation.y = targetY;
});
const stop = () => { dragging = false; };
renderer.domElement.addEventListener('pointerup', stop);
renderer.domElement.addEventListener('pointercancel', stop);
renderer.domElement.addEventListener('wheel', (e) => {
  camera.position.z = Math.max(2.5, Math.min(12, camera.position.z + e.deltaY * 0.006));
});

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  camera.lookAt(0, 0.95, 0);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
