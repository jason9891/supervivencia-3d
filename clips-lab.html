<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Lab de animaciones · sera_limpio</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#f1e6d2;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#top strong{font-size:11px;letter-spacing:.08em;text-shadow:0 2px 5px #000}
a,button,select,input[type=text]{pointer-events:auto;border:1px solid #c4a574;border-radius:8px;background:#211d17ed;color:#f3d7a0;padding:8px 9px;font-weight:700;font-size:11px;text-decoration:none}
#tabs button{padding:7px 7px;font-size:10px}
input[type=text]{font-weight:500;color:#f1e6d2;min-width:0;-webkit-user-select:text;user-select:text}
button.cat{padding:5px 5px;font-size:9px;margin:0 1px;opacity:.55}button.cat.act{opacity:1;background:#2a3a24}button.cat.basica{border-color:#6aa0bf;color:#a8d4f0}button.cat.ataque{border-color:#bf6a6a;color:#f0a8a8}button.cat.mapa{border-color:#bfa06a;color:#f0d8a8}
button.on{background:#3a4a2a;border-color:#8fbf6a}
button:disabled{opacity:.45}
#status{position:fixed;z-index:6;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 40px);text-align:center;font-size:11px;line-height:1.3;color:#e8dfce;text-shadow:0 2px 5px #000;background:#101114bb;padding:6px 8px;border-radius:8px;border:1px solid #c4a57444;pointer-events:none}
#panel{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,#101114ee 10%,#101114f5);display:flex;flex-direction:column;gap:6px;height:56%}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
.sl{display:flex;align-items:center;gap:6px;width:100%;max-width:460px;margin:0 auto;font-size:10px;color:#c4a574}
.sl input{flex:1;min-width:0;accent-color:#c4a574}
.sl span{min-width:44px;text-align:right;color:#ddd}
#list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:6px;background:#1b1812;border:1px solid #c4a57433;border-radius:8px;padding:3px 6px}
.item.cur{border-color:#8fbf6a;background:#26301d}
.item .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:7px 4px;font-size:11px;color:#f1e6d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .du{font-size:10px;color:#a99b80;min-width:38px;text-align:right}
.item .src{font-size:9px;color:#8a7d66;min-width:34px}
.item input[type=checkbox]{width:22px;height:22px;accent-color:#8fbf6a;flex:none}
.item input[type=text]{flex:1;padding:6px 7px}
.grp{font-size:10px;letter-spacing:.06em;color:#c4a574;text-align:left;margin:4px 0 1px}
#adj[hidden]{display:none}#adj{display:flex;flex-direction:column;gap:4px}
#err{position:fixed;z-index:10;left:10px;right:10px;top:40%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none;max-height:30%;overflow:auto}
</style>
</head>
<body>
<div id="top">
  <strong>LAB DE ANIMACIONES · SERA</strong>
  <div style="display:flex;gap:6px"><a href="hero-lab.html">LAB FBX</a><a href="index.html">JUEGO</a></div>
</div>
<div id="status">Cargando personaje…</div>
<div id="panel">
  <div class="row" id="tabs"></div>
  <div class="row">
    <button id="bPlay" type="button" class="on">⏸</button>
    <button id="bLoop" type="button" class="on">BUCLE</button>
    <button id="bPlace" type="button" class="on">EN SITIO</button>
    <button id="bSkel" type="button">ESQUELETO</button>
    <button id="bAuto" type="button">AUTO ▶▶</button>
    <button id="bSet" type="button">AJUSTES</button>
  </div>
  <div class="sl"><label>t</label><input id="tl" type="range" min="0" max="1000" value="0"><span id="tv">0.00s</span></div>
  <div id="adj" hidden>
    <div class="sl"><label>Velocidad</label><input id="sp" type="range" min="20" max="200" value="100"><span id="spv">1.00×</span></div>
    <div class="sl"><label>Zancada</label><input id="st" type="range" min="80" max="160" value="100"><span id="stv">1.00×</span></div>
  </div>
  <div class="row" id="armorRow"></div>
  <div id="list"></div>
  <div class="row">
    <button id="bExp" type="button">⬇ CREAR GLB</button>
    <button id="bSel" type="button">GUARDAR</button>
    <button id="bLoad" type="button">CARGAR</button>
    <button id="bClear" type="button">QUITAR</button>
    <input id="fileIn" type="file" accept="application/json,.json" hidden>
  </div>
</div>
<div id="err"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="./clips-lab.js"></script>
</body>
</html>
