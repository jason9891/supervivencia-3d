<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa Pro</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    color: white; font-family: sans-serif; cursor: pointer; z-index: 100;
  }
  #overlay h1 { font-size: 40px; text-shadow: 2px 2px 4px #000; margin: 0; }
  .hud { position: fixed; bottom: 10px; left: 10px; color: white; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; pointer-events: none; z-index: 10;}
</style>
</head>
<body>
<div id="overlay">
  <h1>Haz Clic para entrar</h1>
  <p>WASD mover · G caminar con colisiones / volar · Espacio saltar o subir · T textura · O poner objeto · E editar objeto (R girar, +/− tamaño, M mover, P panel)</p>
  <div id="hora-box" onclick="event.stopPropagation()" style="margin-top:14px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.5);padding:8px 14px;border-radius:8px;cursor:default">
    <label for="hora-t">🕒 Hora del día</label>
    <input id="hora-t" type="time" value="12:00" style="font-size:16px">
    <input id="hora-r" type="range" min="0" max="24" step="0.25" value="12" style="width:220px">
    <small style="opacity:.7">[ / ] ±30 min</small>
  </div>
  <p id="mapas-aviso" onclick="event.stopPropagation()" style="display:none;margin:10px 0 0;max-width:min(640px,90vw);text-align:center;cursor:default"></p>
  <div id="mapas-box" onclick="event.stopPropagation()" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.5);padding:8px 14px;border-radius:8px;cursor:default">
    <label for="mapas-sel">🗂️ Mapa</label>
    <select id="mapas-sel" style="font-size:15px;max-width:60vw"><option value="">Mapa del editor (este navegador)</option></select>
    <small id="mapas-nota" style="opacity:.75"></small>
  </div>
</div>
<div class="hud" id="zone">Cargando motor...</div>

<script src="./celdas.js?v=22"></script>
<script src="./mapas-repo.js?v=1"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js?v=26"></script>
</body>
</html>
