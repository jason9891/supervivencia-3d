<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Taller de equipo · Personaje</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12151a;color:#f1e6d2;font:13px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
button,select{font:inherit;color:#f3d7a0;background:#211d17ee;border:1px solid #c4a574;border-radius:9px;padding:8px 10px;touch-action:manipulation}
button{font-weight:700;font-size:12px;cursor:pointer}
button.on{background:#6b5a22;border-color:#f3d7a0}
#top{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}#top strong{font-size:12px;letter-spacing:.08em;text-shadow:0 2px 5px #000;pointer-events:none}
#views{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 56px);right:12px;display:flex;flex-direction:column;gap:6px}
#status{position:fixed;z-index:4;left:12px;top:calc(env(safe-area-inset-top) + 52px);max-width:55vw;font-size:11px;color:#e8dfce;text-shadow:0 2px 5px #000;pointer-events:none}
#panel{position:fixed;z-index:5;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:#14110dee;border-top:1px solid #c4a574;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#panel label{display:grid;gap:3px;font-size:10px;letter-spacing:.08em;color:#c9b88f}
#panel .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#panel h4{grid-column:1/-1;margin:2px 0 0;font-size:10px;letter-spacing:.1em;color:#c4a574}
#stats{grid-column:1/-1;font-size:12px;color:#e8dfce}
#error{position:fixed;z-index:10;left:10px;right:10px;top:30%;padding:12px;background:#401b1b;color:#fff;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="top"><strong>TALLER DE EQUIPO</strong><span><button id="toCombat">COMBATE</button> <button id="back">VOLVER AL JUEGO</button></span></div>
<div id="status">Cargando personaje…</div>
<div id="views"><button data-view="front">FRENTE</button><button data-view="side">PERFIL</button><button data-view="back">ESPALDA</button><button data-view="head">CABEZA</button><button data-view="hand">MANO</button><button id="spin">GIRAR</button></div>
<div id="panel">
  <h4>EQUIPO</h4>
  <label>ARMA<select id="s-weapon"></select></label>
  <label>CASCO<select id="s-casco"></select></label>
  <label>PECHERA<select id="s-pechera"></select></label>
  <label>GREBAS<select id="s-grebas"></select></label>
  <label>ESCUDO<select id="s-escudo"></select></label>
  <div class="row"><button data-preset="nada">SIN EQUIPO</button><button data-preset="cuero">CUERO</button><button data-preset="malla">MALLA</button><button data-preset="placas">PLACAS</button><button data-preset="rand">AL AZAR</button></div>
  <div id="stats"></div>
  <h4>MOVIMIENTO</h4>
  <div class="row" id="moves"></div>
  <div class="row"><label style="flex:1;min-width:200px">TODAS LAS ANIMACIONES<select id="clipPick"></select></label></div>
</div>
<div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import * as C from './combat.js';
import { loadHero, fitModel } from './hero.js';
import { createEquipment } from './equipment.js';

// Taller de equipo: el humano (CC0) con las animaciones de UAL y las piezas de equipment.js (las mismas del juego).
// Sin enlaces externos: todo sale del repositorio. Solo muestra; no cambia el personaje ni el mapa.
const $ = id => document.getElementById(id);
const errorBox = $('error'), status = $('status');
addEventListener('error', e => { errorBox.style.display = 'block'; errorBox.textContent = 'Error: ' + (e.message || ''); });

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x171a20);
scene.add(new THREE.HemisphereLight(0xd4e2ff, 0x382a20, 2.0));
const key = new THREE.DirectionalLight(0xffe2bd, 3); key.position.set(-4, 8, 6); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0x8da9d2, 1.4); rim.position.set(5, 4, -5); scene.add(rim);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 60);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshStandardMaterial({ color: 0x2c2f33, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// --- Selectores de equipo (nombres y piezas salen de combat.js) ---
const equip = C.defaultEquipment();
const SLOT_IDS = ['weapon', 'casco', 'pechera', 'grebas', 'escudo'];
const table = slot => slot === 'weapon' ? C.WEAPONS : C.ARMOR[slot];
for (const slot of SLOT_IDS) {
  const sel = $('s-' + slot);
  for (const [id, it] of Object.entries(table(slot))) sel.add(new Option(it.name, id));
  sel.value = equip[slot];
  sel.addEventListener('change', () => { equip[slot] = sel.value; refresh(); });
}
const none = { casco: 'ninguno', pechera: 'ninguna', grebas: 'ninguna', escudo: 'ninguno' };
const PRESETS = {
  nada: () => ({ ...none }),
  cuero: () => ({ casco: 'cuero', pechera: 'cuero', grebas: 'cuero', escudo: 'rodela' }),
  malla: () => ({ casco: 'malla', pechera: 'malla', grebas: 'malla', escudo: 'escudo' }),
  placas: () => ({ casco: 'placas', pechera: 'placas', grebas: 'placas', escudo: 'torre' }),
  rand: () => Object.fromEntries(C.SLOTS.map(s => { const ids = Object.keys(C.ARMOR[s]); return [s, ids[Math.floor(Math.random() * ids.length)]]; })),
};
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  Object.assign(equip, PRESETS[b.dataset.preset]()); for (const s of SLOT_IDS) $('s-' + s).value = equip[s]; refresh();
}));

// --- Personaje ---
let info = null, mixer = null, eqv = null, unit = 1, current = null, comboTimer = null;
const store = {}, actions = new Map(), pool = new Map();
const norm = n => (n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const actor = new THREE.Group(); scene.add(actor);

function refresh() {
  if (eqv) eqv.apply(info.model, equip, store, unit);
  const st = C.computeStats(equip);
  $('stats').textContent = 'Defensa ' + st.defense + ' · Peso ' + st.weight + ' · Bloqueo ' + Math.round(st.blockFrac * 100) + '% · Velocidad ×' + st.speedMul.toFixed(2);
}
function play(name, { loop = true, rate = 1 } = {}) {
  const clip = pool.get(norm(name)); if (!clip || !mixer) return false;
  let a = actions.get(clip.name); if (!a) { a = mixer.clipAction(clip); actions.set(clip.name, a); }
  a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1); a.clampWhenFinished = !loop;
  a.setEffectiveTimeScale(rate);
  if (current && current !== a) current.fadeOut(0.18);
  a.reset().fadeIn(0.18).play(); current = a;
  $('clipPick').value = clip.name; status.textContent = (info.source === 'hero' ? 'Humano' : 'Maniquí (respaldo)') + ' · ' + clip.name;
  return true;
}
function stopCombo() { clearTimeout(comboTimer); comboTimer = null; $('combo')?.classList.remove('on'); }
function combo() {
  if (comboTimer) return stopCombo();
  $('combo').classList.add('on');
  const steps = ['Sword_Regular_A', 'Sword_Regular_B', 'Sword_Regular_C'];
  let i = 0;
  const next = () => {
    if (!play(steps[i % 3], { loop: false })) return stopCombo();
    const last = i % 3 === 2; i++;
    comboTimer = setTimeout(next, last ? 1900 : 700);   // tras el 3.º, pausa y vuelve a empezar
  };
  next();
}
const MOVES = [['REPOSO', 'Idle_Loop'], ['ESPADA', 'Sword_Idle'], ['GUARDIA', 'Idle_Shield_Loop'], ['CAMINAR', 'Walk_Loop'], ['CORRER', 'Sprint_Loop'], ['BEBER', 'Consume'], ['GOLPE RECIBIDO', 'Hit_Chest'], ['MORIR', 'Death01']];
for (const [label, clip] of MOVES) {
  const b = document.createElement('button'); b.textContent = label;
  b.addEventListener('click', () => { stopCombo(); play(clip, { loop: !/Consume|Hit_|Death/.test(clip) }); });
  $('moves').appendChild(b);
}
for (const [label, clip] of [['GOLPE 1', 'Sword_Regular_A'], ['GOLPE 2', 'Sword_Regular_B'], ['GOLPE 3', 'Sword_Regular_C'], ['ESTOCADA', 'Sword_Dash']]) {
  const b = document.createElement('button'); b.textContent = label;
  b.addEventListener('click', () => { stopCombo(); play(clip, { loop: false }); });
  $('moves').appendChild(b);
}
const cb = document.createElement('button'); cb.id = 'combo'; cb.textContent = 'COMBO 1-2-3'; cb.addEventListener('click', combo); $('moves').appendChild(cb);
$('clipPick').addEventListener('change', e => { stopCombo(); play(e.target.value); });

loadHero(THREE, GLTFLoader).then(i => {
  info = i; unit = 1 / fitModel(THREE, i.model); actor.add(i.model);
  mixer = new THREE.AnimationMixer(i.model);
  for (const c of i.clips) pool.set(norm(c.name), c);
  for (const c of [...pool.values()].sort((a, b) => a.name.localeCompare(b.name))) $('clipPick').add(new Option(c.name, c.name));
  eqv = createEquipment(THREE, i.profile);
  eqv.loadModels(GLTFLoader).then(n => { refresh(); if (n < 6) console.warn('Modelos de armas cargados:', n, '/ 6 (el resto usa formas simples)'); });
  refresh(); play('Idle_Loop');
  if (i.source !== 'hero') { errorBox.style.display = 'block'; errorBox.textContent = 'No se pudo cargar el humano (assets/characters/hero/night-striker.glb). Se muestra el maniquí amarillo de respaldo.'; }
}).catch(e => { errorBox.style.display = 'block'; errorBox.textContent = 'No se pudo cargar el personaje: ' + ((e && e.message) || e); });

// --- Cámara: arrastra para girar, rueda o pellizco para acercar; botones de vista ---
let yaw = 0.35, pitch = 0.12, dist = 4.4, target = new THREE.Vector3(0, 0.95, 0), spin = false;
const VIEWS = { front: [0, 0.12, 4.4, 0.95], side: [Math.PI / 2, 0.12, 4.4, 0.95], back: [Math.PI, 0.12, 4.4, 0.95], head: [0.25, 0.05, 1.3, 1.62], hand: [0.9, 0.1, 1.3, 1.1] };
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { const v = VIEWS[b.dataset.view]; [yaw, pitch, dist] = v; target.y = v[3]; spin = false; $('spin').classList.remove('on'); }));
$('spin').addEventListener('click', e => { spin = !spin; e.currentTarget.classList.toggle('on', spin); });
const pts = new Map(); let pinch = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) dist = Math.min(8, Math.max(0.8, dist * pinch / d)); pinch = d; }
  else { yaw -= (e.clientX - p.clientX) * 0.01; pitch = Math.max(-0.4, Math.min(1.0, pitch + (e.clientY - p.clientY) * 0.006)); }
  pts.set(e.pointerId, e);
});
const up = e => { pts.delete(e.pointerId); pinch = 0; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { dist = Math.min(8, Math.max(0.8, dist + e.deltaY * 0.004)); });
$('back').addEventListener('click', () => { location.href = './index.html'; });
$('toCombat').addEventListener('click', () => { location.href = './combat-lab.html'; });

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(dt);
  if (spin) yaw += dt * 0.6;
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
animate();
</script>
</body>
</html>
