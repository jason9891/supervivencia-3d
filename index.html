gltfLoader.load('./assets/characters/human-base-rigged.glb',gltf=>{
 const model=gltf.scene;

let attackAction=null,swordIdleAction=null,jumpStartAction=null,jumpLoopAction=null,attacking=false,armed=false;
const normName=n=>(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const CLIP_NAMES={idle:['idle loop','idle standing','idle'],walk:['walk loop','walk formal loop','walk relaxed','walk brisk'],run:['sprint loop','jog fwd loop','run','jog'],attack:['sword attack'],swordIdle:['sword idle'],jumpStart:['jump start'],jumpLoop:['jump loop']};
function findClip(clips,names){for(const n of names){const c=clips.find(item=>normName(item.name)===n);if(c)return c;}return undefined;}
function addHeadFaceTexture(model,factor){
 let headBone=null;
 model.traverse(obj=>{if(!headBone&&obj.isBone){const n=normName(obj.name);if(n.split(' ').includes('head')&&!n.includes('end'))headBone=obj;}});
 if(!headBone)return false;
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;

 c.save();c.beginPath();c.ellipse(256,270,177,218,0,0,Math.PI*2);c.clip();
 const skinGrad=c.createLinearGradient(70,150,440,430);skinGrad.addColorStop(0,'#d6a17b');skinGrad.addColorStop(.52,'#b97f5d');skinGrad.addColorStop(1,'#88553f');

 // Cejas.
 c.strokeStyle='#30211c';c.lineWidth=17;c.lineCap='round';
 c.beginPath();c.moveTo(132,222);c.quadraticCurveTo(177,198,216,222);c.stroke();
 c.beginPath();c.moveTo(296,222);c.quadraticCurveTo(340,198,380,222);c.stroke();
 // Ojos con iris cálido y reflejo.
 for(const x of [176,337]){
  c.fillStyle='#f3e5d2';c.beginPath();c.ellipse(x,252,34,19,0,0,Math.PI*2);c.fill();
  c.fillStyle='#49382b';c.beginPath();c.arc(x,253,13,0,Math.PI*2);c.fill();
  c.fillStyle='#171514';c.beginPath();c.arc(x,253,7,0,Math.PI*2);c.fill();
  c.fillStyle='#fff4df';c.beginPath();c.arc(x-4,248,4,0,Math.PI*2);c.fill();
 }
 // Nariz sombreada y labios.
 c.fillStyle='#8e5944';c.beginPath();c.moveTo(256,260);c.lineTo(231,328);c.quadraticCurveTo(256,346,282,328);c.closePath();c.fill();
 c.fillStyle='#6f4035';c.beginPath();c.moveTo(207,373);c.quadraticCurveTo(256,357,305,373);c.quadraticCurveTo(256,401,207,373);c.fill();
 c.fillStyle='#c27c69';c.fillRect(226,373,60,5);
 // Barba corta y bigote, manteniendo la expresión serena.
 c.fillStyle='rgba(43,31,27,.82)';c.beginPath();c.moveTo(91,337);c.quadraticCurveTo(116,420,190,456);c.quadraticCurveTo(256,483,322,456);c.quadraticCurveTo(396,420,421,337);c.quadraticCurveTo(367,380,308,388);c.quadraticCurveTo(256,410,204,388);c.quadraticCurveTo(145,380,91,337);c.fill();
 c.beginPath();c.ellipse(256,357,57,18,0,0,Math.PI*2);c.fill();
 c.restore();
 const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.needsUpdate=true;
 const width=.19/Math.max(factor,.0001),height=.22/Math.max(factor,.0001);
 const geometry=new THREE.PlaneGeometry(width,height,10,10);

 for(let i=0;i<pos.count;i++){const x=pos.getX(i);const u=x/(width*.5);pos.setZ(i,.012/Math.max(factor,.0001)*(1-u*u));}

  {p:[0,y,-offset],r:Math.PI},
  {p:[offset,y,0],r:Math.PI/2},
  {p:[-offset,y,0],r:-Math.PI/2}

 for(let i=0;i<placements.length;i++){
  const item=placements[i],decal=new THREE.Mesh(geometry,material);
  decal.name='HeadFaceTextureTest_'+i;
  decal.position.set(item.p[0],item.p[1],item.p[2]);
  decal.rotation.y=item.r;

}

function setupLocomotion(gltf,label){
 const model=gltf.scene;model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());
 if(size.y>0){const factor=1.82/size.y;model.scale.setScalar(factor);model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);}
 model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;obj.frustumCulled=false;}});

 locomotionActor.add(model);locomotionModelLoaded=true;locomotionMixer=new THREE.AnimationMixer(model);

 const idleClip=findClip(clips,CLIP_NAMES.idle),walkClip=findClip(clips,CLIP_NAMES.walk),runClip=findClip(clips,CLIP_NAMES.run);
 const attackClip=findClip(clips,CLIP_NAMES.attack),swordIdleClip=findClip(clips,CLIP_NAMES.swordIdle);
 if(idleClip)idleAction=locomotionMixer.clipAction(idleClip);if(walkClip)walkAction=locomotionMixer.clipAction(walkClip);if(runClip)runAction=locomotionMixer.clipAction(runClip);if(swordIdleClip)swordIdleAction=locomotionMixer.clipAction(swordIdleClip);
 const jumpStartClip=findClip(clips,CLIP_NAMES.jumpStart),jumpLoopClip=findClip(clips,CLIP_NAMES.jumpLoop);
 if(jumpStartClip){jumpStartAction=locomotionMixer.clipAction(jumpStartClip);jumpStartAction.setLoop(THREE.LoopOnce,1);jumpStartAction.clampWhenFinished=true;}

 const initial=idleAction||walkAction||null;if(initial){initial.play();activeAction=initial;}
 actor.visible=false;importedActor.visible=false;locomotionActor.visible=true;
 document.getElementById('hint').textContent=label+' · EL REGRESO';
}

const keys={};

function press(k,repeat){if(DIRS.includes(k)&&!keys[k]&&!repeat){const now=performance.now();if(now-(tapAt[k]??-1e9)<320)runLatch=true;tapAt[k]=now}keys[k]=true}

let elapsed=0;const clock=new THREE.Clock();const camOffset=new THREE.Vector3(0,3.1,6.2);camera.position.set(player.x+camOffset.x,camOffset.y,player.z+camOffset.z);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;if(importedMixer)importedMixer.update(dt);
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);

  const running=!!(keys.run||keys.shift||runLatch);const speed=running?RUN_SPEED:WALK_SPEED;const moving=!attacking&&!!(f||side);
  stepPlayer(player,course,{f,side,speed,running,jump:jumpQueued,canMove:!attacking},dt);jumpQueued=false;
  resolveWallCollisions(player);resolveGround(player);
  if (!pageRead && distanceToPage(player.x, player.y, player.z) < 2.4) showStoryPage();
  actor.position.set(player.x,player.y,player.z);actor.rotation.y=player.facing;
  if(moving){const gait=elapsed*9;legs[0].rotation.x=Math.sin(gait)*.48;legs[1].rotation.x=-Math.sin(gait)*.48;arms[0].rotation.x=-Math.sin(gait)*.18;arms[1].rotation.x=Math.sin(gait)*.18}else{legs.forEach(l=>l.rotation.x*=.85);arms.forEach(a=>a.rotation.x*=.85)}
  if(locomotionMixer){if(!attacking){let next;if(!player.grounded)next=(player.jumping&&player.airTime<.3?(jumpStartAction||jumpLoopAction):(jumpLoopAction||jumpStartAction))||idleAction;else next=moving?(running?(runAction||walkAction):(walkAction||idleAction)):(armed&&swordIdleAction?swordIdleAction:(idleAction||walkAction));selectLocomotion(next);}locomotionMixer.update(dt);}
  importedActor.position.copy(actor.position);importedActor.rotation.y=actor.rotation.y;
  locomotionActor.position.copy(actor.position);locomotionActor.rotation.y=actor.rotation.y;
  const camY=Math.max(player.y,-.6);
  camera.position.lerp(new THREE.Vector3(actor.position.x+camOffset.x,camOffset.y+camY,actor.position.z+camOffset.z),Math.min(1,dt*3));
  camera.lookAt(actor.position.x,1.05+camY,actor.position.z);

}
