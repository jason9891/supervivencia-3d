<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Supervivencia 3D — Guerrero</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;cursor:pointer;padding:0;touch-action:none;font-family:system-ui}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#pad{position:fixed;z-index:20;left:16px;bottom:24px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px}
#pad button{border:1px solid #aab4b4aa;border-radius:12px;background:#20272be8;color:#fff;font:22px system-ui}
#act{position:fixed;z-index:20;right:max(10px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:repeat(2,66px);gap:7px}
#act button{height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font-weight:bold;font-size:12px;line-height:1.15}
#act #atk{height:66px;border:2px solid #d8a8a0;border-radius:50%;background:#5a1f1a;color:#fff4df;font-size:13px;box-shadow:0 5px 18px #000b}
#act #jump{height:66px;border:2px solid #f3d7a0;border-radius:50%;background:#762b23;color:#fff4df;font-size:13px;box-shadow:0 5px 18px #000b}
#act #blk{background:#1f3347e8;border-color:#8fb4d8}
#act #blk.on{background:#2f6aa8;box-shadow:0 0 14px #6aa8ff}
#act .pot{background:#3a1d2be8;border-color:#e0a0b0}
#act .pot[data-p=energia]{background:#1d3a2be8;border-color:#a0e0b0}
#act .pot[data-p=furia]{background:#4a2c10e8;border-color:#f0b070}
#act .pot.empty{opacity:.4}
#hud{position:fixed;z-index:20;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 56px);width:min(46vw,230px);pointer-events:none}
.bar{height:11px;border:1px solid #0009;border-radius:6px;background:#0008;overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;width:100%}
#hpFill{background:linear-gradient(#e0483c,#9a241c)}
#stFill{background:linear-gradient(#6cd16c,#2f8f3a)}
#eqline{color:#e8dfce;font:11px system-ui;text-shadow:0 1px 3px #000;line-height:1.35}
#hud.fury #hpFill{box-shadow:0 0 10px #ffb060}
#stat{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 30px);left:0;right:0;text-align:center;color:#f3d7a0;font:bold 12px system-ui;letter-spacing:.06em;text-shadow:0 2px 4px #000;pointer-events:none}
#obj{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 46px);left:0;right:0;text-align:center;color:#fff;font:bold 13px system-ui;text-shadow:0 2px 4px #000;pointer-events:none}
#hint{position:fixed;z-index:20;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:10px;color:#e8dfce;font:11px system-ui;letter-spacing:.06em;text-shadow:0 2px 4px #000;pointer-events:none}
#toast{position:fixed;z-index:25;top:34%;left:0;right:0;text-align:center;color:#ffe9b0;font:bold 20px system-ui;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}
#eqmenu{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);padding:14px;background:#14181dee;border:1px solid #6a7480;border-radius:16px;display:none}
#eqmenu h3{margin:0 0 10px;color:#f3d7a0;font:bold 15px system-ui;text-align:center}
#eqmenu button{display:block;width:100%;margin:0 0 8px;padding:12px;border:1px solid #6a7480;border-radius:12px;background:#222a31;color:#fff;font-size:14px;text-align:left}
#eqmenu button b{color:#f3d7a0;display:inline-block;width:86px}
#eqmenu .st{color:#cfd6dc;font:12px system-ui;text-align:center;margin:2px 0 10px}
#eqmenu #eqclose{background:#762b23;text-align:center;font-weight:bold}
#end{position:fixed;z-index:45;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ffe9b0;font:bold 28px system-ui;text-align:center}
#end small{font:15px system-ui;color:#e8dfce}
#end button{padding:14px 26px;border:2px solid #f3d7a0;border-radius:14px;background:#762b23;color:#fff4df;font-size:16px;font-weight:bold}
#story{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:20px}
#story .box{max-width:340px;background:#1a1814ee;border:1px solid #c4a574;border-radius:12px;padding:18px 20px;color:#e8dfce;font:14px/1.45 system-ui}
#story h3{margin:0 0 10px;color:#f3d7a0;font-size:15px;letter-spacing:.06em}
#story p{margin:0 0 14px;white-space:pre-wrap}
#story button{display:block;width:100%;padding:10px;border:1px solid #c4a574;border-radius:8px;background:#2a241c;color:#f3d7a0;font:bold 13px system-ui}
#error{position:fixed;z-index:50;top:20%;left:8%;right:8%;padding:14px;background:#401b1b;color:#fff;font:14px system-ui;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="hint">EL REGRESO · PATIO CENTRAL</div>
<div id="stat"></div><div id="obj"></div>
<div id="hud"><div class="bar"><i id="hpFill"></i></div><div class="bar"><i id="stFill"></i></div><div id="eqline"></div></div>
<div id="toast"></div>
<div id="pad"><button data-k="w" style="grid-column:2;grid-row:1">▲</button><button data-k="a" style="grid-column:1;grid-row:2">◀</button><button data-k="s" style="grid-column:2;grid-row:2">▼</button><button data-k="d" style="grid-column:3;grid-row:2">▶</button></div>
<div id="act">
<button id="atk">ATACAR</button><button id="jump">SALTAR</button>
<button id="blk">BLOQUEAR</button><button id="run">CORRER</button>
<button class="pot" data-p="vida">VIDA</button><button class="pot" data-p="energia">ENERGÍA</button>
<button class="pot" data-p="furia">FURIA</button><button id="eqb">EQUIPO</button>
</div>
<div id="eqmenu"><h3>EQUIPO</h3><div id="eqrows"></div><div class="st" id="eqstats"></div><button id="eqclose">CERRAR</button></div>
<div id="end"><div id="endtxt"></div><small id="endsub"></small><button id="again">JUGAR DE NUEVO</button></div>
<div id="error"></div>
<div id="story"><div class="box"><h3 id="storyTitle"></h3><p id="storyText"></p><button id="storyClose">Cerrar</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/SkeletonUtils.js';
import { createPlayer, WALK_SPEED, RUN_SPEED } from './course.js';
import { buildMap1, getCurrentZone, STORY_PAGE, distanceToPage, resolveWallCollisions } from './map1.js';
import { castleCourse, patioLayout, SPAWN } from './layout-patio.js';
import { createSession, stepSession, equipSlot, equipmentRows, ENEMY_LOOK } from './session.js';
import { createEquipment, tintModel } from './equipment.js';
import * as C from './combat.js';

const $=id=>document.getElementById(id);

const errorBox=$('error');
const showError=t=>{errorBox.style.display='block';errorBox.textContent=t};
addEventListener('error',e=>showError('Error del juego: '+(e.message||'desconocido')));
addEventListener('unhandledrejection',e=>showError('Error de carga: '+(e.reason?.message||e.reason||'desconocido')));

// ---------- Escena (castillo "El Regreso"; el mapa vive en map1.js) ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x12161c);
scene.fog=new THREE.Fog(0x12161c, 22, 70);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,160);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8aa0b8,0x2a2218,1.0));
const key=new THREE.DirectionalLight(0xffe8c8,2.0);
key.position.set(-10,20,8);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=2;
key.shadow.camera.far=90;
key.shadow.camera.left=-40;
key.shadow.camera.right=40;
key.shadow.camera.top=40;
key.shadow.camera.bottom=-40;
key.shadow.bias=-0.001;
scene.add(key);
const rim=new THREE.DirectionalLight(0x9a4535,1.15);
rim.position.set(6,5,-8);
scene.add(rim);

function addTorchLight(x,y,z){
  const l=new THREE.PointLight(0xffb060,2.2,13,1.4);
  l.position.set(x,y,z);
  l.castShadow=false;
  scene.add(l);
}
// Patio central
addTorchLight(-12,2.8,12);
addTorchLight(12,2.8,12);
addTorchLight(-12,2.8,-12);
addTorchLight(12,2.8,-12);
addTorchLight(0,2.6,10);
addTorchLight(0,2.6,-10);
// Reja / norte
addTorchLight(-5,3.0,24);
addTorchLight(5,3.0,24);
// Alas
addTorchLight(-26,2.8,4);
addTorchLight(-26,2.8,-4);
addTorchLight(26,2.8,4);
addTorchLight(26,2.8,-4);
// Biblioteca
addTorchLight(-8,3.2,-24);
addTorchLight(8,3.2,-24);
addTorchLight(-8,3.2,-34);
addTorchLight(8,3.2,-34);
// Sur + jefe
addTorchLight(-5,2.8,-45);
addTorchLight(5,2.8,-45);
addTorchLight(-8,3.2,-60);
addTorchLight(8,3.2,-60);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
function addMesh(parent,geo,material,pos,scale=[1,1,1],rot=[0,0,0]){const o=new THREE.Mesh(geo,material);o.position.set(...pos);o.scale.set(...scale);o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const mapData=buildMap1(scene);

// ---------- Jugador y partida (combate en el patio) ----------
const course=castleCourse();
const player=createPlayer(course);
player.x=SPAWN.x;player.z=SPAWN.z;player.checkpoint={x:SPAWN.x,z:SPAWN.z};player.facing=Math.PI; // mirando al sur, la reja queda detrás
const S=createSession(course,player,patioLayout());
let pageRead=false;
const storyEl=$('story');
$('storyClose').addEventListener('pointerdown',e=>{e.preventDefault();storyEl.style.display='none'});
function showStoryPage(){if(pageRead)return;$('storyTitle').textContent=STORY_PAGE.title;$('storyText').textContent=STORY_PAGE.text;storyEl.style.display='flex';pageRead=true;if(mapData.pageMesh)mapData.pageMesh.visible=false}

// Cofres (se abren al acercarse cuando ya no hay enemigos en su plataforma).
const chestWood=mat(0x5a3a22,.8),chestGold=new THREE.MeshStandardMaterial({color:0xc9a14a,emissive:0x8a6a20,emissiveIntensity:.8,metalness:.6,roughness:.4});
S.chests.forEach(c=>{
 const g=new THREE.Group();g.position.set(c.x,0,c.z);scene.add(g);
 addMesh(g,new THREE.BoxGeometry(.8,.45,.5),chestWood,[0,.225,0]);
 addMesh(g,new THREE.BoxGeometry(.82,.08,.52),chestGold,[0,.48,0]);
 addMesh(g,new THREE.BoxGeometry(.12,.2,.54),chestGold,[0,.3,0]);
 c.mesh=g;
});

// ---------- Personaje de respaldo (si no carga el modelo animado) ----------
const skin=mat(0x98694f),pants=mat(0x302720),wrap=mat(0x806044);
function fallbackBody(color){const g=new THREE.Group();
 addMesh(g,new THREE.CapsuleGeometry(.24,.9,6,12),mat(color),[0,1.1,0]);
 addMesh(g,new THREE.SphereGeometry(.22,14,10),skin,[0,1.85,0]);return g}
const actor=fallbackBody(0x3a4a5a);scene.add(actor);
const heroRoot=new THREE.Group();scene.add(heroRoot);heroRoot.visible=false;

// ---------- Interfaz ----------
const hpFill=$('hpFill'),stFill=$('stFill'),hudBox=$('hud'),eqline=$('eqline'),statBox=$('stat'),objBox=$('obj'),toast=$('toast');
let toastT=0;
function say(t){toast.textContent=t;toast.classList.add('show');toastT=1.8}
const cache={};
function setText(el,id,t){if(cache[id]!==t){cache[id]=t;el.textContent=t}}
function updateHud(){
 const p=player,st=S.stats;
 hpFill.style.width=Math.max(0,p.hp/p.maxHp*100)+'%';
 stFill.style.width=Math.max(0,p.stamina/C.MAX_STAMINA*100)+'%';
 hudBox.classList.toggle('fury',p.fury>0);
 setText(eqline,'eq',C.WEAPONS[S.eq.weapon].name+' · DEF '+st.defense+' · PESO '+st.weight+(p.fury>0?' · FURIA':'')+(p.blocking?' · GUARDIA':''));
 setText(objBox,'obj',S.objective.text);
 setText(statBox,'stat',(getCurrentZone(player.x,player.z)||'exterior').toUpperCase()+(pageRead?' · PÁGINA LEÍDA':'')+' · MUERTES '+S.deaths);
 $('blk').classList.toggle('on',p.blocking);
 document.querySelectorAll('.pot').forEach(b=>{const k=b.dataset.p,n=S.inv[k];setText(b,'pot'+k,C.POTIONS[k].short+' ×'+n);b.classList.toggle('empty',n<=0)});
}
// Menú de equipo (pausa la partida).
const eqmenu=$('eqmenu');
function renderMenu(){
 const rows=equipmentRows(S);$('eqrows').innerHTML='';
 for(const r of rows){const b=document.createElement('button');b.innerHTML='<b>'+r.label+'</b>'+r.name+(r.count>1?'  ▸':'');
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(r.count>1){equipSlot(S,r.slot,1);applyAllEquipment();renderMenu()}});$('eqrows').appendChild(b)}
 const st=S.stats;$('eqstats').textContent='Defensa '+st.defense+' · Peso '+st.weight+' · Velocidad '+Math.round(st.speedMul*100)+'% · Recuperación '+Math.round(st.regenMul*100)+'%'+(st.hasShield?' · Escudo':' · Bloqueo con arma');
}
function openMenu(){S.paused=true;renderMenu();eqmenu.style.display='block'}
function closeMenu(){S.paused=false;eqmenu.style.display='none'}
$('eqb').addEventListener('pointerdown',e=>{e.preventDefault();S.paused?closeMenu():openMenu()});
$('eqclose').addEventListener('pointerdown',e=>{e.preventDefault();closeMenu()});
$('again').addEventListener('pointerdown',e=>{e.preventDefault();location.reload()});
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());

// ---------- Controles ----------
const keys={};
const DIRS=['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright'];const tapAt={};let runLatch=false;
function press(k,repeat){if(DIRS.includes(k)&&!keys[k]&&!repeat){const now=performance.now();if(now-(tapAt[k]??-1e9)<320)runLatch=true;tapAt[k]=now}keys[k]=true}
function release(k){keys[k]=false;if(!DIRS.some(d=>keys[d]))runLatch=false}
let atkQ=false,jumpQ=false,potionQ=null;
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k,false);b.setPointerCapture(e.pointerId)});const off=()=>release(k);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
function hold(id,name){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[name]=true;b.setPointerCapture(e.pointerId)});const off=()=>keys[name]=false;b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)}
hold('run','run');hold('blk','block');
$('atk').addEventListener('pointerdown',e=>{e.preventDefault();atkQ=true});
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQ=true});
document.querySelectorAll('.pot').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();potionQ=b.dataset.p}));
addEventListener('keydown',e=>{const k=e.key.toLowerCase();press(k,e.repeat);
 if(k===' '){e.preventDefault();jumpQ=true}
 if(k==='j'&&!e.repeat)atkQ=true;
 if(k==='1')potionQ='vida';if(k==='2')potionQ='energia';if(k==='3')potionQ='furia';
 if((k==='i'||k==='tab')&&!e.repeat){e.preventDefault();S.paused?closeMenu():openMenu()}
 if(k==='k')keys.block=true});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();release(k);if(k==='k')keys.block=false});

// ---------- Modelos y animación ----------
const gltfLoader=new GLTFLoader();
const eqKit=createEquipment(THREE);
let heroModel=null,heroAnim=null,srcGltf=null;const heroStore={nodes:[]};
function makeAnim(model,clips){
 const mixer=new THREE.AnimationMixer(model);const actions={};
 const get=name=>{const c=clips.find(x=>x.name===name);return c?(actions[name]??(actions[name]=mixer.clipAction(c))):null};
 let cur=null,curKey=null;
 return{mixer,get,
  play(d){ // d = {key,name,once,clamp,ts}
   if(d.key===curKey)return;
   const a=get(d.name)||get('Idle_Loop');if(!a)return;
   if(cur&&cur!==a)cur.fadeOut(.12);
   a.reset();a.enabled=true;
   if(d.once){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=!!d.clamp}else{a.setLoop(THREE.LoopRepeat,Infinity);a.clampWhenFinished=false}
   a.setEffectiveTimeScale(d.ts||1);a.setEffectiveWeight(1);a.fadeIn(.12).play();
   cur=a;curKey=d.key},
  update(dt){mixer.update(dt)}};
}
function applyAllEquipment(){
 try{if(heroModel)eqKit.apply(heroModel,S.eq,heroStore);
  for(const f of foes){if(f.model&&!f.equipped){eqKit.apply(f.model,ENEMY_LOOK[f.e.kind],f.store);f.equipped=true}}}
 catch(err){console.warn('No se pudo colocar el equipo',err)}
}

// Enemigos: modelo clonado + barra de vida.
const foes=[];
function makeFoeVisual(e){
 const def=e.def,root=new THREE.Group();root.scale.setScalar(def.scale);scene.add(root);
 const f={e,root,model:null,anim:null,store:{nodes:[]},equipped:false,serial:0,prevState:'idle',bar:null,fill:null,fallback:null};
 // Barra de vida sobre la cabeza.
 const bar=new THREE.Group();const back=addMesh(bar,new THREE.PlaneGeometry(.9,.1),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.65}),[0,0,0]);
 const fill=addMesh(bar,new THREE.PlaneGeometry(.86,.07),new THREE.MeshBasicMaterial({color:0xd0372b}),[0,0,.001]);
 bar.position.set(0,2.15,0);root.add(bar);f.bar=bar;f.fill=fill;
 // Cuerpo de respaldo (se oculta cuando el modelo animado está listo).
 const fb=fallbackBody(def.tint);root.add(fb);f.fallback=fb;
 if(srcGltf)attachFoeModel(f);
 foes.push(f);return f;
}
function attachFoeModel(f){
 try{
  const m=skeletonClone(srcGltf.scene);
  m.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.castShadow=true}});
  tintModel(m,f.e.def.tint);
  f.root.add(m);f.model=m;f.anim=makeAnim(m,srcGltf.animations||[]);
  if(f.fallback)f.fallback.visible=false;
 }catch(err){console.warn('No se pudo clonar el modelo del enemigo',err)}
}
S.enemies.forEach(makeFoeVisual);

gltfLoader.load('./assets/characters/ual/UAL1_Standard.glb',gltf=>{
 try{
  srcGltf=gltf;const model=gltf.scene;
  model.updateMatrixWorld(true);
  const bounds=new THREE.Box3().setFromObject(model);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());
  if(size.y>0){const factor=1.82/size.y;model.scale.setScalar(factor);model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor)}
  model.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.castShadow=true}});
  tintModel(model,0xaab4c2);
  heroRoot.add(model);heroModel=model;heroAnim=makeAnim(model,gltf.animations||[]);
  actor.visible=false;heroRoot.visible=true;
  foes.forEach(f=>{if(!f.model)attachFoeModel(f)});
  applyAllEquipment();
  $('hint').textContent='EL REGRESO · J ATACAR · K BLOQUEAR · I EQUIPO · DOBLE TOQUE ▲ = CORRER';
 }catch(err){console.warn('Error al preparar el personaje',err);showError('No se pudo preparar el personaje animado: '+(err?.message||err))}
},undefined,error=>console.warn('No se pudo cargar UAL1_Standard.glb; se usa el personaje de respaldo.',error));

// ---------- Bucle principal ----------
let elapsed=0,hurtT=0,drinkT=0,atkSerial=0,lastAtk=null,hurtSerial=0,drinkSerial=0,ended=false;
const clock=new THREE.Clock();const camOffset=new THREE.Vector3(0,3.1,6.2);camera.position.set(player.x+camOffset.x,camOffset.y,player.z+camOffset.z);
function handleEvents(evs){
 for(const ev of evs){
  if(ev.kind==='msg')say(ev.text);
  else if(ev.kind==='hurt'){hurtT=.35;hurtSerial++}
  else if(ev.kind==='potion'){drinkT=.5;drinkSerial++}
  else if(ev.kind==='chest'){const c=ev.chest;if(c.mesh){c.mesh.children[1].position.y=.7;c.mesh.children[1].rotation.x=-.7}}
  else if(ev.kind==='death'){say('HAS CAÍDO')}
  else if(ev.kind==='victory'&&!ended){ended=true;$('endtxt').textContent='¡VICTORIA!';$('endsub').textContent='Muertes: '+S.deaths+' · Caídas: '+player.falls;$('end').style.display='flex'}
 }
}
function heroDesired(moving,running){
 const p=player;
 if(p.dead)return{key:'death',name:'Death01',once:true,clamp:true};
 if(p.attack){const a=p.attack;return{key:'atk'+atkSerial,name:'Sword_Attack',once:true,ts:Math.min(2.4,Math.max(.7,.42/a.hit))}}
 if(hurtT>0)return{key:'hurt'+hurtSerial,name:'Hit_Chest',once:true,ts:1.2};
 if(drinkT>0)return{key:'drink'+drinkSerial,name:'Interact',once:true,ts:2.2};
 if(p.blocking)return{key:'block',name:'Crouch_Idle_Loop'};
 if(!p.grounded)return p.jumping&&p.airTime<.3?{key:'jstart',name:'Jump_Start',once:true,clamp:true}:{key:'jloop',name:'Jump_Loop'};
 if(moving)return running?{key:'run',name:'Sprint_Loop'}:{key:'walk',name:'Walk_Loop'};
 return{key:'idle',name:'Sword_Idle'};
}
function foeDesired(f){
 const e=f.e;
 if(e.state!==f.prevState){if(e.state==='windup')f.serial++;f.prevState=e.state}
 if(e.dead)return{key:'dead',name:'Death01',once:true,clamp:true};
 if(e.state==='hurt')return{key:'hurt',name:'Hit_Chest',once:true,ts:1.2};
 if(e.state==='windup'||e.state==='recover')return{key:'atk'+f.serial,name:'Sword_Attack',once:true,ts:Math.min(2.4,Math.max(.5,.42/e.def.windup))};
 if(e.state==='chase')return{key:'walk',name:'Walk_Loop'};
 return{key:'idle',name:'Sword_Idle'};
}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
 const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 const running=!!(keys.run||keys.shift||runLatch),moving=!!(f||side)&&!player.attack&&!player.dead;

 const input={f,side,speed:running?RUN_SPEED:WALK_SPEED,running,jump:jumpQ,attack:atkQ,block:!!keys.block,potion:potionQ};
 jumpQ=false;atkQ=false;potionQ=null;
 handleEvents(stepSession(S,input,dt));
 resolveWallCollisions(player);
 if(!pageRead&&distanceToPage(player.x,player.y,player.z)<2.4)showStoryPage();
 if(player.attack!==lastAtk){if(player.attack)atkSerial++;lastAtk=player.attack}
 hurtT=Math.max(0,hurtT-dt);drinkT=Math.max(0,drinkT-dt);
 if(toastT>0){toastT-=dt;if(toastT<=0)toast.classList.remove('show')}

 // Jugador
 actor.position.set(player.x,player.y,player.z);actor.rotation.y=player.facing;
 heroRoot.position.copy(actor.position);heroRoot.rotation.y=player.facing;
 if(heroAnim){heroAnim.play(heroDesired(moving,running));heroAnim.update(dt)}
 // Enemigos
 for(const fo of foes){
  const e=fo.e;fo.root.position.set(e.x,0,e.z);fo.root.rotation.y=e.facing;
  if(fo.anim){fo.anim.play(foeDesired(fo));fo.anim.update(dt)}
  const ratio=Math.max(0,e.hp/e.maxHp);fo.fill.scale.x=Math.max(.001,ratio);fo.fill.position.x=-(1-ratio)*.43;
  fo.bar.visible=!e.dead;fo.bar.quaternion.copy(camera.quaternion);
  if(e.dead&&e.deadT>5)fo.root.visible=false;
 }
 // Cofres
 for(const c of S.chests){if(c.mesh&&!c.opened)c.mesh.rotation.y=Math.sin(elapsed*1.5)*.15}
 updateHud();
 const camY=Math.max(player.y,-.6);
 camera.position.lerp(new THREE.Vector3(player.x+camOffset.x,camOffset.y+camY,player.z+camOffset.z),Math.min(1,dt*3));
 camera.lookAt(player.x,1.05+camY,player.z);
 renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);
try{applyAllEquipment()}catch(err){console.warn(err)}
window.__sv3={S,player}; // gancho para pruebas
animate();
</script></body></html>
