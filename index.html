<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Supervivencia 3D — Joystick v3</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;cursor:pointer;padding:0;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#run{position:fixed;z-index:20;right:max(28px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui;touch-action:none}
#jump{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 28px);width:84px;height:84px;border:2px solid #f3d7a0;border-radius:50%;background:#762b23;color:#fff4df;font:bold 15px system-ui;box-shadow:0 5px 22px #000b;touch-action:none}
#atk{position:fixed;z-index:20;right:max(116px,calc(env(safe-area-inset-right) + 104px));bottom:calc(env(safe-area-inset-bottom) + 40px);width:72px;height:72px;border:2px solid #d8a8a0;border-radius:50%;background:#5a1f1a;color:#fff4df;font:bold 13px system-ui;box-shadow:0 5px 18px #000b;touch-action:none}
#arm{position:fixed;z-index:20;right:max(116px,calc(env(safe-area-inset-right) + 104px));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui;touch-action:none}
#arm.on{background:#6b5a22;border-color:#f3d7a0}
#joyBase{position:fixed;z-index:20;left:max(16px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 20px);width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#2a3238cc,#1a1e22e8);border:2px solid #aab4b488;box-shadow:0 4px 18px #000a;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#c4a574ee;border:2px solid #f3d7a0;box-shadow:0 2px 10px #0008;pointer-events:none;transition:none}
#stat{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 34px);left:0;right:0;text-align:center;color:#f3d7a0;font:bold 13px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none}
#combatLab{position:fixed;z-index:25;top:calc(env(safe-area-inset-top) + 8px);right:168px;padding:9px 11px;border:1px solid #c4a574;border-radius:9px;background:#211d17ee;color:#f3d7a0;font:bold 11px system-ui;letter-spacing:.04em;touch-action:manipulation}
#mapView{position:fixed;z-index:25;top:calc(env(safe-area-inset-top) + 8px);left:12px;padding:9px 11px;border:1px solid #c4a574;border-radius:9px;background:#211d17ee;color:#f3d7a0;font:bold 11px system-ui;letter-spacing:.04em;touch-action:manipulation}
#mapView.on{background:#3a4a2a;border-color:#8fbf6a}
#characterLab{position:fixed;z-index:25;top:calc(env(safe-area-inset-top) + 8px);right:12px;padding:9px 11px;border:1px solid #c4a574;border-radius:9px;background:#211d17ee;color:#f3d7a0;font:bold 11px system-ui;letter-spacing:.04em;touch-action:manipulation}
#hint{position:fixed;z-index:20;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;color:#e8dfce;font:12px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none}
#error{position:fixed;z-index:30;top:20%;left:8%;right:8%;padding:14px;background:#401b1b;color:#fff;font:14px system-ui;display:none;white-space:pre-wrap}
#story{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:20px}
#story .box{max-width:340px;background:#1a1814ee;border:1px solid #c4a574;border-radius:12px;padding:18px 20px;color:#e8dfce;font:14px/1.45 system-ui}
#story h3{margin:0 0 10px;color:#f3d7a0;font-size:15px;letter-spacing:.06em}
#story p{margin:0 0 14px;white-space:pre-wrap}
#story button{display:block;width:100%;padding:10px;border:1px solid #c4a574;border-radius:8px;background:#2a241c;color:#f3d7a0;font:bold 13px system-ui}
</style>
</head>
<body>
<div id="stat"></div>
<button type="button" id="mapView">VISTA · MAPA</button>
<button type="button" id="characterLab" onclick="location.href='./character-lab.html'">VISUAL · PERSONAJE</button>
<button type="button" id="combatLab" onclick="location.href='./combat-lab.html'">COMBATE · PRUEBAS</button>
<div id="hint">JOYSTICK v3 · giro suave</div>
<div id="joyBase" aria-label="Joystick">
  <div id="joyKnob"></div>
</div>
<button id="atk">ATACAR</button><button id="arm">ARMA</button><button id="run">CORRER</button><button id="jump">⬆<br>SALTAR</button>
<div id="error"></div>
<div id="story"><div class="box"><h3 id="storyTitle"></h3><p id="storyText"></p><button id="storyClose">Cerrar</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { createPlayer, stepPlayer, WALK_SPEED, RUN_SPEED } from './course.js';
import {
  buildMap1, getCurrentZone, STORY_PAGE,
  distanceToPage, distanceToKey, distanceToLever, distanceToFood,
  resolveWallCollisions, resolveGround, closePassageGate, tryUnlockTowerDoor, MAP_CENTER, WALLS
} from './map1.js';

const errorBox = document.getElementById('error');
addEventListener('error', e => { errorBox.style.display = 'block'; errorBox.textContent = 'Error: ' + (e.message || ''); });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12161c);
scene.fog = new THREE.Fog(0x12161c, 30, 160);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8aa0b8, 0x2a2218, 1.0));
const keyLight = new THREE.DirectionalLight(0xffe8c8, 2.0);
keyLight.position.set(20, 28, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 120;
keyLight.shadow.camera.left = -55;
keyLight.shadow.camera.right = 55;
keyLight.shadow.camera.top = 55;
keyLight.shadow.camera.bottom = -55;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);
scene.add(new THREE.DirectionalLight(0x9a4535, 1.1).translateX(8).translateY(8).translateZ(-6));

const mapData = buildMap1(scene);
let pageRead = false, hasKey = false, leverPulled = false, gateClosed = false, foodTaken = false;

const course = { segments: [{ a: 100, b: -100 }], gaps: 0, freeMap: true };
const player = createPlayer(course);
player.x = 6.5; player.z = 3; player.y = 0;
player.checkpoint = { x: 6.5, z: 3 };
player.facing = 0;

const statBox = document.getElementById('stat');
let lastStat = '';
function updateStat() {
  const zone = getCurrentZone(player.x, player.z) || 'exterior';
  let t = zone.toUpperCase();
  if (hasKey) t += ' · LLAVE';
  if (pageRead) t += ' · NOTAS';
  if (leverPulled) t += ' · PALANCA';
  if (t !== lastStat) { statBox.textContent = t; lastStat = t; }
}

const storyEl = document.getElementById('story');
document.getElementById('storyClose').addEventListener('pointerdown', () => { storyEl.style.display = 'none'; });
function showStoryPage() {
  if (pageRead) return;
  document.getElementById('storyTitle').textContent = STORY_PAGE.title;
  document.getElementById('storyText').textContent = STORY_PAGE.text;
  storyEl.style.display = 'flex';
  pageRead = true;
  if (mapData.pageMesh) mapData.pageMesh.visible = false;
}

const actor = new THREE.Group(); scene.add(actor);
const mat = (c, r = 0.8) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const skin = mat(0x98694f);
function addM(p, geo, m, pos) {
  const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.castShadow = true; p.add(o); return o;
}
addM(actor, new THREE.CapsuleGeometry(0.24, 0.45, 6, 10), skin, [0, 1.5, 0]);
addM(actor, new THREE.SphereGeometry(0.22, 12, 10), skin, [0, 1.85, 0]);
const locomotionActor = new THREE.Group(); scene.add(locomotionActor); locomotionActor.visible = false;
let locomotionMixer = null, walkAction = null, runAction = null, idleAction = null, activeAction = null;
let attackAction = null, attacking = false, armed = false;
const gltfLoader = new GLTFLoader();
const normName = n => (n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function findClip(clips, names) {
  for (const n of names) { const c = clips.find(i => normName(i.name) === n); if (c) return c; }
}
function selectLocomotion(next) {
  if (!next || next === activeAction) return;
  if (activeAction) activeAction.fadeOut(0.15);
  next.reset().fadeIn(0.15).play(); activeAction = next;
}
function setupLocomotion(gltf, label) {
  const model = gltf.scene;
  model.updateMatrixWorld(true);
  const bounds = new THREE.Box3().setFromObject(model);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  if (size.y > 0) {
    const f = 1.82 / size.y;
    model.scale.setScalar(f);
    model.position.set(-center.x * f, -bounds.min.y * f, -center.z * f);
  }
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  locomotionActor.add(model);
  locomotionMixer = new THREE.AnimationMixer(model);
  const clips = gltf.animations || [];
  const idleC = findClip(clips, ['idle loop', 'idle standing', 'idle']);
  const walkC = findClip(clips, ['walk loop', 'walk formal loop', 'walk']);
  const runC = findClip(clips, ['sprint loop', 'jog fwd loop', 'run']);
  const atkC = findClip(clips, ['sword attack', 'attack']);
  if (idleC) idleAction = locomotionMixer.clipAction(idleC);
  if (walkC) walkAction = locomotionMixer.clipAction(walkC);
  if (runC) runAction = locomotionMixer.clipAction(runC);
  if (atkC) { attackAction = locomotionMixer.clipAction(atkC); attackAction.setLoop(THREE.LoopOnce, 1); }
  locomotionMixer.addEventListener('finished', e => {
    if (e.action === attackAction) { attacking = false; attackAction.fadeOut(0.15); activeAction = null; }
  });
  const ini = idleAction || walkAction;
  if (ini) { ini.play(); activeAction = ini; }
  actor.visible = false;
  locomotionActor.visible = true;
  document.getElementById('hint').textContent = label + ' · JOYSTICK v3';
}
gltfLoader.load('./assets/characters/ual/UAL1_Standard.glb', g => setupLocomotion(g, 'GUERRERO UAL'), undefined, () => {
  gltfLoader.load('./assets/characters/animations/locomotion-collection-jordan-3d-person-animated.glb', g => setupLocomotion(g, 'RESPALDO'), undefined, () => {});
});

function attack() {
  if (!attackAction || attacking || !player.grounded) return;
  attacking = true;
  if (activeAction) activeAction.fadeOut(0.1);
  attackAction.reset().fadeIn(0.1).play(); activeAction = attackAction;
}
function toggleArm() { armed = !armed; document.getElementById('arm').classList.toggle('on', armed); }
document.getElementById('atk').addEventListener('pointerdown', e => { e.preventDefault(); attack(); });
document.getElementById('arm').addEventListener('pointerdown', e => { e.preventDefault(); toggleArm(); });

const keys = {};
const joy = { x: 0, y: 0, active: false };
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const JOY_R = 36;
function setJoy(nx, ny) {
  const len = Math.hypot(nx, ny);
  const c = len > 1 ? 1 / len : 1;
  joy.x = nx * c;
  joy.y = ny * c;
  joyKnob.style.transform = `translate(${joy.x * JOY_R}px, ${-joy.y * JOY_R}px)`;
}
function resetJoy() {
  joy.x = 0; joy.y = 0; joy.active = false;
  joyKnob.style.transform = 'translate(0,0)';
}
function joyFromEvent(e) {
  const r = joyBase.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = (e.clientX - cx) / (r.width / 2);
  const dy = -(e.clientY - cy) / (r.height / 2);
  setJoy(dx, dy);
}
joyBase.addEventListener('pointerdown', e => {
  e.preventDefault();
  joy.active = true;
  joyBase.setPointerCapture(e.pointerId);
  joyFromEvent(e);
});
joyBase.addEventListener('pointermove', e => {
  if (!joy.active) return;
  joyFromEvent(e);
});
const endJoy = () => resetJoy();
joyBase.addEventListener('pointerup', endJoy);
joyBase.addEventListener('pointercancel', endJoy);
joyBase.addEventListener('lostpointercapture', endJoy);

const runButton = document.getElementById('run');
runButton.addEventListener('pointerdown', e => { e.preventDefault(); keys.run = true; runButton.setPointerCapture(e.pointerId); });
const stopRun = () => { keys.run = false; };
runButton.addEventListener('pointerup', stopRun); runButton.addEventListener('pointercancel', stopRun); runButton.addEventListener('lostpointercapture', stopRun);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ') { e.preventDefault(); jumpQueued = true; }
  if (k === 'j') attack();
  if (k === 'e' && !e.repeat) toggleArm();
  if (k === 'm' && !e.repeat) document.getElementById('mapView')?.dispatchEvent(new PointerEvent('pointerdown'));
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let jumpQueued = false;
document.getElementById('jump').addEventListener('pointerdown', e => { e.preventDefault(); jumpQueued = true; });

const clock = new THREE.Clock();
const CAM_DIST = 4.2;
const CAM_HEIGHT = 2.4;
const CAM_LOOK_Y = 1.35;
let mapOverview = false;
const overview = { x: MAP_CENTER.x, z: MAP_CENTER.z, h: 95, yaw: 0 };
const mapBtn = document.getElementById('mapView');
if (mapBtn) mapBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  mapOverview = !mapOverview;
  mapBtn.classList.toggle('on', mapOverview);
  if (mapOverview) {
    overview.x = MAP_CENTER.x;
    overview.z = MAP_CENTER.z;
    overview.h = 95;
    document.getElementById('hint').textContent = 'VISTA MAPA · joystick mueve · CORRER acerca · SALTAR aleja';
  } else {
    document.getElementById('hint').textContent = 'JOYSTICK v3 · giro suave';
  }
});
camera.position.set(player.x, CAM_HEIGHT, player.z - CAM_DIST);
document.addEventListener('contextmenu', e => e.preventDefault());

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);

  let f = 0, side = 0;
  let lockFacing = null;
  if (!mapOverview) {
    if (joy.active && (Math.abs(joy.x) > 0.12 || Math.abs(joy.y) > 0.12)) {
      // Invertido (tu perspectiva en pantalla) + giro más lento
      if (Math.abs(joy.x) > 0.18) player.facing -= joy.x * 1.15 * dt;
      lockFacing = player.facing;
      const fwd = joy.y;
      side = Math.sin(player.facing) * fwd;
      f = Math.cos(player.facing) * fwd;
    } else {
      f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
      side = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    }
  }
  const running = !!(keys.run || keys.shift);
  const speed = running ? RUN_SPEED : WALK_SPEED;

  stepPlayer(player, course, { f: mapOverview ? 0 : f, side: mapOverview ? 0 : side, speed, running, jump: mapOverview ? false : jumpQueued, canMove: !attacking && !mapOverview }, dt);
  if (lockFacing !== null) player.facing = lockFacing;
  if (!mapOverview) jumpQueued = false;
  resolveWallCollisions(player);
  resolveGround(player);

  if (!gateClosed && player.x > 30 && player.x < 40 && player.z > 64 && player.z < 72) {
    closePassageGate(mapData);
    gateClosed = true;
    document.getElementById('hint').textContent = 'La reja cae... algo anda mal';
  }
  if (!pageRead && distanceToPage(player.x, player.y, player.z) < 2.2) showStoryPage();
  if (!hasKey && distanceToKey(player.x, player.y, player.z) < 1.8) {
    hasKey = true;
    if (mapData.keyMesh) mapData.keyMesh.visible = false;
    document.getElementById('hint').textContent = 'Llave obtenida';
    tryUnlockTowerDoor(mapData, hasKey);
  }
  if (!foodTaken && distanceToFood(player.x, player.y, player.z) < 1.6) {
    foodTaken = true;
    if (mapData.foodMesh) mapData.foodMesh.visible = false;
    document.getElementById('hint').textContent = 'Comida en el establo...';
  }
  if (!leverPulled && distanceToLever(player.x, player.y, player.z) < 2.0) {
    leverPulled = true;
    if (mapData.leverArm) mapData.leverArm.rotation.x = 0.8;
    document.getElementById('hint').textContent = 'La gran reja responde... (cinemática jefe)';
  }

  actor.position.set(player.x, player.y, player.z);
  actor.rotation.y = player.facing;
  locomotionActor.position.copy(actor.position);
  locomotionActor.rotation.y = actor.rotation.y;

  if (locomotionMixer) {
    if (!attacking) {
      let next;
      if (!player.grounded) next = idleAction;
      else next = (f || side) ? (running ? (runAction || walkAction) : (walkAction || idleAction)) : (idleAction || walkAction);
      selectLocomotion(next);
    }
    locomotionMixer.update(dt);
  }

  if (mapOverview) {
    const ox = joy.active ? -joy.x : ((keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0));
    const oz = joy.active ? joy.y : ((keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0));
    overview.x += ox * 40 * dt;
    overview.z += oz * 40 * dt;
    if (keys.run || keys.shift) overview.h = Math.max(25, overview.h - 35 * dt);
    if (jumpQueued) { overview.h = Math.min(140, overview.h + 12); jumpQueued = false; }
    overview.x = Math.max(5, Math.min(85, overview.x));
    overview.z = Math.max(5, Math.min(67, overview.z));
    camera.position.lerp(new THREE.Vector3(overview.x, overview.h, overview.z), Math.min(1, dt * 4));
    camera.lookAt(overview.x, 0.5, overview.z);
  } else {
    const py = Math.max(player.y, 0);
    let dist = CAM_DIST;
    const bx0 = -Math.sin(player.facing);
    const bz0 = -Math.cos(player.facing);
    for (const w of WALLS) {
      for (let t = 0.35; t <= dist; t += 0.45) {
        const sx = player.x + bx0 * t;
        const sz = player.z + bz0 * t;
        if (sx >= w.minX - 0.15 && sx <= w.maxX + 0.15 && sz >= w.minZ - 0.15 && sz <= w.maxZ + 0.15) {
          dist = Math.max(1.2, t - 0.35);
          break;
        }
      }
    }
    const targetCam = new THREE.Vector3(player.x + bx0 * dist, py + CAM_HEIGHT, player.z + bz0 * dist);
    camera.position.lerp(targetCam, Math.min(1, dt * 6));
    camera.lookAt(player.x, py + CAM_LOOK_Y, player.z);
  }
  updateStat();
  renderer.render(scene, camera);
}
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
animate();
</script>
</body>
</html>
