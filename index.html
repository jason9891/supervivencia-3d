const keys={};
let jumpHeight=0,jumpVelocity=0;
function jump(){if(jumpHeight<=0.001){jumpVelocity=5.2}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k===' '&&!e.repeat)jump()});

const padKeys=[['','', 'w'],['a','s','d']];

const hint=document.createElement('div');hint.textContent='MOVER · SALTAR · WASD / FLECHAS / ESPACIO';hint.style.cssText='position:fixed;left:16px;bottom:190px;color:#e4e5df;font:12px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none';document.body.append(pad,hint);

const clock=new THREE.Clock();let elapsed=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;
 
 if(jumpHeight>0||jumpVelocity>0){jumpVelocity-=12.5*dt;jumpHeight+=jumpVelocity*dt;if(jumpHeight<=0){jumpHeight=0;jumpVelocity=0}}
 pivot.position.y=jumpHeight;
 
 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const sideways=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 const moving=forward!==0||sideways!==0;

 if(moving){
  const direction=Math.atan2(sideways,forward);
  const target=direction;
  pivot.rotation.y=rotY+target;
  const speed=1.65;
  pivot.position.x+=Math.sin(pivot.rotation.y)*forward*speed*dt+Math.cos(pivot.rotation.y)*sideways*speed*dt;
  pivot.position.z+=Math.cos(pivot.rotation.y)*forward*speed*dt-Math.sin(pivot.rotation.y)*sideways*speed*dt;
  const gait=elapsed*10.5;
  baseLegs[0].rotation.x=Math.sin(gait)*.48;baseLegs[1].rotation.x=-Math.sin(gait)*.48;
  baseArms[-1].rotation.x=-Math.sin(gait)*.18;baseArms[1].rotation.x=Math.sin(gait)*.18;
  baseHuman.position.y=jumpHeight>0.02?0:Math.abs(Math.sin(gait))*.025;
  if(jumpHeight>0.03){baseLegs[0].rotation.x=-.38;baseLegs[1].rotation.x=-.52;baseArms[-1].rotation.x=-.28;baseArms[1].rotation.x=-.42;}
 }else{
  pivot.rotation.y+=(rotY-pivot.rotation.y)*Math.min(1,dt*3);
  baseLegs[0].rotation.x*=.82;baseLegs[1].rotation.x*=.82;
  baseArms[-1].rotation.x*=.82;baseArms[1].rotation.x*=.82;
  baseHuman.position.y=jumpHeight>0.02?0:Math.sin(elapsed*1.4)*.006;
  if(jumpHeight>0.02){baseLegs[0].rotation.x=-.38;baseLegs[1].rotation.x=-.52;baseArms[-1].rotation.x=-.28;baseArms[1].rotation.x=-.42;}
 }
 pivot.rotation.x=rotX;
 camera.position.x+=(pivot.position.x+1.8-camera.position.x)*Math.min(1,dt*2);
 camera.position.z+=(pivot.position.z+4.9-camera.position.z)*Math.min(1,dt*2);
 camera.lookAt(pivot.position.x,1.13,pivot.position.z);
 renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);animate();
</script>
