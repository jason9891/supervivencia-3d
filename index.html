<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Supervivencia 3D — Guerrero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#run{position:fixed;z-index:20;right:max(28px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui;touch-action:none}#jump{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 28px);width:84px;height:84px;border:2px solid #f3d7a0;border-radius:50%;background:#762b23;color:#fff4df;font:bold 15px system-ui;box-shadow:0 5px 22px #000b;touch-action:none}
#pad{position:fixed;z-index:20;left:16px;bottom:24px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px}
#pad button{border:1px solid #aab4b4aa;border-radius:12px;background:#20272be8;color:#fff;font:22px system-ui;touch-action:none}
#hint{position:fixed;z-index:20;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;color:#e8dfce;font:12px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none}
#error{position:fixed;z-index:30;top:20%;left:8%;right:8%;padding:14px;background:#401b1b;color:#fff;font:14px system-ui;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="hint">SUPERVIVENCIA 3D · MOVER Y SALTAR</div>
<div id="pad"><button data-k="w" style="grid-column:2;grid-row:1">▲</button><button data-k="a" style="grid-column:1;grid-row:2">◀</button><button data-k="s" style="grid-column:2;grid-row:2">▼</button><button data-k="d" style="grid-column:3;grid-row:2">▶</button></div>
<button id="run">CORRER</button><button id="jump">⬆<br>SALTAR</button><div id="error"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const errorBox=document.getElementById('error');
addEventListener('error',e=>{errorBox.style.display='block';errorBox.textContent='Error del juego: '+(e.message||'desconocido')});
addEventListener('unhandledrejection',e=>{errorBox.style.display='block';errorBox.textContent='Error de carga: '+(e.reason?.message||e.reason||'desconocido')});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101318);scene.fog=new THREE.Fog(0x101318,12,36);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fb4d0,0x241915,2.1));
const key=new THREE.DirectionalLight(0xffd7ac,3.2);key.position.set(-4,8,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x9a352b,2.2);rim.position.set(3,3,-4);scene.add(rim);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const skin=mat(0x98694f),skinLight=mat(0xb68160),hair=mat(0x211a17),pants=mat(0x302720),cloth=mat(0x493029),wrap=mat(0x806044),eye=mat(0x171211);
function addMesh(parent,geo,material,pos,scale=[1,1,1],rot=[0,0,0]){const o=new THREE.Mesh(geo,material);o.position.set(...pos);o.scale.set(...scale);o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function capsule(parent,material,a,b,r){const v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),d=v2.clone().sub(v1);const o=addMesh(parent,new THREE.CapsuleGeometry(r,Math.max(.01,d.length()-2*r),4,8),material,v1.clone().add(v2).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}
const ground=addMesh(scene,new THREE.PlaneGeometry(200,200),mat(0x303632,.98),[0,-.08,0],[1,1,1],[-Math.PI/2,0,0]);
const grid=new THREE.GridHelper(80,80,0x59635e,0x424943);grid.position.y=-.06;grid.material.transparent=true;grid.material.opacity=.25;scene.add(grid);
// Simple, visible, unarmored humanoid; kept independent from the uploaded GLB while import is validated.
const actor=new THREE.Group();scene.add(actor);
addMesh(actor,new THREE.CapsuleGeometry(.24,.43,6,12),skin,[0,1.48,0],[1.12,1.15,.8]);
addMesh(actor,new THREE.SphereGeometry(.23,16,12),skinLight,[0,1.81,0],[.86,1.03,.86]);
addMesh(actor,new THREE.SphereGeometry(.205,12,10),hair,[0,1.94,-.035],[1,.62,.92]);
addMesh(actor,new THREE.BoxGeometry(.08,.025,.025),eye,[-.085,1.84,.18]);
addMesh(actor,new THREE.BoxGeometry(.08,.025,.025),eye,[.085,1.84,.18]);
addMesh(actor,new THREE.CapsuleGeometry(.25,.2,4,10),pants,[0,1.15,0],[1.08,.8,.9]);
addMesh(actor,new THREE.BoxGeometry(.43,.12,.31),wrap,[0,1.23,.02]);
const legs=[],arms=[];
for(const side of [-1,1]){
 const leg=new THREE.Group();leg.position.set(side*.13,1.08,0);actor.add(leg);legs.push(leg);
 capsule(leg,pants,[0,-.02,0],[0,-.37,.015],.105);
 addMesh(leg,new THREE.SphereGeometry(.09,10,8),skin,[0,-.39,.025],[1,.85,1]);
 capsule(leg,skin,[0,-.40,.02],[0,-.70,.02],.065);
 addMesh(leg,new THREE.BoxGeometry(.14,.11,.23),pants,[0,-.82,.065]);
 addMesh(leg,new THREE.BoxGeometry(.145,.07,.25),hair,[0,-.87,.09]);
 const arm=new THREE.Group();arm.position.set(side*.30,1.65,0);actor.add(arm);arms.push(arm);
 addMesh(arm,new THREE.SphereGeometry(.105,10,8),skinLight,[side*.02,-.12,.025],[.88,1.2,.92]);
 capsule(arm,skin,[side*.02,-.13,.02],[side*.035,-.36,.02],.078);
 addMesh(arm,new THREE.SphereGeometry(.07,10,8),skin,[side*.035,-.37,.02]);
 capsule(arm,skin,[side*.035,-.39,.02],[side*.045,-.63,.06],.06);
 addMesh(arm,new THREE.SphereGeometry(.07,10,8),skinLight,[side*.045,-.66,.07],[.95,1.1,.9]);
 addMesh(arm,new THREE.CylinderGeometry(.066,.066,.075,8),wrap,[side*.04,-.56,.05]);
}
// Cargar el modelo humano real del repositorio sin ocultar el respaldo hasta que esté listo.
const importedActor=new THREE.Group();scene.add(importedActor);importedActor.visible=false;
let importedMixer=null;
const gltfLoader=new GLTFLoader();
const locomotionActor=new THREE.Group();scene.add(locomotionActor);locomotionActor.visible=false;
let locomotionMixer=null,walkAction=null,runAction=null,idleAction=null,activeAction=null,locomotionModelLoaded=false;
function selectLocomotion(next){if(!next||next===activeAction)return;if(activeAction)activeAction.fadeOut(.16);next.reset().fadeIn(.16).play();activeAction=next;}
const runButton=document.getElementById('run');runButton.addEventListener('pointerdown',e=>{e.preventDefault();keys.run=true;runButton.setPointerCapture(e.pointerId)});const stopRun=()=>keys.run=false;runButton.addEventListener('pointerup',stopRun);runButton.addEventListener('pointercancel',stopRun);runButton.addEventListener('lostpointercapture',stopRun);
gltfLoader.load('./assets/characters/human-base-rigged.glb',gltf=>{
 const model=gltf.scene;
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 const center=bounds.getCenter(new THREE.Vector3());
 if(size.y>0){
  const factor=1.82/size.y;
  model.scale.setScalar(factor);
  model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);
 }
 model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;}});
 importedActor.add(model);
 // No reproducir automáticamente el primer clip: puede ser T-pose, golpe o una animación no locomotora.\n if(gltf.animations&&gltf.animations.length){importedMixer=new THREE.AnimationMixer(model);}
 if(!locomotionModelLoaded){actor.visible=false;importedActor.visible=true;document.getElementById('hint').textContent='MODELO HUMANO GLB CARGADO · MOVER Y SALTAR';}
 else{actor.visible=false;importedActor.visible=false;}
},undefined,error=>{
 console.error('No se pudo cargar human-base-rigged.glb',error);
 errorBox.style.display='block';
 errorBox.textContent='No se pudo cargar el modelo humano GLB. Se mantiene el personaje provisional. '+(error?.message||'');
});
 
// Intentar cargar el personaje CC0 que incluye animaciones. El modelo actual queda como respaldo.
gltfLoader.load('./assets/characters/animations/locomotion-collection-jordan-3d-person-animated.glb',gltf=>{
 const model=gltf.scene;
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 const center=bounds.getCenter(new THREE.Vector3());
 if(size.y>0){
  const factor=1.82/size.y;
  model.scale.setScalar(factor);
  model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);
 }
 model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;}});
 locomotionActor.add(model);
 locomotionModelLoaded=true;
 locomotionMixer=new THREE.AnimationMixer(model);
 const clips=gltf.animations||[];
 // Elegir ciclos por nombre; evitar usar una animación arbitraria como caminata.
 const clipName=clip=>(clip.name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_-]+/g,' ').trim();
 const findClip=patterns=>{for(const pattern of patterns){const clip=clips.find(item=>pattern.test(clipName(item)));if(clip)return clip;}return undefined;};
 const idleClip=findClip([/idle loop/,/\bidle\b/,/standing/,/stand still/,/rest/,/breath/,/ready stance/]);
 // Algunos paquetes nombran los ciclos por dirección o locomoción, no literalmente "walk".
 const walkClip=findClip([/^walk formal loop$/, /^walk loop$/, /walk formal/, /walk.*loop/, /walking cycle/, /^walk$/]);
 const runClip=findClip([/sprint loop/,/running/,/\brun\b/,/\bjog\b/,/sprint/,/fast move/]);
 if(idleClip)idleAction=locomotionMixer.clipAction(idleClip);
 if(walkClip)walkAction=locomotionMixer.clipAction(walkClip);
 if(runClip)runAction=locomotionMixer.clipAction(runClip);
 // No reproducir clips desconocidos como si fueran caminata: eso causa la marcha tipo zombi.
 const initial=idleAction||walkAction||null;
 if(initial){initial.play();activeAction=initial;}
 // Priorizar el modelo humano animado aunque no se detecte una caminata en este archivo.
 // Evita que una carga tardía vuelva a mostrar el esqueleto base o el personaje geométrico.
 actor.visible=false;
 importedActor.visible=false;
 locomotionActor.visible=true;
 const names=clips.map(a=>a.name).filter(Boolean);
 document.getElementById('hint').textContent=walkAction
  ? 'CAMINAR: '+walkClip.name+' · CORRER: '+(runClip?.name||'CAMINATA RÁPIDA')
  : 'MODELO HUMANO ANIMADO · SIN CICLO DE CAMINATA DETECTADO'+(names.length?' · CLIPS: '+names.slice(0,3).join(' / '):'');
 console.info('Clips disponibles:',clips.map(a=>a.name),'selección:',{idle:idleClip?.name,walk:walkClip?.name,run:runClip?.name});
},undefined,error=>{
 console.warn('No se pudo cargar el GLB de animaciones; se conserva el personaje base.',error);
});


const keys={};document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});const off=()=>keys[k]=false;b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k===' '){e.preventDefault();jump()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let jumpY=0,jumpV=0;function jump(){if(jumpY<=.001)jumpV=5.1}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
let elapsed=0;const clock=new THREE.Clock();const camOffset=new THREE.Vector3(0,3.1,6.2);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;if(importedMixer)importedMixer.update(dt);
if(jumpY>0||jumpV>0){jumpV-=12*dt;jumpY+=jumpV*dt;if(jumpY<=0){jumpY=0;jumpV=0}}
const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),moving=!!(f||side),running=!!(keys.run||keys.shift),speed=running?3.2:1.8;
if(moving){const angle=Math.atan2(side,f);actor.rotation.y=angle;actor.position.x+=Math.sin(angle)*speed*dt;actor.position.z+=Math.cos(angle)*f*speed*dt+Math.sin(angle)*side*speed*dt;const gait=elapsed*9;legs[0].rotation.x=Math.sin(gait)*.48;legs[1].rotation.x=-Math.sin(gait)*.48;arms[0].rotation.x=-Math.sin(gait)*.18;arms[1].rotation.x=Math.sin(gait)*.18}else{legs.forEach(l=>l.rotation.x*=.85);arms.forEach(a=>a.rotation.x*=.85)}
if(locomotionMixer){selectLocomotion(moving?(running?(runAction||walkAction):(walkAction||idleAction)):(idleAction||walkAction));locomotionMixer.update(dt);}
actor.position.y=jumpY;importedActor.position.copy(actor.position);importedActor.rotation.y=actor.rotation.y;locomotionActor.position.copy(actor.position);locomotionActor.rotation.y=actor.rotation.y;camera.position.lerp(new THREE.Vector3(actor.position.x+camOffset.x,camOffset.y+jumpY,actor.position.z+camOffset.z),Math.min(1,dt*3));camera.lookAt(actor.position.x,1.05+jumpY,actor.position.z);renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);animate();
</script></body></html>
