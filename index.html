<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Supervivencia 3D — Guerrero</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}button{-webkit-appearance:none;appearance:none;cursor:pointer;padding:0;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#run{position:fixed;z-index:20;right:max(28px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui;touch-action:none}#jump{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 28px);width:84px;height:84px;border:2px solid #f3d7a0;border-radius:50%;background:#762b23;color:#fff4df;font:bold 15px system-ui;box-shadow:0 5px 22px #000b;touch-action:none}
#atk{position:fixed;z-index:20;right:max(116px,calc(env(safe-area-inset-right) + 104px));bottom:calc(env(safe-area-inset-bottom) + 40px);width:72px;height:72px;border:2px solid #d8a8a0;border-radius:50%;background:#5a1f1a;color:#fff4df;font:bold 13px system-ui;box-shadow:0 5px 18px #000b;touch-action:none}#arm{position:fixed;z-index:20;right:max(116px,calc(env(safe-area-inset-right) + 104px));bottom:calc(env(safe-area-inset-bottom) + 126px);width:68px;height:54px;border:1px solid #c4c9c0;border-radius:14px;background:#27352fe8;color:#fff;font:bold 13px system-ui;touch-action:none}#arm.on{background:#6b5a22;border-color:#f3d7a0}
#pad{position:fixed;z-index:20;left:16px;bottom:24px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px}
#pad button{border:1px solid #aab4b4aa;border-radius:12px;background:#20272be8;color:#fff;font:22px system-ui;touch-action:none}
#stat{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 34px);left:0;right:0;text-align:center;color:#f3d7a0;font:bold 13px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none}
#hint{position:fixed;z-index:20;top:env(safe-area-inset-top);left:0;right:0;text-align:center;padding:12px;color:#e8dfce;font:12px system-ui;letter-spacing:.08em;text-shadow:0 2px 4px #000;pointer-events:none}
#error{position:fixed;z-index:30;top:20%;left:8%;right:8%;padding:14px;background:#401b1b;color:#fff;font:14px system-ui;display:none;white-space:pre-wrap}
#story{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:20px}
#story .box{max-width:340px;background:#1a1814ee;border:1px solid #c4a574;border-radius:12px;padding:18px 20px;color:#e8dfce;font:14px/1.45 system-ui}
#story h3{margin:0 0 10px;color:#f3d7a0;font-size:15px;letter-spacing:.06em}
#story p{margin:0 0 14px;white-space:pre-wrap}
#story button{display:block;width:100%;padding:10px;border:1px solid #c4a574;border-radius:8px;background:#2a241c;color:#f3d7a0;font:bold 13px system-ui}
</style>
</head>
<body>
<div id="stat"></div><div id="hint">EL REGRESO · EXPLORA EL CASTILLO</div>
<div id="pad"><button data-k="w" style="grid-column:2;grid-row:1">▲</button><button data-k="a" style="grid-column:1;grid-row:2">◀</button><button data-k="s" style="grid-column:2;grid-row:2">▼</button><button data-k="d" style="grid-column:3;grid-row:2">▶</button></div>
<button id="atk">ATACAR</button><button id="arm">ARMA</button><button id="run">CORRER</button><button id="jump">⬆<br>SALTAR</button><div id="error"></div>
<div id="story"><div class="box"><h3 id="storyTitle"></h3><p id="storyText"></p><button id="storyClose">Cerrar</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { buildCourse, createPlayer, stepPlayer, HALF_WIDTH, WALK_SPEED, RUN_SPEED } from './course.js';
import { buildMap1, getCurrentZone, STORY_PAGE, distanceToPage, resolveWallCollisions } from './map1.js';

const errorBox=document.getElementById('error');
addEventListener('error',e=>{errorBox.style.display='block';errorBox.textContent='Error del juego: '+(e.message||'desconocido')});
addEventListener('unhandledrejection',e=>{errorBox.style.display='block';errorBox.textContent='Error de carga: '+(e.reason?.message||e.reason||'desconocido')});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x12161c);
scene.fog=new THREE.Fog(0x12161c, 18, 55);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Iluminación atmosférica + sombras
scene.add(new THREE.HemisphereLight(0x8aa0b8,0x2a2218,1.0));
const key=new THREE.DirectionalLight(0xffe8c8,2.0);
key.position.set(-8,16,6);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=1;
key.shadow.camera.far=60;
key.shadow.camera.left=-30;
key.shadow.camera.right=30;
key.shadow.camera.top=30;
key.shadow.camera.bottom=-30;
key.shadow.bias=-0.001;
scene.add(key);
const rim=new THREE.DirectionalLight(0x9a4535,1.2);
rim.position.set(5,4,-6);
scene.add(rim);

function addTorchLight(x,y,z){
  const l=new THREE.PointLight(0xffb060,2.4,12,1.4);
  l.position.set(x,y,z);
  l.castShadow=false; // ahorrar rendimiento en móvil
  scene.add(l);
}
addTorchLight(-8,2.8,14);
addTorchLight(8,2.8,14);
addTorchLight(-6,2.6,-6);
addTorchLight(6,2.6,-6);
addTorchLight(-5,2.8,-26);
addTorchLight(5,2.8,-26);
addTorchLight(-7,3.2,-40);
addTorchLight(7,3.2,-40);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const skin=mat(0x98694f),skinLight=mat(0xb68160),hair=mat(0x211a17),pants=mat(0x302720),cloth=mat(0x493029),wrap=mat(0x806044),eye=mat(0x171211);
function addMesh(parent,geo,material,pos,scale=[1,1,1],rot=[0,0,0]){const o=new THREE.Mesh(geo,material);o.position.set(...pos);o.scale.set(...scale);o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function capsule(parent,material,a,b,r){const v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),d=v2.clone().sub(v1);const o=addMesh(parent,new THREE.CapsuleGeometry(r,Math.max(.01,d.length()-2*r),4,8),material,v1.clone().add(v2).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}

// === MAPA 1: El Regreso ===
const mapData = buildMap1(scene);
const herbs = mapData.herbs;
let pageRead = false;

// Segmento amplio solo para que course.js no falle; el suelo real es el mapa abierto.
const course = { segments: [{ a: 50, b: -70 }], gaps: 0 };
const player = createPlayer(course);
player.x = 0;
player.z = 28;
player.checkpoint = { x: 0, z: 28 };
player.facing = Math.PI;

const statBox=document.getElementById('stat');let lastStat='';
function updateStat(){
  const zone = getCurrentZone(player.x, player.z) || 'exterior';
  const t = zone.toUpperCase() + (pageRead ? ' · PÁGINA LEÍDA' : '');
  if(t!==lastStat){statBox.textContent=t;lastStat=t}
}

const storyEl = document.getElementById('story');
document.getElementById('storyClose').addEventListener('pointerdown', () => { storyEl.style.display = 'none'; });
function showStoryPage() {
  if (pageRead) return;
  document.getElementById('storyTitle').textContent = STORY_PAGE.title;
  document.getElementById('storyText').textContent = STORY_PAGE.text;
  storyEl.style.display = 'flex';
  pageRead = true;
  if (mapData.pageMesh) mapData.pageMesh.visible = false;
}

// Personaje provisional (no tocar lógica de carga GLB)
const actor=new THREE.Group();scene.add(actor);
addMesh(actor,new THREE.CapsuleGeometry(.24,.43,6,12),skin,[0,1.48,0],[1.12,1.15,.8]);
addMesh(actor,new THREE.SphereGeometry(.23,16,12),skinLight,[0,1.81,0],[.86,1.03,.86]);
addMesh(actor,new THREE.SphereGeometry(.205,12,10),hair,[0,1.94,-.035],[1,.62,.92]);
addMesh(actor,new THREE.BoxGeometry(.08,.025,.025),eye,[-.085,1.84,.18]);
addMesh(actor,new THREE.BoxGeometry(.08,.025,.025),eye,[.085,1.84,.18]);
addMesh(actor,new THREE.CapsuleGeometry(.25,.2,4,10),pants,[0,1.15,0],[1.08,.8,.9]);
addMesh(actor,new THREE.BoxGeometry(.43,.12,.31),wrap,[0,1.23,.02]);
const legs=[],arms=[];
for(const side of [-1,1]){
 const leg=new THREE.Group();leg.position.set(side*.13,1.08,0);actor.add(leg);legs.push(leg);
 capsule(leg,pants,[0,-.02,0],[0,-.37,.015],.105);
 addMesh(leg,new THREE.SphereGeometry(.09,10,8),skin,[0,-.39,.025],[1,.85,1]);
 capsule(leg,skin,[0,-.40,.02],[0,-.70,.02],.065);
 addMesh(leg,new THREE.BoxGeometry(.14,.11,.23),pants,[0,-.82,.065]);
 addMesh(leg,new THREE.BoxGeometry(.145,.07,.25),hair,[0,-.87,.09]);
 const arm=new THREE.Group();arm.position.set(side*.30,1.65,0);actor.add(arm);arms.push(arm);
 addMesh(arm,new THREE.SphereGeometry(.105,10,8),skinLight,[side*.02,-.12,.025],[.88,1.2,.92]);
 capsule(arm,skin,[side*.02,-.13,.02],[side*.035,-.36,.02],.078);
 addMesh(arm,new THREE.SphereGeometry(.07,10,8),skin,[side*.035,-.37,.02]);
 capsule(arm,skin,[side*.035,-.39,.02],[side*.045,-.63,.06],.06);
 addMesh(arm,new THREE.SphereGeometry(.07,10,8),skinLight,[side*.045,-.66,.07],[.95,1.1,.9]);
 addMesh(arm,new THREE.CylinderGeometry(.066,.066,.075,8),wrap,[side*.04,-.56,.05]);
}
const importedActor=new THREE.Group();scene.add(importedActor);importedActor.visible=false;
let importedMixer=null;
const gltfLoader=new GLTFLoader();
const locomotionActor=new THREE.Group();scene.add(locomotionActor);locomotionActor.visible=false;
let locomotionMixer=null,walkAction=null,runAction=null,idleAction=null,activeAction=null,locomotionModelLoaded=false;
function selectLocomotion(next){if(!next||next===activeAction)return;if(activeAction)activeAction.fadeOut(.16);next.reset().fadeIn(.16).play();activeAction=next;}
const runButton=document.getElementById('run');runButton.addEventListener('pointerdown',e=>{e.preventDefault();keys.run=true;runButton.setPointerCapture(e.pointerId)});const stopRun=()=>keys.run=false;runButton.addEventListener('pointerup',stopRun);runButton.addEventListener('pointercancel',stopRun);runButton.addEventListener('lostpointercapture',stopRun);
gltfLoader.load('./assets/characters/human-base-rigged.glb',gltf=>{
 const model=gltf.scene;
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 const center=bounds.getCenter(new THREE.Vector3());
 if(size.y>0){
  const factor=1.82/size.y;
  model.scale.setScalar(factor);
  model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);
 }
 model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;}});
 importedActor.add(model);
 if(gltf.animations&&gltf.animations.length){importedMixer=new THREE.AnimationMixer(model);}
 if(!locomotionModelLoaded){actor.visible=false;importedActor.visible=true;document.getElementById('hint').textContent='MODELO HUMANO GLB CARGADO · EXPLORA EL CASTILLO';}
 else{actor.visible=false;importedActor.visible=false;}
},undefined,error=>{
 console.error('No se pudo cargar human-base-rigged.glb',error);
 errorBox.style.display='block';
 errorBox.textContent='No se pudo cargar el modelo humano GLB. Se mantiene el personaje provisional. '+(error?.message||'');
});

let attackAction=null,swordIdleAction=null,jumpStartAction=null,jumpLoopAction=null,attacking=false,armed=false;
const normName=n=>(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const CLIP_NAMES={
 idle:['idle loop','idle standing','idle'],
 walk:['walk loop','walk formal loop','walk relaxed','walk brisk'],
 run:['sprint loop','jog fwd loop','run','jog'],
 attack:['sword attack'],
 swordIdle:['sword idle'],
 jumpStart:['jump start'],
 jumpLoop:['jump loop']
};
function findClip(clips,names){for(const n of names){const c=clips.find(item=>normName(item.name)===n);if(c)return c;}return undefined;}
function toggleArm(){armed=!armed;document.getElementById('arm').classList.toggle('on',armed);}
function attack(){
 if(!attackAction||attacking||!player.grounded)return;
 attacking=true;
 if(activeAction)activeAction.fadeOut(.1);
 attackAction.reset().fadeIn(.1).play();
 activeAction=attackAction;
}
function setupLocomotion(gltf,label){
 const model=gltf.scene;
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 const center=bounds.getCenter(new THREE.Vector3());
 if(size.y>0){
  const factor=1.82/size.y;
  model.scale.setScalar(factor);
  model.position.set(-center.x*factor,-bounds.min.y*factor,-center.z*factor);
 }
 model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;obj.frustumCulled=false;}});
 locomotionActor.add(model);
 locomotionModelLoaded=true;
 locomotionMixer=new THREE.AnimationMixer(model);
 const clips=gltf.animations||[];
 const idleClip=findClip(clips,CLIP_NAMES.idle),walkClip=findClip(clips,CLIP_NAMES.walk),runClip=findClip(clips,CLIP_NAMES.run);
 const attackClip=findClip(clips,CLIP_NAMES.attack),swordIdleClip=findClip(clips,CLIP_NAMES.swordIdle);
 if(idleClip)idleAction=locomotionMixer.clipAction(idleClip);
 if(walkClip)walkAction=locomotionMixer.clipAction(walkClip);
 if(runClip)runAction=locomotionMixer.clipAction(runClip);
 if(swordIdleClip)swordIdleAction=locomotionMixer.clipAction(swordIdleClip);
 const jumpStartClip=findClip(clips,CLIP_NAMES.jumpStart),jumpLoopClip=findClip(clips,CLIP_NAMES.jumpLoop);
 if(jumpStartClip){jumpStartAction=locomotionMixer.clipAction(jumpStartClip);jumpStartAction.setLoop(THREE.LoopOnce,1);jumpStartAction.clampWhenFinished=true;}
 if(jumpLoopClip)jumpLoopAction=locomotionMixer.clipAction(jumpLoopClip);
 if(attackClip){attackAction=locomotionMixer.clipAction(attackClip);attackAction.setLoop(THREE.LoopOnce,1);attackAction.clampWhenFinished=false;}
 locomotionMixer.addEventListener('finished',e=>{if(e.action===attackAction){attacking=false;attackAction.fadeOut(.15);activeAction=null;}});
 const initial=idleAction||walkAction||null;
 if(initial){initial.play();activeAction=initial;}
 actor.visible=false;
 importedActor.visible=false;
 locomotionActor.visible=true;
 document.getElementById('hint').textContent=label+' · MAPA: EL REGRESO · EXPLORA';
 console.info('Clips disponibles:',clips.map(a=>a.name),'selección:',{idle:idleClip?.name,walk:walkClip?.name,run:runClip?.name,attack:attackClip?.name,swordIdle:swordIdleClip?.name});
}
gltfLoader.load('./assets/characters/ual/UAL1_Standard.glb',gltf=>setupLocomotion(gltf,'GUERRERO UAL'),undefined,error=>{
 console.warn('No se pudo cargar UAL1_Standard.glb; se usa el hombre de traje como respaldo.',error);
 gltfLoader.load('./assets/characters/animations/locomotion-collection-jordan-3d-person-animated.glb',gltf=>setupLocomotion(gltf,'MODELO DE RESPALDO'),undefined,err=>console.warn('No se pudo cargar el respaldo; se conserva el personaje base.',err));
});

document.getElementById('atk').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
document.getElementById('arm').addEventListener('pointerdown',e=>{e.preventDefault();toggleArm()});

const keys={};
const DIRS=['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright'];const tapAt={};let runLatch=false;
function press(k,repeat){if(DIRS.includes(k)&&!keys[k]&&!repeat){const now=performance.now();if(now-(tapAt[k]??-1e9)<320)runLatch=true;tapAt[k]=now}keys[k]=true}
function release(k){keys[k]=false;if(!DIRS.some(d=>keys[d]))runLatch=false}
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k,false);b.setPointerCapture(e.pointerId)});const off=()=>release(k);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();press(k,e.repeat);if(k===' '){e.preventDefault();jump()}if(k==='j')attack();if(k==='e'&&!e.repeat)toggleArm();});addEventListener('keyup',e=>release(e.key.toLowerCase()));
let jumpQueued=false;function jump(){jumpQueued=true}document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
let elapsed=0;const clock=new THREE.Clock();const camOffset=new THREE.Vector3(0,3.1,6.2);camera.position.set(player.x+camOffset.x,camOffset.y,player.z+camOffset.z);
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  elapsed+=dt;
  if(importedMixer)importedMixer.update(dt);

  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
  const side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  const running=!!(keys.run||keys.shift||runLatch);
  const speed=running?RUN_SPEED:WALK_SPEED;
  const moving=!attacking&&!!(f||side);

  stepPlayer(player,course,{f,side,speed,running,jump:jumpQueued,canMove:!attacking},dt);
  jumpQueued=false;

  // Mapa abierto: el suelo es continuo (evita que HALF_WIDTH de course.js te tire al vacío)
  if (player.y < 0.05) {
    player.y = 0;
    player.vy = 0;
    player.grounded = true;
    player.jumping = false;
    player.avx = 0;
    player.avz = 0;
  }

  // Colisiones con paredes del mapa
  resolveWallCollisions(player);

  // Página de la biblioteca
  if (!pageRead && distanceToPage(player.x, player.y, player.z) < 2.4) {
    showStoryPage();
  }

  actor.position.set(player.x,player.y,player.z);actor.rotation.y=player.facing;
  if(moving){const gait=elapsed*9;legs[0].rotation.x=Math.sin(gait)*.48;legs[1].rotation.x=-Math.sin(gait)*.48;arms[0].rotation.x=-Math.sin(gait)*.18;arms[1].rotation.x=Math.sin(gait)*.18}else{legs.forEach(l=>l.rotation.x*=.85);arms.forEach(a=>a.rotation.x*=.85)}
  if(locomotionMixer){
   if(!attacking){
    let next;
    if(!player.grounded)next=(player.jumping&&player.airTime<.3?(jumpStartAction||jumpLoopAction):(jumpLoopAction||jumpStartAction))||idleAction;
    else next=moving?(running?(runAction||walkAction):(walkAction||idleAction)):(armed&&swordIdleAction?swordIdleAction:(idleAction||walkAction));
    selectLocomotion(next);
   }
   locomotionMixer.update(dt);
  }
  importedActor.position.copy(actor.position);importedActor.rotation.y=actor.rotation.y;
  locomotionActor.position.copy(actor.position);locomotionActor.rotation.y=actor.rotation.y;
  const camY=Math.max(player.y,-.6);
  camera.position.lerp(new THREE.Vector3(actor.position.x+camOffset.x,camOffset.y+camY,actor.position.z+camOffset.z),Math.min(1,dt*3));
  camera.lookAt(actor.position.x,1.05+camY,actor.position.z);
  updateStat();
  renderer.render(scene,camera);
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);animate();
</script></body></html>
