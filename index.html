<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a17">
<title>Supervivencia 3D</title>
<style>
:root{color-scheme:dark;--glass:rgba(10,18,16,.78);--line:rgba(255,255,255,.18);--green:#a8e063}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a17;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)}#status{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;width:min(210px,56vw)}.meter{height:7px;border-radius:9px;background:#ffffff2b;overflow:hidden;margin:4px 0 8px}.fill{height:100%;width:100%;transition:width .2s}.health{background:#e65c56}.food{background:#e9b64b}.water{background:#53b9e9}#stats{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;text-align:right;font-size:12px}#message{position:absolute;top:28%;left:50%;transform:translateX(-50%);padding:10px 14px;text-align:center;max-width:85vw;opacity:0;transition:opacity .2s;font-weight:600}#message.show{opacity:1}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:12px}.joystick{width:116px;height:116px;border-radius:50%;background:#ffffff19;border:1px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none;flex:none}.stick{width:48px;height:48px;border-radius:50%;background:#ffffff66;border:1px solid #ffffffaa;position:absolute;left:33px;top:33px}.actions{display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:auto}.action{min-width:112px;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid #ffffff55;background:#12231fe8;color:white;font-size:14px;font-weight:700;touch-action:manipulation}.action.primary{background:#416b30ed;border-color:#b9ee8a}.action:disabled{opacity:.42}#hint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff9;text-align:center;white-space:nowrap}#inventory{position:absolute;top:calc(env(safe-area-inset-top) + 100px);right:10px;font-size:12px;line-height:1.65}#title{font-weight:800;font-size:15px;letter-spacing:.4px}small{color:#d6e3d9}
@media(min-width:760px){#status{width:230px}#bottom{left:24px;right:24px;bottom:20px}.joystick{width:130px;height:130px}.stick{left:40px;top:40px}#hint{bottom:160px}}
</style>
</head>
<body>
<div id="hud">
 <div id="status" class="panel"><div id="title">SUPERVIVENCIA <span style="color:var(--green)">3D</span></div><small>Estado del superviviente</small><div style="font-size:12px;margin-top:8px">❤️ Salud <span id="healthText">100</span></div><div class="meter"><div id="health" class="fill health"></div></div><div style="font-size:12px">🍖 Hambre <span id="foodText">100</span></div><div class="meter"><div id="food" class="fill food"></div></div><div style="font-size:12px">💧 Sed <span id="waterText">100</span></div><div class="meter"><div id="water" class="fill water"></div></div></div>
 <div id="stats" class="panel">DÍA <b id="day">1</b><br><span id="time">08:00</span><br><span id="weather">Bosque templado</span></div>
 <div id="inventory" class="panel">🪵 Madera: <b id="wood">0</b><br>🪨 Piedra: <b id="stone">0</b><br>🪓 Hacha: <b id="axe">No</b></div>
 <div id="message" class="panel">Explora para encontrar recursos</div>
 <div id="hint">Mueve el control y acércate a los recursos</div>
 <div id="bottom"><div id="joystick" class="joystick" aria-label="Control de movimiento"><div id="stick" class="stick"></div></div><div class="actions"><button id="collect" class="action">✋ RECOGER</button><button id="craft" class="action primary">🪓 FABRICAR HACHA</button></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbbc0);scene.fog=new THREE.Fog(0x9bbbc0,32,115);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x45543b,2.0));const sun=new THREE.DirectionalLight(0xffedcf,2.3);sun.position.set(-24,38,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220,32,32),mat(0x526e45));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Patches of grass create a varied forest floor.
for(let i=0;i<700;i++){const x=(Math.random()-.5)*190,z=(Math.random()-.5)*190;const g=new THREE.Mesh(new THREE.ConeGeometry(.035+Math.random()*.045,.15+Math.random()*.2,3),mat(Math.random()>.5?0x71834a:0x87945a));g.position.set(x,.07,z);g.rotation.z=(Math.random()-.5)*.4;scene.add(g)}
// Distant hills
for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r=76+Math.random()*20,h=10+Math.random()*18;const hill=new THREE.Mesh(new THREE.ConeGeometry(12+Math.random()*9,h,7),mat(i%2?0x536e59:0x647e64));hill.position.set(Math.cos(a)*r,h/2-1,Math.sin(a)*r);hill.rotation.y=Math.random()*2;scene.add(hill)}
// Player model
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.72,4,8),mat(0x3d6654));body.position.y=.92;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(0xc8946b));head.position.y=1.65;head.castShadow=true;player.add(head);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.48,.52,.25),mat(0x76553a));pack.position.set(0,1.02,-.32);pack.castShadow=true;player.add(pack);
const legs=[];for(const x of [-.17,.17]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.19,.55,.22),mat(0x353d38));leg.position.set(x,.3,0);leg.castShadow=true;player.add(leg);legs.push(leg)}
player.position.set(0,0,0);
const resources=[];const treeMat=mat(0x68452d),leafMats=[mat(0x2e5636),mat(0x3b6840),mat(0x496f43)],rockMat=mat(0x777d7a);
function addTree(x,z){const group=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,2.2,7),treeMat);trunk.position.y=1.1;trunk.castShadow=true;group.add(trunk);for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.ConeGeometry(1.05-j*.13,1.65,7),leafMats[Math.floor(Math.random()*leafMats.length)]);crown.position.y=2.2+j*.63;crown.castShadow=true;group.add(crown)}group.position.set(x,0,z);scene.add(group);resources.push({type:'wood',mesh:group,position:group.position,active:true})}
function addRock(x,z){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.55+Math.random()*.5,0),rockMat);m.position.set(x,.35,z);m.scale.y=.7;m.rotation.set(Math.random(),Math.random(),Math.random());m.castShadow=true;m.receiveShadow=true;scene.add(m);resources.push({type:'stone',mesh:m,position:m.position,active:true})}
for(let i=0;i<90;i++){let x,z;do{x=(Math.random()-.5)*100;z=(Math.random()-.5)*100}while(Math.hypot(x,z)<7);if(Math.random()<.64)addTree(x,z);else addRock(x,z)}
// Small stream
const stream=new THREE.Mesh(new THREE.PlaneGeometry(5,120),new THREE.MeshStandardMaterial({color:0x4f9db0,roughness:.22,metalness:.05,transparent:true,opacity:.8}));stream.rotation.x=-Math.PI/2;stream.position.set(17,.018,0);scene.add(stream);
let health=100,food=100,water=100,wood=0,stone=0,hasAxe=false,gameTime=8*60,elapsed=0,moveX=0,moveY=0,walking=0;
const $=id=>document.getElementById(id);
function updateHud(){for(const [id,v] of [['health',health],['food',food],['water',water]]){$(id).style.width=Math.max(0,v)+'%';$(id+'Text').textContent=Math.round(v)}$('wood').textContent=wood;$('stone').textContent=stone;$('axe').textContent=hasAxe?'Sí':'No';$('craft').disabled=hasAxe||wood<3||stone<2}
let msgTimer;function message(t){$('message').textContent=t;$('message').classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>$('message').classList.remove('show'),2100)}
function nearest(){let best=null,dist=Infinity;for(const r of resources){if(!r.active)continue;const d=Math.hypot(player.position.x-r.position.x,player.position.z-r.position.z);if(d<dist){dist=d;best=r}}return {best,dist}}
$('collect').addEventListener('click',()=>{const {best,dist}=nearest();if(!best||dist>3.1){message('Acércate a un árbol o una piedra');return}if(best.type==='wood'){wood+=hasAxe?3:1;message(hasAxe?'Recolectaste 3 de madera':'Recolectaste 1 de madera')}else{stone+=1;message('Recolectaste 1 de piedra')}best.active=false;scene.remove(best.mesh);updateHud()});
$('craft').addEventListener('click',()=>{if(hasAxe)return;if(wood<3||stone<2){message('Necesitas 3 de madera y 2 piedras');return}wood-=3;stone-=2;hasAxe=true;message('¡Hacha fabricada! Ahora recoges más madera');updateHud()});
// Touch joystick and keyboard controls
const joy=$('joystick'),stick=$('stick');let pointer=null,joyRect;
function setJoy(e){joyRect=joy.getBoundingClientRect();const cx=joyRect.left+joyRect.width/2,cy=joyRect.top+joyRect.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=joyRect.width*.32,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}moveX=dx/max;moveY=dy/max;stick.style.left=(joyRect.width/2-24+dx)+'px';stick.style.top=(joyRect.height/2-24+dy)+'px'}
joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e)});function resetJoy(){pointer=null;moveX=moveY=0;stick.style.left='calc(50% - 24px)';stick.style.top='calc(50% - 24px)'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;gameTime+=dt*1.25;food=Math.max(0,food-dt*.12);water=Math.max(0,water-dt*.19);if(food===0||water===0)health=Math.max(0,health-dt*.8);if(health===0)message('Te has quedado sin fuerzas. Recarga la página para reiniciar.');if(elapsed>0&&Math.floor(elapsed)%2===0){/* survival values update continuously below */}
let ix=moveX,iz=moveY;if(keys.w||keys.arrowup)iz=-1;if(keys.s||keys.arrowdown)iz=1;if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;const len=Math.hypot(ix,iz);if(len>.08&&health>0){ix/=Math.max(1,len);iz/=Math.max(1,len);player.position.x+=ix*dt*4.1;player.position.z+=iz*dt*4.1;player.rotation.y=Math.atan2(ix,iz);walking+=dt*11;legs[0].rotation.x=Math.sin(walking)*.5;legs[1].rotation.x=-Math.sin(walking)*.5}else{legs.forEach(l=>l.rotation.x*=.8)}
player.position.x=THREE.MathUtils.clamp(player.position.x,-95,95);player.position.z=THREE.MathUtils.clamp(player.position.z,-95,95);
const target=new THREE.Vector3(player.position.x,1.1,player.position.z);const behind=new THREE.Vector3(player.position.x+Math.sin(player.rotation.y)*7,4.1,player.position.z+Math.cos(player.rotation.y)*7);camera.position.lerp(behind,.09);camera.lookAt(target);
sun.position.set(player.position.x-24,38,player.position.z+20);sun.target.position.copy(player.position);sun.target.updateMatrixWorld();
const mins=Math.floor(gameTime)%1440;$('time').textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');$('day').textContent=String(1+Math.floor(gameTime/(24*60)));updateHud();renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight)});
updateHud();message('Bienvenido. Explora y reúne recursos');animate();
</script>
</body>
</html>
