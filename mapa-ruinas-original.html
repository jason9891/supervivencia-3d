<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruinas del desierto · mapa por sectores</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a99d84; font: 13px/1.4 system-ui, sans-serif; color: #eee6d4; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); padding: 8px 12px; border-radius: 8px;
         background: rgba(20,16,12,.7); pointer-events: none; max-width: 330px; }
  #hud b { font-size: 15px; }
  #mm { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 200px; height: 200px;
        border-radius: 8px; background: rgba(20,16,12,.7); }
  #diag { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); width: min(360px, calc(100% - 24px));
          background: rgba(0,0,0,.8); border-radius: 8px; font: 11px/1.4 ui-monospace, Consolas, monospace; }
  #diag button { float: right; margin: 4px; font-size: 11px; }
  #diag pre { margin: 0; padding: 6px 8px; max-height: 30vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #diag.min pre { display: none; }
</style>
</head>
<body>
<div id="hud">Cargando…</div>
<canvas id="mm" width="200" height="200"></canvas>
<div id="diag"><button id="dMin">–</button><b style="padding:6px 8px;display:block">Diagnóstico</b><pre id="dl"></pre></div>
<script>
(function () {   // diagnóstico mínimo, antes que todo lo demás
  var L = [], t0 = performance.now();
  window.DIAG = { add: function (k, s) {
    L.push('[' + ((performance.now() - t0) / 1000).toFixed(1) + 's] [' + k + '] ' + s);
    var e = document.getElementById('dl'); if (e) { e.textContent = L.slice(-40).join('\n'); e.scrollTop = e.scrollHeight; } } };
  window.addEventListener('error', function (e) {
    var t = e.target;
    DIAG.add('ERROR', t && t !== window && (t.src || t.href) ? 'No cargó: ' + (t.src || t.href) : (e.message || 'error') + ' (línea ' + e.lineno + ')');
  }, true);
  document.getElementById('dMin').onclick = function () { document.getElementById('diag').classList.toggle('min'); };
})();
</script>
<script>
// =====================================================================
// MAPA — copia desde aquí hasta «FIN DEL MAPA» a tu juego.
//   const map = createRuinsMap(THREE);  scene.add(map.group);
//   map.setVisible(map.sectorAt(x, z));            // solo se dibujan el sector actual y los vecinos
//   const [nx, nz] = map.collide(x, z, radio);     // empuja al jugador fuera de muros y columnas
//   map.spawns -> [{x, z, tier, zone}]             // enemigos: 'ligero' | 'medio' | 'pesado' | 'jefe'
//   map.ATM[kind] -> [colorNiebla, densidad]       // atmósfera de cada tipo de sector
// =====================================================================
function createRuinsMap(THREE, opts) {
  opts = opts || {};
  const S = opts.scale || 2, W = 14, T = 1.6, H = 7;          // S = metros por unidad del plano; W = ancho de pasillos
  let seed = (opts.seed || 11) >>> 0;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296), rr = (a, b) => a + (b - a) * rnd();

  // ---- plano: salas [nombre, tipo, x0, z0, x1, z1, enemigos] y pasillos [eje, centro, desde, hasta, salaIni, salaFin] ----
  const Z = [
    ['Patio de acceso', 'patio', 60, 60, 170, 150, [['ligero', 4]]],
    ['Salón de columnas I', 'columnas', 60, 230, 210, 340, [['ligero', 4], ['medio', 2]]],
    ['Cámara de ruinas', 'ruinas', 300, 220, 430, 350, [['medio', 4]]],
    ['Plaza del monumento', 'plaza', 260, 440, 470, 580, [['medio', 6], ['pesado', 1]]],
    ['Santuario elevado', 'cripta', 50, 440, 170, 580, [['medio', 2], ['pesado', 2]], 4.8],
    ['Gran salón II', 'columnas', 550, 440, 690, 580, [['medio', 4], ['pesado', 2]]],
    ['Patio de arena', 'patio', 520, 220, 650, 350, [['ligero', 8]]],
    ['Sala del trono', 'trono', 270, 620, 430, 690, [['medio', 3], ['pesado', 2]], 2.4],
    ['Cámara del jefe', 'jefe', 500, 610, 690, 690, [['medio', 4], ['jefe', 1]], 4.8],
    ['Ruinas abiertas', 'abierta', 200, 40, 420, 170, [['ligero', 6], ['medio', 2]]]
  ].map(a => ({ name: a[0], kind: a[1], x0: a[2] * S, z0: a[3] * S, x1: a[4] * S, z1: a[5] * S, en: a[6], f: a[7] || 0, gS: [], gN: [], gW: [], gE: [] }));
  const C = [['z', 115, 150, 230, 0, 1], ['x', 285, 210, 300, 1, 2], ['z', 365, 350, 440, 2, 3], ['x', 510, 170, 260, 4, 3],
    ['x', 510, 470, 550, 3, 5], ['x', 285, 430, 520, 2, 6], ['z', 585, 350, 440, 6, 5], ['z', 365, 580, 620, 3, 7],
    ['x', 655, 430, 500, 7, 8], ['z', 620, 580, 610, 5, 8], ['x', 105, 170, 200, 0, 9], ['z', 365, 170, 220, 9, 2]
  ].map(a => ({ axis: a[0], k: a[1] * S, a: a[2] * S, b: a[3] * S, lo: a[4], hi: a[5] }));
  const ATM = { patio: [0xb8a47c, 0.0065, 1.0, 0.9], columnas: [0xa99870, 0.008, 0.55, 0.6], ruinas: [0x9a9484, 0.009, 0.6, 0.6], plaza: [0xbfae84, 0.006, 0.9, 0.8],
    cripta: [0x2b2622, 0.022, 0.12, 0.25], trono: [0x3a2420, 0.016, 0.25, 0.35], jefe: [0x2a2036, 0.014, 0.22, 0.3], abierta: [0xbcb39c, 0.005, 1.0, 0.9], pasillo: [0x8d8470, 0.013, 0.4, 0.45] };

  // ---- sectores: 0..9 salas, 10.. pasillos; cada uno con su grupo, vecinos y listas de piezas ----
  const nd = () => ({ blocks: [], shafts: [], parts: [], rings: [], pads: [], spires: [], arches: [], cols: [], colsB: [], torch: [], planes: [], wedges: [] });
  const sectors = Z.map(z => ({ name: z.name, kind: z.kind, nb: [], d: nd() })).concat(C.map((c, i) => ({ name: 'Pasillo ' + (i + 1), kind: 'pasillo', nb: [c.lo, c.hi], d: nd() })));
  C.forEach((c, i) => { sectors[c.lo].nb.push(10 + i); sectors[c.hi].nb.push(10 + i); });

  // ---- colisiones: cajas alineadas a los ejes en una rejilla ----
  const CELL = 24, OFF = 200, grid = new Map(), colliders = [];
  function addCol(b) {
    colliders.push(b);
    for (let i = Math.floor((b[0] + OFF) / CELL); i <= Math.floor((b[2] + OFF) / CELL); i++)
      for (let j = Math.floor((b[1] + OFF) / CELL); j <= Math.floor((b[3] + OFF) / CELL); j++) {
        const k = i * 2048 + j; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(b);
      }
  }
  function collide(x, z, r) {
    for (let it = 0; it < 2; it++) {
      const i = Math.floor((x + OFF) / CELL), j = Math.floor((z + OFF) / CELL);
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        const l = grid.get((i + di) * 2048 + j + dj); if (!l) continue;
        for (const b of l) {
          const cx = Math.max(b[0], Math.min(x, b[2])), cz = Math.max(b[1], Math.min(z, b[3]));
          const dx = x - cx, dz = z - cz, d2 = dx * dx + dz * dz;
          if (d2 >= r * r) continue;
          if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (r - d) / d; x += dx * k; z += dz * k; }
          else {
            const ex = Math.min(x - b[0], b[2] - x), ez = Math.min(z - b[1], b[3] - z);
            if (ex < ez) x += (x - b[0] < b[2] - x ? -ex - r : ex + r); else z += (z - b[1] < b[3] - z ? -ez - r : ez + r);
          }
        }
      }
    }
    return [x, z];
  }
  // ---- niveles: cada rasgo es un rectángulo con altura (plataforma 'b', escalera 's', rampa 'r'); el suelo es la mayor altura que cubre el punto ----
  const FT = [];
  function heightAt(x, z) {
    let h = 0;
    for (let i = 0; i < FT.length; i++) {
      const q = FT[i];
      if (x < q.x0 || x > q.x1 || z < q.z0 || z > q.z1) continue;
      let v = q.h;
      if (q.t !== 'b') {
        const u = q.axis === 'x' ? (x - q.x0) / (q.x1 - q.x0) : (z - q.z0) / (q.z1 - q.z0);
        v = q.t === 'r' ? q.h0 + u * (q.h1 - q.h0) : q.h0 + Math.ceil(Math.max(u, 1e-6) * q.n) * (q.h1 - q.h0) / q.n;
      }
      if (v > h) h = v;
    }
    return h;
  }
  function plat(sec, x0, z0, x1, z1, h) { FT.push({ t: 'b', x0: x0, z0: z0, x1: x1, z1: z1, h: h }); sectors[sec].d.parts.push([(x0 + x1) / 2, h / 2, (z0 + z1) / 2, x1 - x0, h, z1 - z0]); }
  function stair(sec, axis, x0, z0, x1, z1, h0, h1) {          // escalones de ~0.48 m; h0 en el inicio del eje y h1 al final
    const n = Math.max(1, Math.round(Math.abs(h1 - h0) / 0.48)), d = sectors[sec].d;
    FT.push({ t: 's', axis: axis, x0: x0, z0: z0, x1: x1, z1: z1, h0: h0, h1: h1, n: n });
    for (let k = 1; k <= n; k++) {
      const top = h0 + k * (h1 - h0) / n; if (top < 0.05) continue;
      if (axis === 'x') { const sx = (x1 - x0) / n; d.parts.push([x0 + (k - 0.5) * sx, top / 2, (z0 + z1) / 2, sx, top, z1 - z0]); }
      else { const sz = (z1 - z0) / n; d.parts.push([(x0 + x1) / 2, top / 2, z0 + (k - 0.5) * sz, x1 - x0, top, sz]); }
    }
  }
  function ramp(sec, axis, x0, z0, x1, z1, h0, h1) {           // rampa lisa (cuña) entre dos alturas
    FT.push({ t: 'r', axis: axis, x0: x0, z0: z0, x1: x1, z1: z1, h0: h0, h1: h1 });
    const up = h1 >= h0, rot = axis === 'x' ? (up ? 0 : Math.PI) : (up ? -Math.PI / 2 : Math.PI / 2);
    sectors[sec].d.wedges.push([(x0 + x1) / 2, Math.min(h0, h1), (z0 + z1) / 2, axis === 'x' ? x1 - x0 : z1 - z0, Math.abs(h1 - h0), axis === 'x' ? z1 - z0 : x1 - x0, rot]);
  }
  function dais(sec, cx, cz, w2, d2, top, base) {              // plataforma con escaleras por los cuatro lados
    const n = Math.max(1, Math.round(Math.abs(top - base) / 0.48)), L = n * 1.4, x0 = cx - w2 / 2, x1 = cx + w2 / 2, z0 = cz - d2 / 2, z1 = cz + d2 / 2;
    plat(sec, x0, z0, x1, z1, top);
    stair(sec, 'z', x0, z0 - L, x1, z0, base, top); stair(sec, 'z', x0, z1, x1, z1 + L, top, base);
    stair(sec, 'x', x0 - L, z0, x0, z1, base, top); stair(sec, 'x', x1, z0, x1 + L, z1, top, base);
  }
  function gallery(sec, x0, z0, x1, z1, top, base, along, inner) {   // pasarela elevada con parapeto y escalera en un extremo
    const n = Math.max(1, Math.round((top - base) / 0.48)), L = n * 1.4;
    if (along === 'x') { stair(sec, 'x', x0, z0, x0 + L, z1, base, top); plat(sec, x0 + L, z0, x1, z1, top); x0 += L; }
    else { stair(sec, 'z', x0, z0, x1, z0 + L, base, top); plat(sec, x0, z0 + L, x1, z1, top); z0 += L; }
    const e = inner === 'z0' ? [x0, z0, x1, z0 + 0.8] : inner === 'z1' ? [x0, z1 - 0.8, x1, z1] : inner === 'x0' ? [x0, z0, x0 + 0.8, z1] : [x1 - 0.8, z0, x1, z1];
    sectors[sec].d.parts.push([(e[0] + e[2]) / 2, top + 0.55, (e[1] + e[3]) / 2, e[2] - e[0], 1.1, e[3] - e[1]]); addCol(e);
  }
  const hit = (x, z, r) => { const p = collide(x, z, r); return Math.abs(p[0] - x) + Math.abs(p[1] - z) > 1e-6; };

  // ---- piezas: muros claros (bloques de altura irregular), dinteles, columnas con diseño ----
  function wall(axis, fixed, s0, s1, sec, tall, F) {
    F = F || 0;
    const n = Math.max(1, Math.round((s1 - s0) / 4)), len = (s1 - s0) / n, d = sectors[sec].d.blocks;
    for (let i = 0; i < n; i++) {
      const h = (tall === false || rnd() < 0.16 ? rr(2.5, 5) : rr(H - 0.6, H + 0.4)) + F, m = s0 + (i + 0.5) * len;   // los muros arrancan en el suelo y suben hasta el piso + altura
      d.push(axis === 'x' ? [m, h / 2, fixed, len + 0.05, h, T] : [fixed, h / 2, m, T, h, len + 0.05]);
    }
    addCol(axis === 'x' ? [s0, fixed - T / 2, s1, fixed + T / 2] : [fixed - T / 2, s0, fixed + T / 2, s1]);
  }
  function run(axis, fixed, a, b, gaps, sec, F) {                  // muro con huecos de puerta + arco sobre cada hueco
    const gs = gaps.slice().sort((p, q) => p[0] - q[0]); let cur = a;
    for (const g of gs) { if (g[0] > cur) wall(axis, fixed, cur, g[0], sec, true, F); cur = Math.max(cur, g[1]); }
    if (cur < b) wall(axis, fixed, cur, b, sec, true, F);
    for (const g of gs) { const m = (g[0] + g[1]) / 2; sectors[sec].d.arches.push(axis === 'x' ? [m, fixed, 0, F || 0] : [fixed, m, Math.PI / 2, F || 0]); }
  }
  function column(x, z, kind, sec) {
    const d = sectors[sec].d, y = heightAt(x, z);
    if (kind === 'fallen') { d.shafts.push([x, y + 0.8, z, 1.6, rr(5, 9), 1.6, rnd() * 3.14, Math.PI / 2]); return; }
    (kind === 'full' ? d.cols : d.colsB).push([x, z, rnd() * 6.28, y]);
    addCol([x - 1, z - 1, x + 1, z + 1]);
  }

  // ---- construcción: pasillos (puertas en las salas) y perímetro de cada sala ----
  C.forEach((c, i) => {                                           // pasillos: escalera central si unen salas de distinto nivel
    const g = [c.k - W / 2, c.k + W / 2], id = 10 + i, fl = Z[c.lo].f, fh = Z[c.hi].f, F = Math.max(fl, fh), zx = c.axis === 'z';
    if (zx) { Z[c.lo].gN.push(g); Z[c.hi].gS.push(g); wall('z', c.k - W / 2, c.a, c.b, id, true, F); wall('z', c.k + W / 2, c.a, c.b, id, true, F); }
    else { Z[c.lo].gE.push(g); Z[c.hi].gW.push(g); wall('x', c.k - W / 2, c.a, c.b, id, true, F); wall('x', c.k + W / 2, c.a, c.b, id, true, F); }
    const seg = (s0, s1, h) => {
      const r = zx ? [c.k - W / 2, s0, c.k + W / 2, s1] : [s0, c.k - W / 2, s1, c.k + W / 2];
      if (h > 0) FT.push({ t: 'b', x0: r[0], z0: r[1], x1: r[2], z1: r[3], h: h });
      sectors[id].d.planes.push([r[0], r[1], r[2], r[3], h]);
    };
    if (fl === fh) seg(c.a, c.b, fl);
    else {
      const n = Math.max(1, Math.round(Math.abs(fh - fl) / 0.48)), L = n * 1.4, m = (c.a + c.b) / 2;
      seg(c.a, m - L / 2, fl); seg(m + L / 2, c.b, fh);
      if (zx) stair(id, 'z', c.k - W / 2, m - L / 2, c.k + W / 2, m + L / 2, fl, fh); else stair(id, 'x', m - L / 2, c.k - W / 2, m + L / 2, c.k + W / 2, fl, fh);
    }
  });
  Z.forEach((z, i) => {                                           // salas: piso elevado + muros desde el suelo
    if (z.kind === 'abierta') return;
    if (z.f > 0) FT.push({ t: 'b', x0: z.x0, z0: z.z0, x1: z.x1, z1: z.z1, h: z.f });
    sectors[i].d.planes.push([z.x0, z.z0, z.x1, z.z1, z.f]);
    run('x', z.z0, z.x0 - T / 2, z.x1 + T / 2, z.gS, i, z.f); run('x', z.z1, z.x0 - T / 2, z.x1 + T / 2, z.gN, i, z.f);
    run('z', z.x0, z.z0 + T / 2, z.z1 - T / 2, z.gW, i, z.f); run('z', z.x1, z.z0 + T / 2, z.z1 - T / 2, z.gE, i, z.f);
  });

  // ---- decoración y desniveles por tipo de sala ----
  function decorate(i) {
    const z = Z[i], d = sectors[i].d, f = z.f, w = z.x1 - z.x0, dp = z.z1 - z.z0, cx = (z.x0 + z.x1) / 2, cz = (z.z0 + z.z1) / 2, ax = w >= dp;
    const R = Math.min(w, dp) * 0.36;
    const flat = (x, zz) => [[0, 0], [3, 3], [-3, 3], [3, -3], [-3, -3]].every(o => Math.abs(heightAt(x + o[0], zz + o[1]) - f) < 0.01);
    const free = (x, zz) => Math.abs(x - cx) > 18 && Math.abs(zz - cz) > 18 && flat(x, zz);
    const scatter = (n, kind) => { for (let t = 0, k = 0; k < n && t < 300; t++) { const x = rr(z.x0 + 25, z.x1 - 25), zz = rr(z.z0 + 25, z.z1 - 25); if (free(x, zz)) { column(x, zz, kind, i); k++; } } };
    const chunks = n => { for (let t = 0, k = 0; k < n && t < 400; t++) {
      const x = rr(z.x0 + 25, z.x1 - 25), zz = rr(z.z0 + 25, z.z1 - 25), len = rr(8, 22), hz = rnd() < 0.5, ex = hz ? x + len : x, ez = hz ? zz : zz + len;
      if (free(x, zz) && free(ex, ez) && (z.kind !== 'abierta' || !((x < z.x0 + 60 && Math.abs(zz - cz) < 14) || (Math.abs(x - 365 * S) < 14 && zz > z.z1 - 60)))) {
        if (hz) wall('x', zz, x, ex, i, false, f); else wall('z', x, zz, ez, i, false, f); k++; } } };
    const ring = n => { for (let k = 0; k < n; k++) column(cx + R * Math.cos(k / n * 6.283), cz + R * Math.sin(k / n * 6.283), 'full', i); };
    if (z.kind === 'columnas') {
      if (i === 1) gallery(i, z.x0 + 1.2, z.z1 - 19.2, z.x1 - 1.2, z.z1 - 1.2, f + 3.2, f, 'x', 'z0');       // galería elevada junto al muro norte
      else gallery(i, z.x1 - 19.2, z.z0 + 20, z.x1 - 1.2, z.z1 - 20, f + 3.2, f, 'z', 'x0');               // galería junto al muro este
      for (const fr of [0.28, 0.72]) for (let p = 14; p < (ax ? w : dp) - 10; p += 16)
        column(ax ? z.x0 + p : z.x0 + w * fr, ax ? z.z0 + dp * fr : z.z0 + p, rnd() < 0.15 ? 'broken' : 'full', i);
    } else if (z.kind === 'patio') {
      dais(i, cx, cz, i === 0 ? 60 : 44, i === 0 ? 50 : 44, f + 1.2, f);
      [[16, 16], [w - 16, 16], [16, dp - 16], [w - 16, dp - 16]].forEach(a => column(z.x0 + a[0], z.z0 + a[1], 'full', i));
      scatter(3, 'fallen'); scatter(2, 'broken');
    } else if (z.kind === 'ruinas') {
      plat(i, cx - 80, cz - 70, cx - 40, cz - 35, f + 1.4); stair(i, 'x', cx - 40, cz - 70, cx - 40 + 4.2, cz - 35, f + 1.4, f);
      plat(i, cx + 45, cz + 40, cx + 85, cz + 75, f + 1.9); ramp(i, 'x', cx + 85, cz + 40, cx + 99, cz + 75, f + 1.9, f);
      chunks(8); scatter(8, 'broken'); scatter(4, 'fallen');
    } else if (z.kind === 'plaza') {
      dais(i, cx, cz, 22, 22, f + 2.4, f); d.spires.push([cx, cz, f + 2.4]); addCol([cx - 2, cz - 2, cx + 2, cz + 2]);
      ring(8); scatter(4, 'fallen'); d.pads.push([cx, cz, R * 0.6, f]);
    } else if (z.kind === 'cripta') {
      for (let x = z.x0 + 20; x < z.x1 - 20; x += 22) for (let zz = z.z0 + 20; zz < z.z1 - 20; zz += 22) if (Math.abs(zz - cz) > 10) column(x, zz, 'full', i);
    } else if (z.kind === 'trono') {
      const dz0 = z.z1 - 21, dz1 = z.z1 - 7;
      plat(i, cx - 17, dz0, cx + 17, dz1, f + 1.2); stair(i, 'z', cx - 17, dz0 - 4.2, cx + 17, dz0, f, f + 1.2);
      d.parts.push([cx, f + 3.2, z.z1 - 17, 4, 4, 3], [cx, f + 5.5, z.z1 - 18.2, 5, 7, 1]); addCol([cx - 2.5, z.z1 - 19, cx + 2.5, z.z1 - 15]);
      for (let p = 14; p < dp - 20; p += 16) { column(z.x0 + 16, z.z0 + p, 'full', i); column(z.x1 - 16, z.z0 + p, 'full', i); }
    } else if (z.kind === 'jefe') {
      const top = f + 1.5, x0 = cx - 30, x1 = cx + 30, z0 = cz - 25, z1 = cz + 25;
      plat(i, x0, z0, x1, z1, top);
      stair(i, 'z', x0, z0 - 4.2, x1, z0, f, top); stair(i, 'z', x0, z1, x1, z1 + 4.2, top, f);

    map.corridors.forEach((c, i) => { mm.fillStyle = visited.has(10 + i) ? '#9a8f78' : '#4a443a';
      if (c.axis === 'z') mm.fillRect((c.k - 7) * sc, 200 - c.b * sc, 14 * sc, (c.b - c.a) * sc); else mm.fillRect(c.a * sc, 200 - (c.k + 7) * sc, (c.b - c.a) * sc, 14 * sc); });
    map.zones.forEach((z, i) => { mm.fillStyle = visited.has(i) ? '#cdbf9f' : '#5a5346'; mm.fillRect(z.x0 * sc, 200 - z.z1 * sc, (z.x1 - z.x0) * sc, (z.z1 - z.z0) * sc); });
    map.spawns.forEach(s => { if (visited.has(s.zone)) { mm.fillStyle = tc[s.tier]; mm.fillRect(s.x * sc - 1, 200 - s.z * sc - 1, 2.5, 2.5); } });
    mm.fillStyle = '#ff5533'; mm.beginPath(); mm.arc(p.x * sc, 200 - p.z * sc, 3.5, 0, 6.283); mm.fill();
    mm.strokeStyle = '#ff5533'; mm.beginPath(); mm.moveTo(p.x * sc, 200 - p.z * sc); mm.lineTo(p.x * sc - Math.sin(yaw) * 10, 200 - p.z * sc + Math.cos(yaw) * 10); mm.stroke();
  }

  const clock = new THREE.Clock(); let frames = 0, acc = 0, n = 0, fps = 0;
  (function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1), sp = (keys.ShiftLeft || keys.ShiftRight ? 12 : 6) * dt;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    let mx = 0, mz = 0;
    if (keys.KeyW) { mx += fx; mz += fz; } if (keys.KeyS) { mx -= fx; mz -= fz; }
    if (keys.KeyD) { mx -= fz; mz += fx; } if (keys.KeyA) { mx += fz; mz -= fx; }
    const ml = Math.hypot(mx, mz) || 1, g0 = map.heightAt(p.x, p.z);
    let q = map.collide(p.x + mx / ml * sp, p.z + mz / ml * sp, 1.0);
    if (map.heightAt(q[0], q[1]) - g0 > 0.6) {                      // escalón demasiado alto: se bloquea (o se desliza por el borde)
      const a1 = map.collide(q[0], p.z, 1.0), a2 = map.collide(p.x, q[1], 1.0);
      q = map.heightAt(a1[0], a1[1]) - g0 <= 0.6 ? a1 : map.heightAt(a2[0], a2[1]) - g0 <= 0.6 ? a2 : [p.x, p.z];
    }
    p.x = Math.max(5, Math.min(map.size - 5, q[0])); p.z = Math.max(5, Math.min(map.size - 5, q[1]));
    const g = map.heightAt(p.x, p.z);                                 // subir escalones y rampas / caer de una plataforma
    if (g >= p.y - 0.02) { p.y = Math.min(g, p.y + 9 * dt); vy = 0; } else { vy -= 25 * dt; p.y = Math.max(g, p.y + vy * dt); if (p.y === g) vy = 0; }
    const s = map.sectorAt(p.x, p.z), eff = s >= 0 ? s : map.nearest(p.x, p.z);   // fuera de los muros: se usa la sala más cercana
    if (eff !== cur) { cur = eff; if (s >= 0) visited.add(s); setV(eff); }
    if (frames === 0) setV(cur);
    const sec = map.sectors[cur], a = map.ATM[sec.kind] || map.ATM.pasillo;     // atmósfera propia de cada sector
    tgt.set(a[0]); col.lerp(tgt, Math.min(1, dt * 1.5)); fog.color.copy(col); scene.background.copy(col); fog.density += (a[1] - fog.density) * Math.min(1, dt * 1.5);
    const k = Math.min(1, dt * 1.5), tt = clock.elapsedTime;
    hemi.intensity += (a[3] - hemi.intensity) * k; sun.intensity += (a[2] - sun.intensity) * k;       // luz según el sector
    const near = [];
    map.torches.forEach(q => { if (visSet.has(q.sec)) { const dx = q.x - p.x, dz = q.z - p.z; near.push([dx * dx + dz * dz, q]); } });
    near.sort((u, v) => u[0] - v[0]);
    pool.forEach((l, i) => {
      const q = near[i];
      if (!q || q[0] > 3600) { l.intensity = 0; return; }
      l.position.set(q[1].x, q[1].y, q[1].z); l.intensity = 1.5 + 0.35 * Math.sin(tt * 9 + i * 3) + 0.2 * Math.sin(tt * 23 + i);   // parpadeo
    });
    dust.position.set(p.x, p.y, p.z);
    for (let i = 0; i < NP; i++) { const j = i * 3 + 1; dpos[j] += dt * 0.25; if (dpos[j] > 14) dpos[j] = 0; }
    dg.attributes.position.needsUpdate = true;
    player.position.set(p.x, p.y + 0.9, p.z);
    const cxp = p.x + Math.sin(yaw) * Math.cos(pitch) * dist, czp = p.z + Math.cos(yaw) * Math.cos(pitch) * dist;
    camY += (p.y + 1.6 + Math.sin(pitch) * dist - camY) * Math.min(1, dt * 6);
    camera.position.set(cxp, Math.max(camY, map.heightAt(cxp, czp) + 0.8), czp);
    camera.lookAt(p.x, p.y + 1.6, p.z);
    renderer.render(scene, camera);
    frames++; acc += dt; n++;
    if (frames === 3) D('OK', 'Dibujando: ' + renderer.info.render.calls + ' llamadas, ' + renderer.info.render.triangles + ' triángulos, ' + vis + ' sectores visibles.');
    if (acc > 0.5) { fps = Math.round(n / acc); acc = 0; n = 0;
      $('hud').innerHTML = '<b>' + sec.name + '</b><br>Sectores visibles ' + vis + '/' + map.sectors.length + ' · FPS ' + fps + ' · altura ' + p.y.toFixed(1) + ' m · explorado ' + visited.size + '/' + map.sectors.length +
        '<br>WASD mover · Shift correr · arrastra para girar · rueda zoom<br>Teclas 1–9 y 0: saltar a cada sala · Q: sombras' +
        '<br>Recorrido completo ≈ ' + (map.routes.full / 1000).toFixed(1) + ' km'; }
    drawMap();
  })();
}
(async function () {
  if (!window.THREE) { DIAG.add('INFO', 'Cargando three.js desde jsDelivr…'); await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'); }
  if (!window.THREE) { DIAG.add('INFO', 'Probando cdnjs…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'); }
  if (!window.THREE) { DIAG.add('ERROR', 'No se pudo cargar three.js. Abre el archivo descargado en Chrome o Edge con internet (la vista previa de un chat suele bloquear estos dominios).'); document.getElementById('hud').textContent = 'No cargó three.js. Mira el diagnóstico.'; return; }
  DIAG.add('OK', 'three.js r' + THREE.REVISION);
  try { startViewer(); } catch (e) { DIAG.add('ERROR', 'Fallo al iniciar: ' + e.message); }
})();
</script>
