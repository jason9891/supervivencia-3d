<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';



/* ================= utilidades ================= */
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const vnoise = (r, n) => { const a = Array.from({ length: n }, () => r()); return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return a[((i % n) + n) % n] * (1 - u) + a[(((i + 1) % n) + n) % n] * u; }; };
const mixc = (a, b, k) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';
function canvasTex(S, draw) {
  const c = document.createElement('canvas'); c.width = S; c.height = S; draw(c.getContext('2d'), S);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const TC = {};

/* UV en metros para cajas */
function uvm(geo) {
  const p = geo.parameters; if (!p || p.width === undefined || p.depth === undefined) return;
  const S = [[p.depth, p.height], [p.depth, p.height], [p.width, p.depth], [p.width, p.depth], [p.width, p.height], [p.width, p.height]], uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * S[f][0], uv.getY(k) * S[f][1]); }
  uv.needsUpdate = true;
}

/* ================= texturas por código ================= */
const PALETAS = [
  { n: 'Roble oscuro', dark: [66, 43, 24], light: [112, 78, 45], vein: '28,16,8' },
  { n: 'Pino claro', dark: [134, 101, 62], light: [176, 139, 92], vein: '72,48,22' },
  { n: 'Madera vieja gris', dark: [80, 74, 66], light: [126, 118, 106], vein: '38,34,30' }];
const PAL = PALETAS;
let V = 0;
function setVariante(i) { V = ((i % PAL.length) + PAL.length) % PAL.length; return PAL[V].n; }
const getVariante = () => V;

function woodTex(v, rx, ry) {
  const key = 'w' + v + '_' + rx + '_' + ry; if (TC[key]) return TC[key]; const P = PAL[v];
  const t = canvasTex(256, (g, S) => {
    const r = rng(11 + v), n1 = vnoise(r, 32), n2 = vnoise(r, 64);
    for (let x = 0; x < S; x++) { const k = n1(x * .09) * .6 + n2(x * .4) * .4; g.fillStyle = mixc(P.dark, P.light, k); g.fillRect(x, 0, 1, S); }
    g.lineWidth = 1;
    for (let i = 0; i < 70; i++) {
      const x0 = r() * S, amp = 1 + r() * 3, f = .02 + r() * .04, ph = r() * 6.3; g.strokeStyle = 'rgba(' + P.vein + ',' + (.1 + r() * .25) + ')';
      for (const o of [-S, 0, S]) { g.beginPath(); for (let y = 0; y <= S; y += 8) { const x = x0 + o + Math.sin(y * f + ph) * amp; if (y) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke(); }
    }
    for (let i = 0; i < 3; i++) {
      const x = r() * S, y = r() * S, gr = g.createRadialGradient(x, y, 1, x, y, 10 + r() * 8); gr.addColorStop(0, 'rgba(' + P.vein + ',.55)'); gr.addColorStop(1, 'rgba(' + P.vein + ',0)');
      g.save(); g.translate(x, y); g.scale(.55, 1.5); g.translate(-x, -y); g.fillStyle = gr; g.fillRect(x - 30, y - 30, 60, 60); g.restore();
    }
  });
  t.repeat.set(rx, ry); return TC[key] = t;
}
function ironTex() {
  if (TC.iron) return TC.iron;
  return TC.iron = canvasTex(256, (g, S) => {
    const r = rng(5); g.fillStyle = '#3c3c40'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 5000; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '0,0,0' : '120,120,125') + ',' + r() * .18 + ')'; g.fillRect(r() * S, r() * S, 1 + r() * 2, 1 + r() * 2); }
    for (let i = 0; i < 9; i++) { const x = r() * S, y = r() * S, R = 14 + r() * 26, gr = g.createRadialGradient(x, y, 1, x, y, R); gr.addColorStop(0, 'rgba(120,62,28,.55)'); gr.addColorStop(1, 'rgba(120,62,28,0)'); g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2); }
  });
}
function clothTex() {
  if (TC.cloth) return TC.cloth;
  return TC.cloth = canvasTex(256, (g, S) => {
    const r = rng(9); g.fillStyle = '#9a8a6a'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < S; i += 3) { g.fillStyle = 'rgba(40,28,14,' + (.1 + r() * .18) + ')'; g.fillRect(0, i, S, 1); g.fillStyle = 'rgba(255,240,200,' + (.04 + r() * .1) + ')'; g.fillRect(i, 0, 1, S); }
    for (let i = 0; i < 1200; i++) { g.fillStyle = 'rgba(30,20,10,' + r() * .2 + ')'; g.fillRect(r() * S, r() * S, 2, 1); }
  });
}
function stoneTex() {
  if (TC.stone) return TC.stone;
  return TC.stone = canvasTex(256, (g, S) => {
    const r = rng(3); g.fillStyle = '#6a6864'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 7000; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '0,0,0' : '200,200,195') + ',' + r() * .14 + ')'; const s = 1 + r() * 3; g.fillRect(r() * S, r() * S, s, s); }
    g.strokeStyle = 'rgba(20,18,16,.45)'; g.lineWidth = 1;
    for (let i = 0; i < 4; i++) { let x = r() * S, y = r() * S; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 9; k++) { x += (r() - .5) * 28; y += (r() - .2) * 22; g.lineTo(x, y); } g.stroke(); }
  });
}
function llamaTex() {
  if (TC.llama) return TC.llama;
  return TC.llama = canvasTex(128, g => {
    const gota = (s, col) => {
      g.save(); g.translate(64, 170); g.scale(s, s); g.translate(-64, -170); g.beginPath(); g.moveTo(64, 6);
      g.bezierCurveTo(78, 70, 118, 120, 118, 170); g.bezierCurveTo(118, 225, 92, 250, 64, 250); g.bezierCurveTo(36, 250, 10, 225, 10, 170); g.bezierCurveTo(10, 120, 50, 70, 64, 6);
      g.closePath(); g.fillStyle = col; g.fill(); g.restore();
    };
    g.canvas.height = 256; g.clearRect(0, 0, 128, 256);
    [[1, 'rgba(255,90,10,.16)'], [.88, 'rgba(255,110,20,.22)'], [.74, 'rgba(255,150,40,.3)'], [.58, 'rgba(255,200,90,.4)'], [.4, 'rgba(255,235,170,.6)'], [.22, 'rgba(255,255,235,.85)']].forEach(a => gota(a[0], a[1]));
  });
}
const FL = () => { const t = llamaTex(); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t; };

/* ================= materiales y piezas ================= */
const M = o => new THREE.MeshStandardMaterial(o);
const W = (rx = 1.25, ry = 1.25) => M({ map: woodTex(V, rx, ry), roughness: .88 });
const FE = () => M({ map: ironTex(), roughness: .55, metalness: .35, side: THREE.DoubleSide });
const TE = (c = 0xffffff) => M({ map: clothTex(), color: c, roughness: 1 });
const PI = () => M({ map: stoneTex(), roughness: .95 });
function box(w, h, d, x, y, z, mat, par) { const g = new THREE.BoxGeometry(w, h, d); uvm(g); const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); par.add(m); return m; }
function cil(rt, rb, h, x, y, z, mat, par, seg = 14) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); par.add(m); return m; }
function lathe(pts, mat, par, seg = 24) { const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg), mat); par.add(m); return m; }
function toro(R, r, x, y, z, mat, par, rx = Math.PI / 2) { const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, 8, 24), mat); m.position.set(x, y, z); m.rotation.x = rx; par.add(m); return m; }
function materialPiedra() { return PI(); }

/* ================= fuego: llama en capas + chispas ================= */
function mkFuego(esc, brasas) {
  const g = new THREE.Group(), sp = [];
  [[.20, .42, 0xff6a10, .85], [.14, .34, 0xffa63a, .9], [.07, .2, 0xfff0b8, 1]].forEach(([w, h, c, o], i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: FL(), color: c, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: o }));
    s.center.set(.5, .08); s.userData = { w: w * esc, h: h * esc, ph: i * 2.1 }; s.scale.set(w * esc, h * esc, 1); g.add(s); sp.push(s);
  });
  const N = brasas || 0; let pts = null, pos = null; const fase = [];
  if (N) {
    pos = new Float32Array(N * 3); const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffa040, size: .02 * Math.max(1, esc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    pts.frustumCulled = false; g.add(pts); for (let i = 0; i < N; i++) fase.push(Math.random());
  }
  const upd = t => {
    sp.forEach(s => { const u = s.userData, f = Math.sin(t * 13 + u.ph) * .5 + Math.sin(t * 23 + u.ph * 1.7) * .5; s.scale.set(u.w * (1 + .07 * f), u.h * (1 + .16 * f + .06 * Math.sin(t * 5 + u.ph)), 1); s.material.rotation = .09 * Math.sin(t * 6.5 + u.ph); });
    if (pts) { for (let i = 0; i < N; i++) { const l = (t * .45 + fase[i]) % 1; pos[i * 3] = Math.sin(t * 2.7 + i * 1.9) * .05 * l * esc; pos[i * 3 + 1] = .05 * esc + l * .7 * esc; pos[i * 3 + 2] = Math.cos(t * 2.3 + i * 1.3) * .05 * l * esc; } pts.geometry.attributes.position.needsUpdate = true; }
  };
  return { g, upd };
}

/* ================= OBJETOS ================= */
function buildTorch() {
  const root = new THREE.Group(), h = new THREE.Group(); root.add(h);
  const mw = W(1, 3), fe = FE();
  lathe([[.026, 0], [.03, .1], [.035, .3], [.04, .38], [.049, .42], [.04, .46], [.044, .6], [.047, .8], [.05, .9]], mw, h, 16);
  lathe([[.05, .84], [.058, .88], [.07, .95], [.082, 1.0], [.078, 1.0], [.066, .95], [.05, .9]], fe, h, 20);
  toro(.07, .007, 0, .93, 0, fe, h);
  for (let i = 0; i < 5; i++) { const ga = new THREE.Group(); ga.rotation.y = i / 5 * Math.PI * 2; h.add(ga); const p = box(.014, .2, .01, .082, 1.08, 0, fe, ga); p.rotation.z = -.22; }
  const tela = TE(0x5e4c3a);
  lathe([[.0, .96], [.06, .97], [.078, 1.02], [.095, 1.1], [.092, 1.17], [.074, 1.23], [.04, 1.26], [0, 1.268]], tela, h, 20);
  [[.08, 1.03], [.094, 1.1], [.088, 1.16], [.062, 1.22]].forEach(a => toro(a[0] + .004, .006, 0, a[1], 0, M({ color: 0xb39d73, roughness: 1 }), h));
  const c = new THREE.Mesh(new THREE.CircleGeometry(.045, 14), M({ color: 0x14100c, emissive: 0xff4a00, emissiveIntensity: .8, roughness: 1 })); c.rotation.x = -Math.PI / 2; c.position.y = 1.262; h.add(c);
  const f = mkFuego(1, 14); f.g.position.y = 1.24; h.add(f.g);
  const anchor = new THREE.Object3D(); anchor.position.y = 1.32; h.add(anchor);
  return { root, anim: f.upd, anchor };
}

function buildWallTorch(p) {
  const root = new THREE.Group(), fe = FE();
  if (p.bloque) box(.9, 1.5, .26, 0, .75, -.13, PI(), root);
  box(.14, .24, .02, 0, .74, .01, fe, root);
  [[-.04, .82], [.04, .82], [-.04, .66], [.04, .66]].forEach(q => { const r = new THREE.Mesh(new THREE.SphereGeometry(.012, 8, 6), fe); r.position.set(q[0], q[1], .03); root.add(r); });
  box(.03, .03, .34, 0, .74, .18, fe, root);
  const piv = new THREE.Group(); piv.position.set(0, .74, .36); piv.rotation.x = .3; root.add(piv);
  toro(.058, .011, 0, 0, 0, fe, piv);
  const t = buildTorch(); t.root.position.set(0, -.5, 0); piv.add(t.root);
  box(.03, .03, .2, 0, .4, .1, fe, root);
  return { root, anim: t.anim, anchor: t.anchor };
}

function buildCandle(esc = 1, par) {
  const g = par || new THREE.Group(), cera = M({ color: 0xe8dcbc, roughness: .55 });
  lathe([[0, 0], [.021, 0], [.022, .03], [.019, .15], [.015, .17], [.004, .172]].map(q => [q[0] * esc, q[1] * esc]), cera, g, 14);
  const d = new THREE.Mesh(new THREE.SphereGeometry(.007 * esc, 8, 6), cera); d.scale.set(1, 2.6, 1); d.position.set(.019 * esc, .12 * esc, 0); g.add(d);
  cil(.0015 * esc, .0015 * esc, .02 * esc, 0, .182 * esc, 0, M({ color: 0x1a1410 }), g, 5);
  const f = mkFuego(.16 * esc, 0); f.g.position.y = .186 * esc; g.add(f.g);
  const a = new THREE.Object3D(); a.position.y = .22 * esc; g.add(a);
  return { root: g, anim: f.upd, anchor: a };
}
function buildVela(p) { const b = new THREE.Group(), c = buildCandle(p.esc); b.add(c.root); return { root: b, anim: c.anim, anchor: c.anchor }; }

function buildCandelabro() {
  const root = new THREE.Group(), fe = FE(), an = [];
  lathe([[0, 0], [.12, 0], [.13, .02], [.07, .06], [.035, .12], [.03, .4], [.045, .43], [.03, .46], [.028, .6]], fe, root, 20);
  const ux = [-.26, 0, .26], uy = [.78, .86, .78];
  ux.forEach((x, i) => {
    const cur = new THREE.CatmullRomCurve3([new THREE.Vector3(0, .55, 0), new THREE.Vector3(x * .45, .5, 0), new THREE.Vector3(x, .58, 0), new THREE.Vector3(x, uy[i] - .1, 0)]);
    root.add(new THREE.Mesh(new THREE.TubeGeometry(cur, 16, .011, 6, false), fe));
    lathe([[.0, uy[i] - .1], [.03, uy[i] - .1], [.036, uy[i] - .07], [.03, uy[i] - .07]], fe, root, 12).position.x = x;
    const c = buildCandle(1.3); c.root.position.set(x, uy[i] - .09, 0); root.add(c.root); an.push(c);
  });
  return { root, anim: t => an.forEach((c, i) => c.anim(t + i * .7)), anchor: an[1].anchor };
}

function buildMesa(p) {
  const { w, d, h } = p, root = new THREE.Group(), wd = W();
  const lw = Math.max(.06, Math.min(.1, .05 + .012 * w)), ins = .04, n = Math.max(2, Math.round(d / .2)), pw = d / n;
  for (let i = 0; i < n; i++) { const t = box(w, .05, pw - .004, 0, h - .025 + (i % 2) * .003, -d / 2 + pw * (i + .5), wd, root); t.rotation.y = (i - n / 2) * .002; }
  const lx = w / 2 - ins - lw / 2, lz = d / 2 - ins - lw / 2, lh = h - .05;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(s => box(lw, lh, lw, s[0] * lx, lh / 2, s[1] * lz, wd, root));
  const inX = w - 2 * (ins + lw), inZ = d - 2 * (ins + lw);
  [-1, 1].forEach(s => {
    box(inX, .08, .04, 0, lh - .05, s * lz, wd, root);
    box(.04, .08, inZ, s * lx, lh - .05, 0, wd, root);
    box(inX, .04, .035, 0, Math.min(.25, lh * .3), s * lz, wd, root);
  });
  if (p.vela) {
    const c = buildCandle(1.3); c.root.position.set(w * .2, h, d * .05); root.add(c.root);
    const j = new THREE.Group(); lathe([[0, 0], [.06, 0], [.08, .06], [.07, .16], [.04, .2], [.045, .23], [.04, .23]], M({ color: 0x7a4a2c, roughness: .7, side: THREE.DoubleSide }), j, 16); j.position.set(-w * .25, h, -d * .12); root.add(j);
    return { root, anim: c.anim, anchor: c.anchor };
  }
  return { root, anim: () => { }, anchor: null };
}

function buildSilla(p) {
  const { w, d, h } = p, root = new THREE.Group(), wd = W(), sh = h * .48, hx = w / 2 - .03, hz = d / 2 - .03;
  box(w, .045, d, 0, sh, 0, wd, root);
  [[-1, 1], [1, 1]].forEach(s => box(.04, sh - .02, .04, s[0] * hx, (sh - .02) / 2, hz, wd, root));
  [-1, 1].forEach(s => box(.04, h, .04, s * hx, h / 2, -hz, wd, root));
  box(w, .07, .03, 0, h - .05, -hz, wd, root);
  const hs = h - sh - .17;
  [-.22, .22].forEach(f => box(.05, hs, .02, f * w, sh + .05 + hs / 2, -hz, wd, root));
  [-hz, hz].forEach(z => box(w - .06, .025, .025, 0, sh * .6, z, wd, root));
  box(.025, .025, d - .06, -hx, sh * .6, 0, wd, root); box(.025, .025, d - .06, hx, sh * .6, 0, wd, root);
  return { root, anim: () => { }, anchor: null };
}

function buildBanca(p) {
  const { w, d, h } = p, root = new THREE.Group(), wd = W();
  box(w, .05, d, 0, h - .025, 0, wd, root);
  [-1, 1].forEach(s => { box(.05, h - .05, d, s * (w / 2 - .05), (h - .05) / 2, 0, wd, root); });
  box(w - .15, .04, .05, 0, h * .45, 0, wd, root);
  return { root, anim: () => { }, anchor: null };
}

function buildBarril(p) {
  const { r, h } = p, root = new THREE.Group(), w = W(3, 1), fe = FE(), kx = r / .335, ky = h / .9;
  lathe([[0, 0], [.25, 0], [.29, .15], [.335, .45], [.29, .75], [.25, .9], [0, .9]].map(q => [q[0] * kx, q[1] * ky]), w, root, 24);
  [[.15, .29], [.33, .332], [.6, .332], [.77, .285]].forEach(a => toro(a[1] * kx + .004, .014, 0, a[0] * ky, 0, fe, root));
  const l = new THREE.Mesh(new THREE.CircleGeometry(.245 * kx, 20), W(1, 1)); l.rotation.x = -Math.PI / 2; l.position.y = h; root.add(l);
  return { root, anim: () => { }, anchor: null };
}

function buildCaja(p) {
  const { w, h, d } = p, root = new THREE.Group(), wd = W(), fe = FE();
  box(w - .02, h, d - .02, 0, h / 2, 0, wd, root);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(s => box(.05, h + .02, .05, s[0] * (w / 2 - .025), (h + .02) / 2, s[1] * (d / 2 - .025), wd, root));
  box(w + .02, .04, d + .02, 0, h + .02, 0, wd, root);

function ruido3(x, y, z, ph) {

  Object.assign(ETIQUETAS, { alt: 'Altura de la cumbrera', alero: 'Alero (voladizo)', aguas: 'Aguas (0 dos, 1 una, 2 cuatro)', vigas: 'Vigas y cornisa (0/1)', fronton: 'Frontón (0/1)', proy: 'Saliente', cubierta: 'Cubierta (0 teja, 1 paja, 2 tablillas, 3 pizarra)', molduras: 'Molduras (0 simple, 1 ménsulas)' });
}

registrarPro();registrarLote2();registrarLote3();registrarLote4();registrarLote5();

/* ================= escena ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0a0c);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,200);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const hemi=new THREE.HemisphereLight(0xb8a98f,0x2a2420,.12);scene.add(hemi);
const sol=new THREE.DirectionalLight(0xfff0d8,0);sol.position.set(2,4,3);scene.add(sol);
const luces=[0,1,2,3].map(()=>{const l=new THREE.PointLight(0xff9a40,5,0,2);l.visible=false;scene.add(l);return l});
const ft=stoneTex().clone();ft.needsUpdate=true;ft.repeat.set(5,5);
const suelo=new THREE.Mesh(new THREE.CircleGeometry(4,48),new THREE.MeshStandardMaterial({map:ft,color:0x777777,roughness:1}));
suelo.rotation.x=-Math.PI/2;scene.add(suelo);

/* ================= estado ================= */
const tipos=Object.keys(CATALOGO);
const sel=document.getElementById('sel'),nom=document.getElementById('nom'),panel=document.getElementById('par');
tipos.forEach((k,i)=>{const op=document.createElement('option');op.value=i;op.textContent=CATALOGO[k].nombre;sel.appendChild(op)});
let claro=false,idx=0,cur=null,params={},modoSala=false,semilla=1,sala3d=null,salaGrupo=null;
const tgt=new THREE.Vector3(),vp=new THREE.Vector3();let th=.6,ph=.28,rad=2.2;
const DEMOS=[
 {nombre:'Armería',dia:false,sala:{x0:0,x1:12,z0:0,z1:9,y:0},puertas:[{x:6,z:0,w:2},{x:0,z:4.5,w:2}],pedidos:[
  {tipo:'estante',n:2,modo:'pared',params:{w:[.9,1.5],h:[1.6,2.1]}},
  {tipo:'armas',n:2,modo:'pared',params:{w:[1,1.8]}},
  {tipo:'banca',n:1,modo:'pared',params:{w:[1.2,2],resp:0}},
  {tipo:'antorcha_pared',n:5,modo:'pared'},
  {tipo:'caja',n:3,modo:'esquina',params:{w:[.5,.9],h:[.3,.55],d:[.4,.6]}},
  {tipo:'barril',n:3,modo:'pared',params:{r:[.25,.4],h:[.7,1.1]}},
  {tipo:'mesa',n:1,modo:'centro',sillas:6,params:{w:[2.2,3],d:[.8,1.05]}},
  {tipo:'brasero',n:1,modo:'centro'}]},
 {nombre:'Plaza',dia:true,sala:{x0:0,x1:16,z0:0,z1:11,y:0},puertas:[{x:8,z:0,w:3},{x:0,z:5.5,w:3}],pedidos:[
  {tipo:'puesto',n:3,modo:'pared',params:{w:[2,3],tono:[0,2]}},
  {tipo:'cajon_fruta',n:8,modo:'centro',params:{fruta:[0,3],llenado:[-.35,1]}},
  {tipo:'tinaja',n:3,modo:'pared',params:{tapa:[0,1]}},{tipo:'taburete',n:3,modo:'centro'},{tipo:'quesos',n:2,modo:'centro'},{tipo:'ristra',n:3,modo:'pared',params:{tipo:[0,1]}},{tipo:'balanza',n:2,modo:'centro'},
  {tipo:'canasta',n:4,modo:'centro',params:{llenado:[-.2,1]}},
  {tipo:'saco',n:6,modo:'pared'},
  {tipo:'barril',n:4,modo:'pared',params:{r:[.25,.4],h:[.7,1.1]}},
  {tipo:'carreta',n:2,modo:'centro'},
  {tipo:'banca',n:3,modo:'pared',params:{w:[1.4,2.2],resp:1}},
  {tipo:'mesa',n:1,modo:'centro',sillas:4,params:{w:[1.6,2.2],d:[.8,1]}},
  {tipo:'caja',n:3,modo:'pared'}]},
 {nombre:'Establo',dia:true,techo:{aguas:0,cubierta:0,alt:1.9,alero:.7},sala:{x0:0,x1:12,z0:0,z1:8,y:0},puertas:[{x:6,z:0,w:3}],pedidos:[
  {tipo:'pesebre',n:3,modo:'pared',params:{w:[1.4,2.4]}},
  {tipo:'abrevadero',n:1,modo:'pared'},
  {tipo:'fardo',n:8,modo:'pared'},
  {tipo:'cubo',n:4,modo:'centro'},
  {tipo:'horca',n:3,modo:'pared'},
  {tipo:'poste_amarre',n:2,modo:'centro'},
  {tipo:'barril',n:2,modo:'pared'},
  {tipo:'caja',n:2,modo:'pared'},
  {tipo:'antorcha_pared',n:3,modo:'pared'},
  {tipo:'rastrillo',n:2,modo:'pared'},{tipo:'pala',n:2,modo:'pared'},{tipo:'silla_montar',n:1,modo:'centro'},{tipo:'taburete',n:2,modo:'centro'},{tipo:'lena',n:1,modo:'pared'},{tipo:'tinaja',n:2,modo:'pared'},{tipo:'tocon_hacha',n:1,modo:'centro'},{tipo:'farol',n:2,modo:'centro'}]},
 {nombre:'Ruinas',dia:true,sala:{x0:0,x1:18,z0:0,z1:12,y:0},puertas:[{x:9,z:0,w:3}],pedidos:[
  {tipo:'columna',n:7,modo:'centro',params:{h:[1.5,5],r:[.25,.45],ruina:[0,1],fuste:[0,2]}},

let demoIdx=-1,SALA,PUERTAS,PEDIDOS,techoObj=null,verTecho=true;

function fitCamara(root){const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  tgt.copy(c);rad=Math.max(.9,Math.max(s.x,s.y,s.z)*1.9+.3)}
function construirPanel(){
  panel.innerHTML='';const d=CATALOGO[tipos[idx]];const ks=Object.keys(d.params);panel.style.display=(modoSala||!ks.length)?'none':'grid';
  ks.forEach(k=>{const [a,b,v,st]=d.params[k];const l=document.createElement('label');
    l.innerHTML='<span>'+(ETIQUETAS[k]||k)+'</span><input type="range" min="'+a+'" max="'+b+'" step="'+st+'" value="'+params[k]+'"><b>'+(+params[k]).toFixed(2)+'</b>';
    const inp=l.querySelector('input'),out=l.querySelector('b');
    inp.oninput=()=>{params[k]=+inp.value;out.textContent=(+inp.value).toFixed(2);reconstruir()};panel.appendChild(l)})}
function reconstruir(){if(cur)scene.remove(cur.root);cur=crearObjeto(tipos[idx],params);scene.add(cur.root);
  luces.forEach(l=>l.visible=false);if(cur.anchor)luces[0].visible=true}
function mostrar(i,conservar){
  idx=(i+tipos.length)%tipos.length;modoSala=false;if(salaGrupo){scene.remove(salaGrupo);salaGrupo=null;sala3d=null}
  suelo.visible=true;params=paramsPorDefecto(tipos[idx],tipos[idx]==='antorcha_pared'?{}:{});
  reconstruir();fitCamara(cur.root);ph=.28;sel.value=idx;nom.textContent=CATALOGO[tipos[idx]].nombre;
  document.getElementById('btex').textContent='Madera: '+PALETAS[getVariante()].n;construirPanel()}

function setClaro(v){claro=v;hemi.intensity=claro?1:.12;sol.intensity=claro?1.6:0;document.getElementById('bamb').textContent='Ambiente: '+(claro?'claro':'oscuro')}
function construirSala(){
  const D=DEMOS[demoIdx];SALA=D.sala;PUERTAS=D.puertas;PEDIDOS=D.pedidos;
  if(cur){scene.remove(cur.root);cur=null}if(salaGrupo)scene.remove(salaGrupo);
  modoSala=true;suelo.visible=false;luces.forEach(l=>l.visible=false);
  salaGrupo=new THREE.Group();scene.add(salaGrupo);
  const W=SALA.x1-SALA.x0,Dd=SALA.z1-SALA.z0;
  const bx=(w,h,d,x,y,z,m)=>{const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);me.receiveShadow=true;salaGrupo.add(me)};
  const pared=new THREE.MeshStandardMaterial({map:ft,color:0x8a8478,roughness:1});
  bx(W,.3,Dd,SALA.x0+W/2,0,SALA.z0+Dd/2,new THREE.MeshStandardMaterial({map:ft,color:D.dia?0x8a7a62:0x6a655c,roughness:1}));
  const ah=D.dia?2.6:3.6;
  bx(W+.4,ah,.4,SALA.x0+W/2,ah/2-.15,SALA.z0,pared);bx(W+.4,ah,.4,SALA.x0+W/2,ah/2-.15,SALA.z1,pared);
  bx(.4,ah,Dd,SALA.x0,ah/2-.15,SALA.z0+Dd/2,pared);bx(.4,ah,Dd,SALA.x1,ah/2-.15,SALA.z0+Dd/2,pared);
  PUERTAS.forEach(d=>{const m=new THREE.MeshBasicMaterial({color:0x2a7a4a});const horiz=d.z===SALA.z0||d.z===SALA.z1;
    bx(horiz?d.w:1.8,.02,horiz?1.8:d.w,d.x+(horiz?0:.9),.16,d.z+(horiz?.9:0),m)});
  techoObj=null;if(D.techo){techoObj=crearObjeto('techo',Object.assign({w:W+.4,d:Dd+.4},D.techo));techoObj.root.position.set(SALA.x0+W/2,ah-.15,SALA.z0+Dd/2);techoObj.root.visible=verTecho;salaGrupo.add(techoObj.root)}
  sala3d=poblar(SALA,PEDIDOS,{puertas:PUERTAS,semilla});salaGrupo.add(sala3d.root);
  tgt.set(SALA.x0+W/2,.6,SALA.z0+Dd/2);rad=Math.max(W,Dd)*1.25;ph=.95;
  nom.textContent=D.nombre+' · semilla '+semilla+' · '+sala3d.colocados.length+' objetos';panel.style.display='none';
  setClaro(D.dia)}

/* ================= controles ================= */
sel.onchange=()=>mostrar(+sel.value);
document.getElementById('ant').onclick=()=>mostrar(idx-1);
document.getElementById('sig').onclick=()=>mostrar(idx+1);
document.getElementById('zmas').onclick=()=>rad=Math.max(.5,rad*.8);
document.getElementById('zmen').onclick=()=>rad=Math.min(40,rad*1.25);
document.getElementById('btex').onclick=()=>{setVariante(getVariante()+1);document.getElementById('btex').textContent='Madera: '+PALETAS[getVariante()].n;modoSala?construirSala():reconstruir()};
document.getElementById('bamb').onclick=()=>setClaro(!claro);
document.getElementById('btec').onclick=e=>{verTecho=!verTecho;if(techoObj)techoObj.root.visible=verTecho;e.target.textContent='Techo: '+(verTecho?'SÍ':'NO')};
document.getElementById('bacc').onclick=()=>{if(cur&&cur.alternar)cur.alternar()};
const EXP=[1,.6,1.7,2.8];let ei=0;document.getElementById('bluz').onclick=e=>{ei=(ei+1)%EXP.length;renderer.toneMappingExposure=EXP[ei];e.target.textContent='Luz ×'+EXP[ei]};
const bs=document.getElementById('bsala');
bs.onclick=()=>{demoIdx++;if(demoIdx>=DEMOS.length){demoIdx=-1;mostrar(idx);setClaro(false);bs.textContent='Salas demo'}else{construirSala();bs.textContent=demoIdx+1<DEMOS.length?'Siguiente sala':'Ver objeto'}};
document.getElementById('bsem').onclick=()=>{if(modoSala){semilla++;construirSala()}else{params=paramsPorDefecto(tipos[idx]);reconstruir();construirPanel()}};
const ptr=new Map();let pd=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const a=[...ptr.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===1){th-=(e.clientX-p.x)*.007;ph=Math.max(-.1,Math.min(1.45,ph+(e.clientY-p.y)*.005))}
  p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd>0)rad=Math.max(.5,Math.min(40,rad*pd/d));pd=d}});
const fin=e=>{ptr.delete(e.pointerId);pd=0};cv.addEventListener('pointerup',fin);cv.addEventListener('pointercancel',fin);
cv.addEventListener('wheel',e=>{rad=Math.max(.5,Math.min(40,rad*(e.deltaY>0?1.1:.9)))},{passive:true});

/* ================= bucle ================= */
function loop(ms){
  const t=ms/1000,fl=1+.18*Math.sin(t*15)+.1*Math.sin(t*27);
  if(modoSala&&sala3d){sala3d.anim(t);
    const an=sala3d.anclas.filter(o=>o.tipo==='antorcha_pared'||o.tipo==='brasero').concat(sala3d.anclas.filter(o=>o.tipo!=='antorcha_pared'&&o.tipo!=='brasero')).slice(0,4);
    luces.forEach((l,i)=>{const o=an[i];if(!o){l.visible=false;return}l.visible=true;o.anchor.getWorldPosition(vp);l.position.copy(vp);l.intensity=7*fl})}
  else if(cur){cur.anim(t);if(cur.anchor){cur.anchor.getWorldPosition(vp);luces[0].position.copy(vp);luces[0].intensity=5*fl}}
  cam.position.set(tgt.x+rad*Math.cos(ph)*Math.sin(th),tgt.y+rad*Math.sin(ph),tgt.z+rad*Math.cos(ph)*Math.cos(th));cam.lookAt(tgt);
  renderer.render(scene,cam);requestAnimationFrame(loop)}
mostrar(tipos.indexOf('techo'));document.getElementById('cargando').remove();requestAnimationFrame(loop);
</script></body></html>
