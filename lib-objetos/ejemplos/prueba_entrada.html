<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';



/* ================= utilidades ================= */
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

function canvasTex(S, draw) {

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t;
}
const TC = {};

/* UV en metros para cajas */
function uvm(geo) {

  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * S[f][0], uv.getY(k) * S[f][1]); }
  uv.needsUpdate = true;
}

/* ================= texturas por código ================= */
const PALETAS = [
  { n: 'Roble oscuro', dark: [66, 43, 24], light: [112, 78, 45], vein: '28,16,8' },
  { n: 'Pino claro', dark: [134, 101, 62], light: [176, 139, 92], vein: '72,48,22' },
  { n: 'Madera vieja gris', dark: [80, 74, 66], light: [126, 118, 106], vein: '38,34,30' }];
const PAL = PALETAS;
let V = 0;
function setVariante(i) { V = ((i % PAL.length) + PAL.length) % PAL.length; return PAL[V].n; }
const getVariante = () => V;

function woodTex(v, rx, ry) {
  const key = 'w' + v + '_' + rx + '_' + ry; if (TC[key]) return TC[key]; const P = PAL[v];
  const t = canvasTex(256, (g, S) => {
    const r = rng(11 + v), n1 = vnoise(r, 32), n2 = vnoise(r, 64);
    for (let x = 0; x < S; x++) { const k = n1(x * .09) * .6 + n2(x * .4) * .4; g.fillStyle = mixc(P.dark, P.light, k); g.fillRect(x, 0, 1, S); }
    g.lineWidth = 1;
    for (let i = 0; i < 70; i++) {
      const x0 = r() * S, amp = 1 + r() * 3, f = .02 + r() * .04, ph = r() * 6.3; g.strokeStyle = 'rgba(' + P.vein + ',' + (.1 + r() * .25) + ')';
      for (const o of [-S, 0, S]) { g.beginPath(); for (let y = 0; y <= S; y += 8) { const x = x0 + o + Math.sin(y * f + ph) * amp; if (y) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke(); }
    }
    for (let i = 0; i < 3; i++) {
      const x = r() * S, y = r() * S, gr = g.createRadialGradient(x, y, 1, x, y, 10 + r() * 8); gr.addColorStop(0, 'rgba(' + P.vein + ',.55)'); gr.addColorStop(1, 'rgba(' + P.vein + ',0)');

    }
  });

}
function ironTex() {
  if (TC.iron) return TC.iron;
  return TC.iron = canvasTex(256, (g, S) => {
    const r = rng(5); g.fillStyle = '#3c3c40'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 5000; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '0,0,0' : '120,120,125') + ',' + r() * .18 + ')'; g.fillRect(r() * S, r() * S, 1 + r() * 2, 1 + r() * 2); }
    for (let i = 0; i < 9; i++) { const x = r() * S, y = r() * S, R = 14 + r() * 26, gr = g.createRadialGradient(x, y, 1, x, y, R); gr.addColorStop(0, 'rgba(120,62,28,.55)'); gr.addColorStop(1, 'rgba(120,62,28,0)'); g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2); }
  });
}
function clothTex() {
  if (TC.cloth) return TC.cloth;
  return TC.cloth = canvasTex(256, (g, S) => {
    const r = rng(9); g.fillStyle = '#9a8a6a'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < S; i += 3) { g.fillStyle = 'rgba(40,28,14,' + (.1 + r() * .18) + ')'; g.fillRect(0, i, S, 1); g.fillStyle = 'rgba(255,240,200,' + (.04 + r() * .1) + ')'; g.fillRect(i, 0, 1, S); }
    for (let i = 0; i < 1200; i++) { g.fillStyle = 'rgba(30,20,10,' + r() * .2 + ')'; g.fillRect(r() * S, r() * S, 2, 1); }
  });
}
function stoneTex() {
  if (TC.stone) return TC.stone;
  return TC.stone = canvasTex(256, (g, S) => {
    const r = rng(3); g.fillStyle = '#6a6864'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 7000; i++) { g.fillStyle = 'rgba(' + (r() < .5 ? '0,0,0' : '200,200,195') + ',' + r() * .14 + ')'; const s = 1 + r() * 3; g.fillRect(r() * S, r() * S, s, s); }
    g.strokeStyle = 'rgba(20,18,16,.45)'; g.lineWidth = 1;
    for (let i = 0; i < 4; i++) { let x = r() * S, y = r() * S; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 9; k++) { x += (r() - .5) * 28; y += (r() - .2) * 22; g.lineTo(x, y); } g.stroke(); }
  });
}
function llamaTex() {
  if (TC.llama) return TC.llama;
  return TC.llama = canvasTex(128, g => {
    const gota = (s, col) => {
      g.save(); g.translate(64, 170); g.scale(s, s); g.translate(-64, -170); g.beginPath(); g.moveTo(64, 6);
      g.bezierCurveTo(78, 70, 118, 120, 118, 170); g.bezierCurveTo(118, 225, 92, 250, 64, 250); g.bezierCurveTo(36, 250, 10, 225, 10, 170); g.bezierCurveTo(10, 120, 50, 70, 64, 6);
      g.closePath(); g.fillStyle = col; g.fill(); g.restore();
    };
    g.canvas.height = 256; g.clearRect(0, 0, 128, 256);
    [[1, 'rgba(255,90,10,.16)'], [.88, 'rgba(255,110,20,.22)'], [.74, 'rgba(255,150,40,.3)'], [.58, 'rgba(255,200,90,.4)'], [.4, 'rgba(255,235,170,.6)'], [.22, 'rgba(255,255,235,.85)']].forEach(a => gota(a[0], a[1]));
  });
}
const FL = () => { const t = llamaTex(); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t; };

/* ================= materiales y piezas ================= */
const M = o => new THREE.MeshStandardMaterial(o);
const W = (rx = 1.25, ry = 1.25) => M({ map: woodTex(V, rx, ry), roughness: .88 });
const FE = () => M({ map: ironTex(), roughness: .55, metalness: .35, side: THREE.DoubleSide });
const TE = (c = 0xffffff) => M({ map: clothTex(), color: c, roughness: 1 });
const PI = () => M({ map: stoneTex(), roughness: .95 });
function box(w, h, d, x, y, z, mat, par) { const g = new THREE.BoxGeometry(w, h, d); uvm(g); const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); par.add(m); return m; }
function cil(rt, rb, h, x, y, z, mat, par, seg = 14) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); par.add(m); return m; }
function lathe(pts, mat, par, seg = 24) { const m = new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg), mat); par.add(m); return m; }
function toro(R, r, x, y, z, mat, par, rx = Math.PI / 2) { const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, 8, 24), mat); m.position.set(x, y, z); m.rotation.x = rx; par.add(m); return m; }
function materialPiedra() { return PI(); }

/* ================= fuego: llama en capas + chispas ================= */
function mkFuego(esc, brasas) {
  const g = new THREE.Group(), sp = [];
  [[.20, .42, 0xff6a10, .85], [.14, .34, 0xffa63a, .9], [.07, .2, 0xfff0b8, 1]].forEach(([w, h, c, o], i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: FL(), color: c, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: o }));
    s.center.set(.5, .08); s.userData = { w: w * esc, h: h * esc, ph: i * 2.1 }; s.scale.set(w * esc, h * esc, 1); g.add(s); sp.push(s);
  });
  const N = brasas || 0; let pts = null, pos = null; const fase = [];
  if (N) {
    pos = new Float32Array(N * 3); const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffa040, size: .02 * Math.max(1, esc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    pts.frustumCulled = false; g.add(pts); for (let i = 0; i < N; i++) fase.push(Math.random());
  }
  const upd = t => {
    sp.forEach(s => { const u = s.userData, f = Math.sin(t * 13 + u.ph) * .5 + Math.sin(t * 23 + u.ph * 1.7) * .5; s.scale.set(u.w * (1 + .07 * f), u.h * (1 + .16 * f + .06 * Math.sin(t * 5 + u.ph)), 1); s.material.rotation = .09 * Math.sin(t * 6.5 + u.ph); });
    if (pts) { for (let i = 0; i < N; i++) { const l = (t * .45 + fase[i]) % 1; pos[i * 3] = Math.sin(t * 2.7 + i * 1.9) * .05 * l * esc; pos[i * 3 + 1] = .05 * esc + l * .7 * esc; pos[i * 3 + 2] = Math.cos(t * 2.3 + i * 1.3) * .05 * l * esc; } pts.geometry.attributes.position.needsUpdate = true; }
  };
  return { g, upd };
}

/* ================= OBJETOS ================= */
function buildTorch() {
  const root = new THREE.Group(), h = new THREE.Group(); root.add(h);
  const mw = W(1, 3), fe = FE();
  lathe([[.026, 0], [.03, .1], [.035, .3], [.04, .38], [.049, .42], [.04, .46], [.044, .6], [.047, .8], [.05, .9]], mw, h, 16);
  lathe([[.05, .84], [.058, .88], [.07, .95], [.082, 1.0], [.078, 1.0], [.066, .95], [.05, .9]], fe, h, 20);
  toro(.07, .007, 0, .93, 0, fe, h);
  for (let i = 0; i < 5; i++) { const ga = new THREE.Group(); ga.rotation.y = i / 5 * Math.PI * 2; h.add(ga); const p = box(.014, .2, .01, .082, 1.08, 0, fe, ga); p.rotation.z = -.22; }
  const tela = TE(0x5e4c3a);
  lathe([[.0, .96], [.06, .97], [.078, 1.02], [.095, 1.1], [.092, 1.17], [.074, 1.23], [.04, 1.26], [0, 1.268]], tela, h, 20);
  [[.08, 1.03], [.094, 1.1], [.088, 1.16], [.062, 1.22]].forEach(a => toro(a[0] + .004, .006, 0, a[1], 0, M({ color: 0xb39d73, roughness: 1 }), h));
  const c = new THREE.Mesh(new THREE.CircleGeometry(.045, 14), M({ color: 0x14100c, emissive: 0xff4a00, emissiveIntensity: .8, roughness: 1 })); c.rotation.x = -Math.PI / 2; c.position.y = 1.262; h.add(c);
  const f = mkFuego(1, 14); f.g.position.y = 1.24; h.add(f.g);
  const anchor = new THREE.Object3D(); anchor.position.y = 1.32; h.add(anchor);
  return { root, anim: f.upd, anchor };
}

function buildWallTorch(p) {
  const root = new THREE.Group(), fe = FE();
  if (p.bloque) box(.9, 1.5, .26, 0, .75, -.13, PI(), root);
  box(.14, .24, .02, 0, .74, .01, fe, root);
  [[-.04, .82], [.04, .82], [-.04, .66], [.04, .66]].forEach(q => { const r = new THREE.Mesh(new THREE.SphereGeometry(.012, 8, 6), fe); r.position.set(q[0], q[1], .03); root.add(r); });
  box(.03, .03, .34, 0, .74, .18, fe, root);
  const piv = new THREE.Group(); piv.position.set(0, .74, .36); piv.rotation.x = .3; root.add(piv);
  toro(.058, .011, 0, 0, 0, fe, piv);
  const t = buildTorch(); t.root.position.set(0, -.5, 0); piv.add(t.root);
  box(.03, .03, .2, 0, .4, .1, fe, root);
  return { root, anim: t.anim, anchor: t.anchor };
}

function buildCandle(esc = 1, par) {
  const g = par || new THREE.Group(), cera = M({ color: 0xe8dcbc, roughness: .55 });
  lathe([[0, 0], [.021, 0], [.022, .03], [.019, .15], [.015, .17], [.004, .172]].map(q => [q[0] * esc, q[1] * esc]), cera, g, 14);
  const d = new THREE.Mesh(new THREE.SphereGeometry(.007 * esc, 8, 6), cera); d.scale.set(1, 2.6, 1); d.position.set(.019 * esc, .12 * esc, 0); g.add(d);

  const f = mkFuego(.16 * esc, 0); f.g.position.y = .186 * esc; g.add(f.g);
  const a = new THREE.Object3D(); a.position.y = .22 * esc; g.add(a);
  return { root: g, anim: f.upd, anchor: a };
}
function buildVela(p) { const b = new THREE.Group(), c = buildCandle(p.esc); b.add(c.root); return { root: b, anim: c.anim, anchor: c.anchor }; }

function buildCandelabro() {
  const root = new THREE.Group(), fe = FE(), an = [];
  lathe([[0, 0], [.12, 0], [.13, .02], [.07, .06], [.035, .12], [.03, .4], [.045, .43], [.03, .46], [.028, .6]], fe, root, 20);
  const ux = [-.26, 0, .26], uy = [.78, .86, .78];
  ux.forEach((x, i) => {
    const cur = new THREE.CatmullRomCurve3([new THREE.Vector3(0, .55, 0), new THREE.Vector3(x * .45, .5, 0), new THREE.Vector3(x, .58, 0), new THREE.Vector3(x, uy[i] - .1, 0)]);

function buildMesa(p) {
  const { w, d, h } = p, root = new THREE.Group(), wd = W();
  const lw = Math.max(.06, Math.min(.1, .05 + .012 * w)), ins = .04, n = Math.max(2, Math.round(d / .2)), pw = d / n;
  for (let i = 0; i < n; i++) { const t = box(w, .05, pw - .004, 0, h - .025 + (i % 2) * .003, -d / 2 + pw * (i + .5), wd, root); t.rotation.y = (i - n / 2) * .002; }

function buildSilla(p) {
  const { w, d, h } = p, root = new THREE.Group(), wd = W(), sh = h * .48, hx = w / 2 - .03, hz = d / 2 - .03;

function buildBarril(p) {

function buildCaja(p) {
  const { w, h, d } = p, root = new THREE.Group(), wd = W(), fe = FE();
  box(w - .02, h, d - .02, 0, h / 2, 0, wd, root);

function buildEstante(p) {

  const pivot = new THREE.Group(); pivot.position.set(0, -t / 2, .35); pivot.add(d.fin().root); root.add(pivot);
  const cad = [-1, 1].map(x => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, 1, 6), matHierro()); m.rotation.order = 'ZXY'; m.castShadow = true; root.add(m); return { m, x: x * (w / 2 - .12) }; });
  const actualizar = th => {
    pivot.rotation.x = th;
    cad.forEach(c => {
      const ty = -t / 2 + l * Math.cos(th), tz = .35 + l * Math.sin(th), ay = l + .45, az = .47, dx = 0, dy = ay - ty, dz = az - tz, len = Math.hypot(dy, dz) || 1;
      c.m.position.set(c.x, (ty + ay) / 2, (tz + az) / 2); c.m.scale.set(1, len, 1); c.m.rotation.set(Math.asin(dz / len), 0, Math.atan2(-dx, dy));
    });
  };
  actualizar(0);
  const obj = { root, anchor: null, mec, anim: tt => { actualizar(mec.paso(tt) * P3 / 2); },
    abrir: () => mec.ir(1, 'lento'), cerrar: () => mec.ir(0, 'lento'), soltar: () => mec.ir(1, 'caida'),
    alternar: () => { if (mec.objetivo >= .5) obj.cerrar(); else obj.abrir(); }, estado: () => mec.valor, esAbierto: () => mec.objetivo >= .5 };
  return marcar(obj);
}

function palancaPro(p) {
  const { modo, largo } = p, mec = crearMec(3.2, 0), root = new THREE.Group(), suelo = modo >= .5, escucha = [];
  const b = pNuevo(), ba = b.add, m = pNuevo(), ma = m.add, L = suelo ? largo * 1.6 : largo;
  if (!suelo) {
    ba('mad', RB(.34, .46, .03, .006), { pos: [0, 0, -.015], eje: 1 });
    ba('fe', RB(.26, .36, .02, .004, 1), { pos: [0, 0, .01] });
    [[-.1, .15], [.1, .15], [-.1, -.15], [.1, -.15]].forEach(q => ba('fe', new THREE.SphereGeometry(.014, 6, 4), { pos: [q[0], q[1], .024] }));
    ba('fe', new THREE.CylinderGeometry(.04, .04, .03, 10), { pos: [0, 0, .035], rot: [P3 / 2, 0, 0] });
    [-1, 1].forEach(sg => ba('fe', RB(.03, .05, .03, .004, 1), { pos: [sg * Math.sin(.95) * L, Math.cos(.95) * L, .03] }));
  } else {
    ba('fe', RB(.34, .16, .26, .01), { pos: [0, .08, 0] });
    ba('piedra', RB(.4, .04, .32, .008), { pos: [0, .02, 0], eje: 0, tile: 1 });
    [-1, 1].forEach(sg => ba('fe', RB(.03, .05, .03, .004, 1), { pos: [0, .17, sg * Math.sin(.8) * L * .5] }));
  }
  ma('fe', new THREE.CylinderGeometry(.012, .012, L, 6), { pos: [0, L / 2, 0] });
  ma('fe', new THREE.CylinderGeometry(.012, .012, .1, 6), { pos: [0, -.05, 0] });
  ma('mad', new THREE.SphereGeometry(.035, 8, 6), { pos: [0, L + .02, 0], tint: .9 });
  const maneta = new THREE.Group(); maneta.add(m.fin().root); maneta.position.set(0, suelo ? .17 : 0, suelo ? 0 : .05);
  root.add(b.fin().root); root.add(maneta);
  const obj = { root, anchor: null, mec, en: false,
    anim: t => { const v = mec.paso(t), ang = .8 - 1.6 * v; if (suelo) maneta.rotation.x = ang * .9; else maneta.rotation.z = ang; },
    fijar: on => { obj.en = !!on; mec.ir(obj.en ? 1 : 0, 'lento'); escucha.forEach(f => f(obj.en)); },
    alternar: () => obj.fijar(!obj.en), conectar: fn => { escucha.push(fn); return obj; },
    abrir: () => obj.fijar(true), cerrar: () => obj.fijar(false), soltar: () => obj.fijar(false), estado: () => mec.valor, esAbierto: () => obj.en };
  maneta.rotation.z = .8;
  return marcar(obj);
}

/* ================= registro ================= */
const DEFS_L3 = {
  roca: { nombre: 'Roca', f: rocaPro, params: { r: [.2, 3, .8, .05], alto: [.4, 1.5, .8, .05], forma: [0, 1, .4, .05], musgo: [0, 1, .5, .05], semilla: [1, 60, 1, 1] } },
  rocal: { nombre: 'Conjunto de rocas', f: rocalPro, params: { n: [1, 12, 5, 1], r: [.3, 2, .8, .05], forma: [0, 1, .4, .05], musgo: [0, 1, .5, .05], semilla: [1, 60, 1, 1] } },
  parche_tierra: { nombre: 'Parche de tierra', f: tierraPro, params: { w: [2, 40, 12, 1], d: [2, 40, 10, 1], rug: [0, 1, .5, .05], semilla: [1, 60, 1, 1], sendero: [0, 1, 0, 1], piedritas: [0, 1, .5, .05] } },
  parche_pasto: { nombre: 'Parche de pasto', f: pastoPro, params: { w: [1, 40, 10, 1], d: [1, 40, 8, 1], altura: [.2, 1.2, .6, .05], densidad: [.2, 3, 1, .1], semilla: [1, 60, 1, 1], borde: [0, 1, .6, .05], rug: [0, 1, .5, .05], semillaSuelo: [1, 60, 1, 1], ox: [-100, 100, 0, .5], oz: [-100, 100, 0, .5], sendero: [0, 1, 0, 1], wSuelo: [2, 40, 12, 1] } },
  reja: { nombre: 'Reja levadiza', f: rejaPro, params: { w: [1.2, 5, 2.4, .1], h: [2, 5, 3.2, .1], sep: [.1, .3, .16, .01], marco: [0, 1, 1, 1] } },
  puente_levadizo: { nombre: 'Puerta-puente levadizo', f: puentePro, params: { w: [2, 5, 3, .1], l: [2.5, 6, 4, .1], marco: [0, 1, 1, 1] } },
  palanca: { nombre: 'Palanca', f: palancaPro, params: { modo: [0, 1, 0, 1], largo: [.3, .8, .5, .02] }, ancla: 'borde', elev: 1.1 },
};
const HUELLAS_L3 = {
  roca: p => [p.r * 2.2, p.r * 2.2], rocal: p => [p.r * 4, p.r * 4], parche_tierra: p => [p.w, p.d], parche_pasto: p => [p.w, p.d],
  reja: p => [p.w + 1, .8], puente_levadizo: p => [p.w + 1.2, p.l + 1], palanca: () => [.4, .3],
};
const TIPOS_LOTE3 = Object.keys(DEFS_L3);

function registrarLote3() {
  for (const k in DEFS_L3) CATALOGO[k] = Object.assign({}, CATALOGO[k] || {}, DEFS_L3[k]);
  Object.assign(HUELLA, HUELLAS_L3);
  Object.assign(ETIQUETAS, { largo: 'Largo', rug: 'Rugosidad', semilla: 'Semilla', sendero: 'Sendero (0/1)', piedritas: 'Piedritas', altura: 'Altura', densidad: 'Densidad', borde: 'Borde irregular', ox: 'Desfase x', oz: 'Desfase z', semillaSuelo: 'Semilla del suelo', wSuelo: 'Ancho del suelo', sep: 'Separación barras', forma: 'Forma (0 redonda, 1 angular)', musgo: 'Musgo', alto: 'Alto (proporción)', modo: 'Modo (0 pared, 1 suelo)', marco: 'Marco de piedra (0/1)' });
}

registrarPro();registrarLote3();

/* ===== escena de día ===== */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec3d9);scene.fog=new THREE.Fog(0x9ec3d9,35,90);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(2,3.2,16);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(0,2.2,2);ctl.maxPolarAngle=Math.PI*.49;ctl.update();
scene.add(new THREE.HemisphereLight(0xdcecff,0x4a5c3a,.9));
const sun=new THREE.DirectionalLight(0xfff0d0,1.4);sun.position.set(14,22,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:80});scene.add(sun);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ===== muralla de piedra con la abertura ===== */
const mw=pNuevo();
mw.add('piedra',RB(12,7,.8,.02),{pos:[-8,3.5,0],eje:1,tile:1.6});
mw.add('piedra',RB(12,7,.8,.02),{pos:[8,3.5,0],eje:1,tile:1.6});
mw.add('piedra',RB(4,2.9,.8,.02),{pos:[0,5.55,0],eje:1,tile:1.6});
for(let i=-13;i<=13;i+=2)mw.add('piedra',RB(1,.7,.9,.02),{pos:[i,7.35,0],eje:1,tile:1.6});
const muralla=mw.fin().root;scene.add(muralla);

/* ===== suelo: tierra con sendero, patio, pasto y rocas ===== */
let semilla=3;const objetos=[];
function agregar(o,x,y,z,ry){o.root.position.set(x,y,z);if(ry)o.root.rotation.y=ry;scene.add(o.root);objetos.push(o);return o}
let reja,puente,palanca,antorchas=[];
function construirEntorno(){
  objetos.splice(0).forEach(o=>scene.remove(o.root));antorchas=[];
  agregar(crearObjeto('parche_tierra',{w:30,d:22,rug:.45,semilla,sendero:1,piedritas:.8}),0,0,11.5);
  agregar(crearObjeto('parche_tierra',{w:30,d:14,rug:.3,semilla:semilla+2,piedritas:.4}),0,0,-7.5);
  const P=[[-11.5,12,9,12],[12.5,13,9,12],[-11,19,12,6]];
  P.forEach((q,i)=>agregar(crearObjeto('parche_pasto',{w:q[2],d:q[3],altura:.6,densidad:1.2,semilla:semilla+i,borde:.7,rug:.45,semillaSuelo:semilla,ox:q[0],oz:q[1]-11.5,sendero:0,wSuelo:30}),q[0],0,q[1]));
  agregar(crearObjeto('parche_pasto',{w:20,d:10,altura:.5,densidad:1,semilla:semilla+9,borde:.6,rug:.3,semillaSuelo:semilla+2,ox:0,oz:-7.5-(-7.5),sendero:0,wSuelo:30}),0,0,-7.5);
  const R=((s)=>()=>{s=(s*16807)%2147483647;return s/2147483647})(semilla*97+11);
  agregar(crearObjeto('rocal',{n:6,r:1.1,forma:.5,musgo:.6,semilla}),-7.5,0,3);
  agregar(crearObjeto('rocal',{n:7,r:1.4,forma:.6,musgo:.5,semilla:semilla+4}),9,0,4.5);
  agregar(crearObjeto('roca',{r:2.1,alto:1.2,forma:.7,musgo:.6,semilla:semilla+7}),-13,0,9);
  agregar(crearObjeto('roca',{r:1.7,alto:1,forma:.6,musgo:.4,semilla:semilla+8}),14,0,12);
  for(let i=0;i<9;i++){const lado=i%2?1:-1;agregar(crearObjeto('roca',{r:.3+R()*.5,alto:.6+R()*.4,forma:.3+R()*.5,musgo:R(),semilla:semilla+20+i}),lado*(5.6+R()*1.6),0,2.5+i*2.1+R(),R()*6)}
  agregar(crearObjeto('rocal',{n:4,r:.8,forma:.4,musgo:.5,semilla:semilla+12}),-4.6,0,-4,0);
  /* mecanismos */
  reja=agregar(crearObjeto('reja',{w:3,h:3.8,marco:1}),0,0,0);
  puente=agregar(crearObjeto('puente_levadizo',{w:3,l:4,marco:0}),0,0,0);
  palanca=agregar(crearObjeto('palanca',{modo:0}),-4.4,1.5,.4);
  palanca.conectar(on=>{if(on){reja.abrir();puente.abrir()}else{reja.soltar();puente.cerrar()}});
  [-1,1].forEach(x=>antorchas.push(agregar(crearObjeto('antorcha_pared',{bloque:0}),x*3.1,2.1,.4)));
}
construirEntorno();

/* ===== controles ===== */
const hud=document.getElementById('hud');
document.getElementById('bpal').onclick=()=>palanca.alternar();
document.getElementById('breja').onclick=()=>reja.alternar();
document.getElementById('bpue').onclick=()=>puente.alternar();
document.getElementById('bsem').onclick=()=>{semilla++;construirEntorno()};
document.getElementById('bver').onclick=()=>{camera.position.set(-4.4,1.9,3.2);ctl.target.set(-4.4,1.5,.4);ctl.update()};
/* tocar la palanca (o la reja/puente) para accionarla */
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let d0=null;
renderer.domElement.addEventListener('pointerdown',e=>{d0={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!d0||Math.hypot(e.clientX-d0.x,e.clientY-d0.y)>6)return;
  pt.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(pt,camera);
  const hit=ray.intersectObjects(objetos.filter(o=>o.alternar).map(o=>o.root),true)[0];
  if(hit){let o=hit.object;while(o&&!(o.userData&&o.userData.mecanismo))o=o.parent;if(o)o.userData.mecanismo.alternar()}});
const pct=v=>Math.round(v*100)+'%';
(function loop(ms){const t=ms/1000;objetos.forEach(o=>o.anim&&o.anim(t));
  hud.innerHTML='Toca la palanca (o usa los botones) · reja '+pct(reja.estado())+' abierta · puente '+pct(puente.estado())+' bajado · palanca '+(palanca.en?'ACTIVADA':'desactivada');
  ctl.update();renderer.render(scene,camera);requestAnimationFrame(loop)})(0);
